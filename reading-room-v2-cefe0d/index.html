<style>

*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}

.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
/* ---- rail ---- */
nav{border-right:1px solid var(--rule);padding:2rem 1.2rem;position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(var(--paper-deep),var(--paper))}
nav h1{font-family:var(--disp);font-weight:600;font-size:1.15rem;letter-spacing:.02em;margin-bottom:.2rem}
nav .sub{font-size:.72rem;color:var(--ink-soft);font-style:italic;margin-bottom:1.4rem}

  text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
nav button{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;background:none;border:none;

.grades label{flex:1;text-align:center;border:1px solid var(--rule);border-radius:3px;padding:.4rem 0;
  font-family:var(--disp);font-weight:600;cursor:pointer;background:#fffdf6}
.grades input{display:none}
.grades label:has(input:checked){background:var(--accent);color:var(--paper);border-color:var(--accent)}
.nav2{max-width:34.5rem;margin:2rem auto 0;display:flex;justify-content:space-between;font-family:var(--disp)}
.nav2 button{background:none;border:1px solid var(--ink);border-radius:3px;padding:.55rem 1.1rem;
  font:inherit;font-family:var(--disp);font-weight:600;font-size:.85rem;cursor:pointer}
.nav2 button:hover{background:var(--ink);color:var(--paper)}
.nav2 button:disabled{opacity:.3;pointer-events:none}
.kbd{text-align:center;font-size:.7rem;color:var(--ink-soft);margin-top:1.2rem}
kbd{border:1px solid var(--rule);border-radius:3px;padding:0 .35em;font-family:var(--disp)}
@media(max-width:760px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule)}}

<script>
const DATA=[{"premise": "The Inspector", "stories": [{"id": "LU6", "title": "The Tolerance Stack", "html": "<p>The shop smelled like coolant and scorched aluminum, the way it always did at eleven at night. Dana Reyes sat on a stool at the granite plate with a bore gauge in one hand and a titanium bracket in the other, and the only sound besides the compressor cycling was the tick of the gauge finding its home.</p>\n<p>Point-two-four-nine-eight. Inside tolerance by a thousandth and a half. Dana set the bracket in the accepted tray and pulled the next one out of the bin without looking, the way you pick up a coffee cup.</p>\n<p>There were sixty-one left.</p>\n<p>Ruben came through the roll-up door with his jacket already on, keys hooked in two fingers. He'd been closing out the Haas cell since seven.</p>\n<p>\"You want me to run these through in the morning?\" he said.</p>\n<p>\"They ship Thursday.\"</p>\n<p>\"It's Tuesday.\"</p>\n<p>\"They ship Thursday morning. Eight a.m. pickup.\"</p>\n<p>Ruben stood there a second longer than he needed to. He was thirty-four, had been a machinist since nineteen, and had spent the last eight months asking Dana in a dozen indirect ways for something Dana kept not hearing.</p>\n<p>\"I could do the bore checks,\" he said. \"You'd have the run-out and the surface finish. That's the stuff that bites.\"</p>\n<p>\"It all bites.\"</p>\n<p>\"Dana.\"</p>\n<p>\"I've got it.\" Dana didn't look up. \"Go home. Marisol's going to think we're having an affair.\"</p>\n<p>Ruben laughed, but it came out of him flat, and the door rattled down behind him. Dana worked until two-forty. At the end there were four rejects, two of them borderline, and Dana wrote the borderline ones up anyway because borderline was a word that got people killed at forty thousand feet.</p>\n<p>---</p>\n<p>Here is what Dana knew about themself, and knew the way you know your own handwriting: they were not smarter than anyone at Coyle Precision. They were not a better machinist than Ruben, who could feel a dull tool through the floor. They had one thing, which was that they had never once in eleven years signed off on a part they had not personally looked at.</p>\n<p>That was the whole reputation. Customers said it like a joke at trade shows \u2014 <em>if it shipped, Dana touched it</em> \u2014 and then they said it seriously in purchasing meetings, and Coyle went from four people to nineteen on the back of it.</p>\n<p>Nineteen people, and one pair of eyes.</p>\n<p>---</p>\n<p>In March the orders doubled. A defense integrator in Torrance had a supplier go under, and Ken Coyle came back from a two-day trip with a contract that made him look ten years younger and Dana feel ten years older reading it.</p>\n<p>\"Four hundred a week,\" Ken said. He'd printed the schedule out and laid it on the desk like a card he was proud of. \"Ramping to six.\"</p>\n<p>\"Six hundred parts.\"</p>\n<p>\"Yeah.\"</p>\n<p>Dana did the arithmetic without meaning to. Full inspection ran about six minutes a part on the simple geometry, closer to twenty on anything with a true position callout. \"That's not a person's worth of hours, Ken. That's two and a half people.\"</p>\n<p>\"So hire two and a half people.\"</p>\n<p>\"Then it's not the same product.\"</p>\n<p>Ken sat down on the corner of the desk. He was sixty-one and had built the shop out of a two-car garage and he had a way of getting quiet that meant he was choosing between things he could say.</p>\n<p>\"It's the same parts,\" he said.</p>\n<p>\"It's not the same product. The product is that I look at them.\"</p>\n<p>\"Okay,\" Ken said. \"Then look at them.\"</p>\n<p>---</p>\n<p>Dana looked at them.</p>\n<p>April was fine. May was survivable. In June the shop went to two shifts and Dana started coming in at five-thirty and leaving at ten, and somewhere in there the granite plate became the only room Dana really lived in \u2014 the pool of task light, the tray of gauges laid out in the order of a habit so old it had no origin, the little bin of alcohol wipes.</p>\n<p>Ruben stopped asking. That should have registered. It didn't, because in July Dana caught a heat-treat scorch on a hinge fitting that the vendor's cert had passed clean, and the catch was worth thirty thousand dollars and possibly a great deal more than that, and everyone said <em>thank God Dana caught it</em>, and the sentence went into Dana like a load-bearing beam.</p>\n<p>By August the accepted trays were stacking three high on the outfeed cart because Dana couldn't get to them fast enough to release the paperwork. Parts sat finished for two days waiting on a signature. Ken started walking past the cart in the mornings the way you walk past a leak.</p>\n<p>\"We're late on everything,\" he said.</p>\n<p>\"We're late because I'm one person.\"</p>\n<p>\"I've been saying.\"</p>\n<p>\"You want me to stop checking?\"</p>\n<p>\"I want you to teach somebody to check.\"</p>\n<p>\"Ken, it took me eleven years\u2014\"</p>\n<p>\"It took you eleven years to get good at it,\" Ken said. \"It took you about six months. The rest of it was the shop getting big enough to notice.\"</p>\n<p>---</p>\n<p>They hired a kid named Priya Nadar in September, twenty-six, four years at a medical device house, a metrology cert Dana had never bothered to get. Dana gave her the receiving inspection \u2014 incoming bar stock, hardware, purchased components. Nothing that shipped.</p>\n<p>Priya was good. Dana knew it in the first week and found it mildly irritating, the way she wrote up a nonconformance with photographs and a measurement plan attached, cleaner documentation than Dana had ever produced.</p>\n<p>In October Priya came to the granite plate holding a printout.</p>\n<p>\"I ran a study on the last four months of your inspection data,\" she said.</p>\n<p>\"My what?\"</p>\n<p>\"Your accept/reject logs. Your rejection rate on the Torrance brackets was 3.1 percent in April. It's 0.6 percent now.\"</p>\n<p>Dana kept measuring. \"We got better at running them.\"</p>\n<p>\"Maybe. The tool life data doesn't show it. The reamers are getting more cycles between changes, not fewer.\" She set the paper down on the corner of the granite where Dana would have to move it. \"I think you're tired.\"</p>\n<p>\"I'm fine.\"</p>\n<p>\"I didn't say you weren't fine. I said the numbers changed and the process didn't.\"</p>\n<p>Dana looked up then, and Priya did the thing that Dana would think about for a long time afterward: she did not look away, and she did not push. She just stood there with her printout, having done a piece of work correctly, waiting to see whether it counted.</p>\n<p>\"Leave it,\" Dana said. \"I'll read it.\"</p>\n<p>Dana read it at one in the morning, at home, standing in the kitchen with the light off. Then Dana put it in the recycling under a cereal box.</p>\n<p>---</p>\n<p>The call came on a Thursday in November.</p>\n<p>Ken took it in his office and then came out and stood in the doorway of the QC room with his hand still on the frame, and Dana knew from the hand.</p>\n<p>\"Torrance,\" Ken said. \"They've got eleven brackets out of tolerance on the counterbore depth. Point-oh-one-five deep. They found it in assembly.\"</p>\n<p>\"That's not possible.\"</p>\n<p>\"They sent photos of the gauge readings.\"</p>\n<p>\"Ken, I measured every one of those. Every single one.\"</p>\n<p>\"I know you did,\" Ken said, and that was the worst part, because he wasn't being kind. He was stating a fact that made the whole thing worse.</p>\n<p>---</p>\n<p>It took nine days to find. Dana didn't sleep much through them.</p>\n<p>The counterbore depth was checked with a depth mic against a setting standard, and the setting standard lived in a drawer under the plate, and the setting standard had been dropped. Not badly. Not visibly. Someone \u2014 and it was never determined who, and Dana stopped wanting to know \u2014 had knocked it off the plate onto the rubber mat sometime in late summer, picked it up, and put it back.</p>\n<p>It read four thousandths short. Everything Dana measured against it came out four thousandths shallow, so Dana had spent three months machining a correction into the process that didn't need to exist, cutting deeper and deeper to make a wrong number come out right.</p>\n<p>The standard was on a twelve-month calibration cycle. It had six months to go.</p>\n<p>Priya found it. She found it by doing what she had done in October \u2014 pulling the data, seeing the drift, then walking the drift backward through every element of the measurement system until something didn't line up. She did it in a conference room with printouts taped to the wall in a grid, and she came and got Dana when she was sure, not before.</p>\n<p>\"It's the standard,\" she said.</p>\n<p>Dana picked it up. Half an inch of hardened steel, a number etched on the side, the most boring object in the building. Dana had touched it four hundred times a week for three months and it had lied every time, in the same direction, by the same amount, and there had been nobody in the loop to catch it because Dana <em>was</em> the loop.</p>\n<p>The recall was ninety-one parts. Three had gone into a subassembly. The subassembly had not flown.</p>\n<p>---</p>\n<p>Ken didn't fire anybody. He did something Dana found harder to sit through, which was that he called a meeting and asked Priya to present the root cause analysis to the customer, and Priya did it in thirty-eight minutes with a corrective action plan that included cross-checks between two independent inspectors on any dimension with a tolerance under five thousandths.</p>\n<p>Torrance kept the contract. They said the response was the most professional they'd seen from a shop that size.</p>\n<p>Afterward Dana found Ruben at the Haas cell, blowing chips off a fixture.</p>\n<p>\"You knew,\" Dana said. \"You knew something was off.\"</p>\n<p>Ruben shut the airline. \"I knew the counterbores were running deep. I figured you had a reason.\"</p>\n<p>\"You could have said something.\"</p>\n<p>\"I did.\" He said it without heat, which somehow made it land harder. \"In June. I said the depths looked hot on the setup sheet. You said you'd checked them.\"</p>\n<p>Dana stood there in the noise of the shop with nothing available to say.</p>\n<p>\"I stopped bringing you things,\" Ruben said, \"because bringing you things didn't do anything. That's not \u2014 I'm not throwing that at you. It's just what happened.\"</p>\n<p>---</p>\n<p>In February the shop ran six hundred and forty parts in a week.</p>\n<p>Dana was at the granite plate for maybe two hours of it. The rest of the time was spent in the little office off the QC room writing measurement plans \u2014 this dimension, this gauge, this frequency, this second set of eyes \u2014 and then arguing about them with Priya, who had opinions, and then rewriting them.</p>\n<p>Ruben ran first-article on the new hinge program and brought Dana the report, and Dana signed it having looked at the report and not the parts, and felt something in their chest go tight and stay tight for about ten minutes and then, gradually, not.</p>\n<p>The setting standards went on a six-month cycle. There were two of each now, and one got checked against the other every Monday morning by whoever opened, and the log for it hung on a clipboard by the door where anybody walking past could see it, which was the point.</p>\n<p>In March a customer at a trade show in Long Beach shook Dana's hand and said the old line \u2014 <em>if it shipped, you touched it</em> \u2014 with the warmth of a person repeating something true.</p>\n<p>\"Not anymore,\" Dana said.</p>\n<p>The customer's face did something complicated.</p>\n<p>\"Four of us touch it now,\" Dana said. \"Different ones for different things. It's better.\"</p>\n<p>And the customer laughed, uncertain, waiting for the rest of it, and Dana let them wait, and then changed the subject to the weather in Ohio, which was terrible, and they talked about that instead.</p>"}, {"id": "TP1", "title": "The Green Stamp", "html": "<p>At eleven minutes past six, Dana Reyes found the burr.</p>\n<p>It lived where the coordinate machine could not see it, a silver eyelash curled inside the cross-drilled oil passage of an actuator yoke. The bore measured true. The pin gauge entered with the soft pneumatic kiss Dana wanted. Every number on the inspection report sat neatly between its limits.</p>\n<p>Dana turned the part beneath the bench light, following the cut with a dental mirror.</p>\n<p>\u201cThere,\u201d they said.</p>\n<p>Lena Park bent close. She smelled of coolant and the peppermint gum she chewed when running titanium. \u201cI don\u2019t see it.\u201d</p>\n<p>Dana changed the angle. The burr flashed and disappeared.</p>\n<p>\u201cIf that comes loose,\u201d Dana said, \u201cit goes into the bearing.\u201d</p>\n<p>Lena went still.</p>\n<p>The yoke was one of twelve for a company in Wichita that built flight-control actuators. A bearing that seized inside one could lock an elevator surface. The machine shop did not make aircraft, only pieces small enough to hold in one hand, pieces that vanished inside assemblies and were forgotten unless something went wrong.</p>\n<p>Dana carried the yoke to the stereo microscope. At thirty power, the burr became a hooked blade.</p>\n<p>Mitch Sorrell, the owner, came out of his office while Dana was photographing it. He wore his coat and carried a thermos, ready to leave until he saw their face.</p>\n<p>\u201cHow bad?\u201d</p>\n<p>Dana pointed at the monitor.</p>\n<p>Mitch looked from the magnified burr to the foam-lined tray containing the other eleven yokes.</p>\n<p>\u201cWe already boxed those.\u201d</p>\n<p>\u201cI\u2019m reopening them.\u201d</p>\n<p>The boxes were cut apart. Each yoke was cleaned, scoped, and cleaned again. Three more had burrs. Dana quarantined the lot, called the customer, then called the toolmaker at home. By nine, Lena had changed the drill geometry. By midnight, she was cutting test pieces while Dana stood behind her with folded arms.</p>\n<p>The next morning, Mitch told the customer what had happened.</p>\n<p>By afternoon, the customer\u2019s quality director had told someone else. Within a month, a framed email hung in the lobby beside the AS9100 certificate.</p>\n<p>IF IT SHIPPED, DANA TOUCHED IT.</p>\n<p>Mitch had printed the sentence in blue.</p>\n<p>For three years, it brought work through the door.</p>\n<p>By the fourth, there was no room left on the production board.</p>\n<p>Travelers crowded Dana\u2019s desk in slanted stacks, each plastic sleeve containing the life story of a part: alloy heat, machine, operator, tool changes, dimensions, deviations, washes, signatures. Green tape marked jobs ready for final inspection. By late spring, green had colonized the room.</p>\n<p>Dana arrived before the first shift and left after the second. On Saturdays, they brought their own coffee because the burner in the break room scorched everything to tar. On Sundays, the shop sounded different. Without voices and forklifts, the machines seemed to breathe in their sleep.</p>\n<p>Nothing shipped without Dana\u2019s stamp.</p>\n<p>On a Sunday in June, Lena found them asleep upright at the comparator, chin against their chest. A first-article turbine spacer lay under the glass.</p>\n<p>She set a paper cup beside Dana\u2019s hand.</p>\n<p>Dana woke with a hard intake of breath.</p>\n<p>\u201cYou\u2019re drooling on the optical equipment,\u201d Lena said.</p>\n<p>\u201cI was blinking.\u201d</p>\n<p>\u201cFor eight minutes?\u201d</p>\n<p>Dana rubbed the bridge of their nose and reached for the spacer.</p>\n<p>\u201cIt\u2019s good,\u201d Lena said. \u201cI ran it twice.\u201d</p>\n<p>\u201cI know.\u201d</p>\n<p>\u201cYou haven\u2019t looked at the report.\u201d</p>\n<p>\u201cI know you ran it twice.\u201d</p>\n<p>Dana centered the crosshair on the spacer\u2019s edge. Lena watched them measure the radius she had measured at two that morning, and again at five.</p>\n<p>\u201cYou trust the machine more if you\u2019re the one pressing the button?\u201d</p>\n<p>\u201cI trust you.\u201d</p>\n<p>\u201cThat\u2019s not what I asked.\u201d</p>\n<p>Dana adjusted the focus. The edge sharpened, black against green.</p>\n<p>Lena had come to the shop at nineteen, with a certificate from the community college and a habit of asking why before asking how. Dana had taught her to feel a worn spindle bearing through the soles of her boots. She could hear chatter before it marked a surface. On complicated five-axis work, she was faster than anyone in the building and scrapped less.</p>\n<p>The spacer\u2019s radius was perfect.</p>\n<p>Dana wrote the number beside Lena\u2019s identical number and initialed it.</p>\n<p>Lena picked up the coffee she had brought and drank it herself.</p>\n<p>\u201cI got an offer,\u201d she said.</p>\n<p>The comparator\u2019s fan hummed.</p>\n<p>\u201cFrom whom?\u201d</p>\n<p>\u201cMercer Aerostructures.\u201d</p>\n<p>\u201cThey\u2019re forty minutes farther.\u201d</p>\n<p>\u201cThey\u2019d make me a manufacturing engineer.\u201d</p>\n<p>\u201cYou\u2019re a machinist.\u201d</p>\n<p>\u201cI know what I am.\u201d</p>\n<p>Dana lifted the spacer from the glass. \u201cMitch can give you another two dollars.\u201d</p>\n<p>\u201cThey\u2019ll let me sign my own first articles.\u201d</p>\n<p>\u201cThey have six quality engineers.\u201d</p>\n<p>\u201cThey let machinists certify.\u201d</p>\n<p>\u201cUntil somebody misses something.\u201d</p>\n<p>Lena rolled the empty cup between her palms, creasing it with small dry cracks. \u201cThey want an answer Friday.\u201d</p>\n<p>Dana set the spacer in its foam pocket.</p>\n<p>\u201cI\u2019ll talk to Mitch.\u201d</p>\n<p>\u201cDon\u2019t.\u201d</p>\n<p>That evening, Dana stopped at La Estrella, their aunt Rosa\u2019s restaurant, because Rosa had been leaving messages for nine days.</p>\n<p>The kitchen pass was crowded with plates. Two cooks worked the line, one finishing mole with sesame seeds while the other sent out fish in banana leaves. Rosa sat at a corner table shelling peas with her granddaughter.</p>\n<p>Years ago, Rosa had cooked every plate herself. She had slept in the office during festival weekends and once left a wedding to correct a stockpot. Now she came in three afternoons a week. Her cooks changed the rice, then the hours, then the menu. The restaurant remained full.</p>\n<p>Rosa kissed Dana\u2019s cheek and pushed over a bowl of pozole.</p>\n<p>\u201cYou look terrible,\u201d she said pleasantly.</p>\n<p>\u201cBig order.\u201d</p>\n<p>\u201cYou always have a big order.\u201d</p>\n<p>Her granddaughter, Isabel, held up a pea pod. \u201cThis one has nine.\u201d</p>\n<p>\u201cImpossible,\u201d Rosa said.</p>\n<p>They counted. It had nine.</p>\n<p>At the pass, a young cook tasted the mole, added salt, tasted again. Rosa did not turn around.</p>\n<p>Dana ate two bowls. Rosa packed a third for later and added a bag of sweet rolls Dana had not requested.</p>\n<p>\u201cAre you going home?\u201d she asked.</p>\n<p>\u201cThe shop.\u201d</p>\n<p>\u201cThen take napkins.\u201d</p>\n<p>That was all.</p>\n<p>The order that broke them was a rush lot of hinge lugs for an unmanned surveillance aircraft. Sixty-four parts, hard-anodized black, each with a narrow ligament between two bores. The customer had lost time to a design revision and offered a premium for delivery before a desert flight demonstration.</p>\n<p>Lena machined the lugs across two nights. She inspected every bore and ligament, then placed sixty-three parts in a blue tray. One went into a red tray with an orange tag.</p>\n<p>THIN WALL, she wrote. .0032 UNDER MIN.</p>\n<p>Dana found the trays at one in the morning Thursday. The shipping deadline was eight.</p>\n<p>They had twenty-seven other parts awaiting release.</p>\n<p>Lena stood beside the desk in her street clothes, backpack over one shoulder. \u201cBlue is good. Red is scrap. The reports are done.\u201d</p>\n<p>Dana opened the blue traveler.</p>\n<p>\u201cYou could sample them,\u201d Lena said.</p>\n<p>\u201cNo.\u201d</p>\n<p>\u201cThe process held.\u201d</p>\n<p>\u201cNo sampling on flight hardware.\u201d</p>\n<p>\u201cYou\u2019re not checking the process. You\u2019re checking me.\u201d</p>\n<p>Dana picked up the bore micrometer.</p>\n<p>Lena waited. \u201cMercer needs my answer tomorrow.\u201d</p>\n<p>\u201cThis is not the time.\u201d</p>\n<p>\u201cThere is never a time.\u201d</p>\n<p>Dana measured the first lug.</p>\n<p>At three, Lena left.</p>\n<p>At four, Dana\u2019s hands began to tremble. They ate one of Rosa\u2019s sweet rolls over the sink and washed the sugar from their fingers. They measured the remaining lugs, recorded sixty-three conforming pieces, then lifted the rejected lug from the red tray and confirmed Lena\u2019s measurement.</p>\n<p>Three thousand two ten-thousandths below minimum.</p>\n<p>Lena had been right.</p>\n<p>Dana marked the orange tag VERIFIED and carried the lug toward the quarantine cage. The shop phone rang before they reached it.</p>\n<p>The customer\u2019s expediter wanted fifty parts on the six-thirty courier. Mitch appeared in the inspection doorway barefoot in loafers, shirt buttons misaligned.</p>\n<p>\u201cCan we release fifty?\u201d</p>\n<p>\u201cWhen I\u2019m done.\u201d</p>\n<p>\u201cYou\u2019ve been here all night.\u201d</p>\n<p>\u201cSo have the parts.\u201d</p>\n<p>They argued beside the trays while the courier called twice. Dana moved the red tray off the desk to make room for shipping documents. When Mitch went to wake the packer, Dana returned to the comparator and rechecked three profiles they had already checked.</p>\n<p>At six-ten, the packer came in with two foam cases.</p>\n<p>\u201cWhich ones?\u201d</p>\n<p>Dana gestured without looking up. \u201cBlue tray.\u201d</p>\n<p>The red tray was blue.</p>\n<p>The actual blue tray sat on a rolling cart near the quarantine cage, where Dana had placed it while clearing the desk. Beneath the inspection lamps, every tray looked gray except for its rim.</p>\n<p>The packer loaded fifty parts, including the rejected lug. Dana counted them, compared serial numbers to the traveler, and pressed their green stamp into the release box.</p>\n<p>The defective lug had the correct serial number. Lena\u2019s orange tag lay facedown beneath the foam.</p>\n<p>The aircraft broke six days later.</p>\n<p>It happened forty feet above a dry lake bed in Nevada. The hinge lug fractured during a banking maneuver. The aircraft rolled, struck the ground, and cartwheeled through its own sensor array. No one was hurt. The airframe, worth more than the shop\u2019s building, burned until only the wing tips remained recognizable.</p>\n<p>The customer sent photographs before sending investigators.</p>\n<p>Dana stared at one in the conference room. In the foreground, half-buried in chalky dirt, lay a black crescent of metal.</p>\n<p>The fracture surface passed through the thin ligament.</p>\n<p>The investigators arrived with sealed cases. They took Dana\u2019s records, the remaining lugs, the micrometer, the comparator files, and the security video.</p>\n<p>On the video, at 6:12:43, Dana\u2019s own hand lifted the rejected lug from the wrong tray and placed it in foam.</p>\n<p>Their green stamp appeared at 6:18.</p>\n<p>The customer canceled every open order. Mitch laid off the weekend shift and sold one of the five-axis machines to cover the first insurance payment. For months afterward, pale rectangles remained on the floor where its feet had protected the concrete from oil and light.</p>\n<p>Lena did not answer Friday. She had accepted Mercer\u2019s offer Thursday night.</p>\n<p>On her last day, she emptied her toolbox into two cardboard cartons. Dana found her wrapping a brass edge finder in a shop rag.</p>\n<p>\u201cI gave you a good part and a bad part,\u201d she said.</p>\n<p>Dana looked at the empty drawers.</p>\n<p>\u201cYes.\u201d</p>\n<p>\u201cYou checked both.\u201d</p>\n<p>\u201cYes.\u201d</p>\n<p>Lena taped the first carton shut. She did not say she was sorry, and Dana was grateful to her for that.</p>\n<p>At the door, she placed her shop key in Dana\u2019s palm. The key was warm.</p>\n<p>Three months later, work began to return.</p>\n<p>Not the flight-control customer. That account was gone. Smaller orders came first: instrument housings, seat-track fittings, brackets for weather satellites. Mitch rehired two people, but the empty machine space stayed empty.</p>\n<p>On a Tuesday afternoon, a young machinist named Omar brought Dana a tray of stainless-steel collars. He had worked at the shop eleven weeks.</p>\n<p>\u201cFirst article,\u201d he said.</p>\n<p>Dana set down their loupe.</p>\n<p>Omar placed the report beside the tray. His figures were square and deliberate. A second sheet showed the probe calibration. He had added a photograph of the setup without being asked.</p>\n<p>Dana read the numbers.</p>\n<p>\u201cWho checked your method?\u201d</p>\n<p>\u201cMae.\u201d</p>\n<p>\u201cMae, come here.\u201d</p>\n<p>Mae came from the CMM room. She was older than Dana and had been inspecting parts since before Omar was born. Dana had given her an authorization stamp that morning. It was still clean around the edges.</p>\n<p>\u201cYou agree with his result?\u201d Dana asked.</p>\n<p>Mae nodded. \u201cI watched the setup. Repeated three features. It\u2019s good.\u201d</p>\n<p>Dana\u2019s hand moved toward the nearest collar.</p>\n<p>They stopped with their fingers above it.</p>\n<p>From the shipping room came the rip of packing tape. Outside, the afternoon courier backed toward the dock, beeping steadily.</p>\n<p>Dana closed the loupe case.</p>\n<p>They slid the traveler across the bench to Mae and turned the green stamp handle toward her.</p>"}, {"id": "TP2", "title": "Setting Ring", "html": "<p>At eleven on a Saturday night the shop was down to its sounds: the compressor cycling in the back, the ballast hum in the inspection room, the tick of the granite plate giving up the day's heat. Dana Reyes stood over sixty titanium fittings laid out in six rows of ten and set the bore gauge into the setting ring for the fourth time in an hour.</p>\n<p>Zero. The needle hadn't moved. It never moved. Dana checked anyway, then lowered the gauge into fitting forty-one and rocked it through the bore, watching the needle swing and settle at its low point. Plus two tenths. Inside. Dana wrote it on the log in the small square print that receiving inspectors in three states could recognize on sight, and moved the fitting from the left row to the right.</p>\n<p>The travelers stacked in the wire tray by the door already had ink on them. Teo had run all sixty on Thursday and Friday, stamped every one QC-4, and left them where Dana would find them. Dana had found them. Dana had also pulled all sixty parts back out of the accept bin, stripped the green tags off, put Teo's numbers out of mind, and started again at fitting one.</p>\n<p>The phone buzzed on the plate. Hal. <em>You still there.</em> Not a question.</p>\n<p><em>Leaving soon.</em></p>\n<p><em>Liar. Go home.</em></p>\n<p>Dana turned the phone face down and picked up forty-two.</p>\n<p>---</p>\n<p>Hal Brenner had owned the shop for thirty-one years and had run a Bridgeport by hand for the first fifteen of them, and it showed in how he stood in a doorway, like the doorway would move first. He came into inspection Monday morning holding a coffee he wasn't drinking.</p>\n<p>\"Corvid called,\" he said. \"They're taking the actuator fittings to two hundred a month. Starting this month.\"</p>\n<p>\"Good.\"</p>\n<p>\"And they want the current sixty Wednesday, not Friday. Truck's coming at seven.\"</p>\n<p>Dana kept the height gauge moving down a hydraulic block. \"They'll get them Wednesday.\"</p>\n<p>\"How.\"</p>\n<p>\"I'll finish them.\"</p>\n<p>\"You finished them. Teo finished them Friday. I saw the travelers.\" Hal set the coffee down on the granite. Dana picked it up without looking and moved it to the desk, and Hal had the decency to look sorry. \"Sixty parts, two inspectors, every part measured twice. You know what that is? That's thirty parts. That's a shop that does thirty parts.\"</p>\n<p>\"It's sixty parts I know about.\"</p>\n<p>\"Teo's been here two years. You trained him. He catches things.\"</p>\n<p>\"He catches things,\" Dana agreed. \"And I've caught things behind him.\"</p>\n<p>\"Once.\"</p>\n<p>\"Once is the number, Hal. Once is the whole reason for the number.\" Dana looked up. \"Ask anyone who buys from us. Ask Corvid. If it shipped...\"</p>\n<p>\"Dana touched it. I know. I say it too. I say it on sales calls.\" Hal picked his coffee back up. \"I'm about to say it to Corvid and then tell them we can't do two hundred, because Dana's got two hands.\"</p>\n<p>He went out. Dana stood a moment with both palms flat on the plate, feeling it cold through the calluses, and looked at the wire tray with Teo's sixty travelers in it, every one stamped, every one waiting.</p>\n<p>---</p>\n<p>Teo Vasquez came in after lunch pushing a cart with a manifold on it and a look he'd been building up to on the walk over. He was twenty-six, quiet, with the careful hands of someone who'd learned to measure before he'd learned to cut, because that was the order Dana taught it in. He parked the cart. He didn't leave.</p>\n<p>\"Serial thirty-seven,\" he said.</p>\n<p>\"What about it.\"</p>\n<p>\"The bore. I got plus six. Red-tagged it Friday. It's on my log.\" He waited. \"You pulled the tags.\"</p>\n<p>\"I pull all the tags. I start clean. You know that.\"</p>\n<p>\"I know that.\" He looked at the sixty fittings, most on the right now, a dozen still on the left, and it was true, there was no red on any of them. \"I just want to know if you get the same thing. So I know the gauge and I agree.\"</p>\n<p>\"I'll get to thirty-seven tonight.\"</p>\n<p>\"I could stand there while you do it.\"</p>\n<p>\"It's a one-person job.\"</p>\n<p>He almost said something else and didn't. He said, \"Bore gauge is due for cal Thursday,\" which Dana knew, and left the manifold, and went back out to the floor where the Haas was already running his next setup. That had been Hal's idea of a compromise. Teo half on the machine, half in inspection, stamping parts, and Dana behind him at night, stamping the stamp.</p>\n<p>---</p>\n<p>Tuesday Dana slept four hours and came in before the lights. The manifold took the morning. A first article for a new customer took the afternoon, sixty-one dimensions and a ballooned drawing and a phone call from an engineer in Wichita who wanted to talk about datum shift. By six the floor had emptied and the fittings were still on the plate where they'd been since Saturday, forty-eight on the right and twelve on the left, and Corvid's truck was thirteen hours out.</p>\n<p>Dana ate crackers standing up and zeroed the gauge.</p>\n<p>Forty-nine. Fifty. Every one of them the same motion: gauge in, rock, watch the needle fall and catch itself, read, write, move the part. Sixty times a bore was a bore, and Dana knew that a person could measure sixty of anything and be more tired at the end than after a day of running a machine, because a machine let you look away. Fifty-one. Fifty-two.</p>\n<p>Thirty-seven had been left for last without deciding to. Dana picked it up around midnight, turned it under the light, felt the weight, and put the gauge in. The needle came down and stopped a hair short of where the others had.</p>\n<p>Plus six.</p>\n<p>Dana held it there a while. Rocked it again. Plus six. Something moved in Dana's chest that was close to pride and close to something else, and Dana didn't stop to name it. Wrote it down. Set thirty-seven to the left, by itself now, the only part on that side of the plate. Went on to fifty-three.</p>\n<p>At two the compressor tripped and Dana walked out through the dark shop to reset the breaker and walked back with the smell of coolant and the taste of crackers and stood over the plate not remembering, for one second, which fitting was next. The log said fifty-three had been done. Fifty-four, then. Fifty-five. The pen was running out and Dana switched pens and the writing got smaller.</p>\n<p>At three the log was full and the plate was one row on the left and fifty-nine on the right, and Dana went down the columns one more time because that was what you did, reading serial numbers against readings, and the numbers went in the ink the way they always had.</p>\n<p>At four Dana wrote a red tag and tied it on and set that fitting on the nonconformance shelf, and counted fifty-nine into foam, and signed fifty-nine travelers, and put the QC-1 stamp to each one and felt the little bite of the steel through the paper each time. Then Dana sat down on the stool for the first time since six and looked at the wall until it was light enough to see the calendar on it.</p>\n<p>Hal found the boxes by the dock at six-forty, taped and labeled, and found Dana asleep in the truck in the lot with the seat back and the door locked, and did not knock.</p>\n<p>---</p>\n<p>The call came nineteen days later. Ruth Okafor ran quality at Corvid and had known Dana for nine years, and her voice on the phone had none of that in it.</p>\n<p>\"Actuator fitting, your lot, serial thirty-seven. Failed pressure test at assembly. We pulled it, we bored it, we got plus six tenths on the ID.\" A pause. \"It's got your stamp on it, Dana. I've got the traveler in my hand.\"</p>\n<p>\"That's not possible.\"</p>\n<p>\"That's what I said. Then I read the traveler again.\"</p>\n<p>\"I red-tagged thirty-seven.\"</p>\n<p>\"You red-tagged something.\" Ruth let that sit. \"It didn't fly. Nobody's hurt. But it got into an assembly and it got through our receiving on your name and I've got a corrective action request open and my director asking me why we do source-inspection waivers for a sixty-person shop. So. I need to know what happened.\"</p>\n<p>\"I'll call you back.\"</p>\n<p>Dana walked to the nonconformance shelf. One fitting, red tag, Dana's writing. Turned it to the light. The serial etched in the flange said thirty-eight.</p>\n<p>The gauge was calibrated Thursday, so it was the same gauge. Dana zeroed it in the ring and put it into thirty-eight and rocked it and the needle came down and stopped where all the good ones had stopped. Plus one. Good part. It had been sitting on a shelf for nineteen days, tagged bad, and thirty-seven had been sitting in a helicopter actuator in Ohio, tagged good.</p>\n<p>Dana pulled the log from the drawer. There was the column, and there was the writing at three in the morning, the smaller pen, the numbers marching down. Thirty-six, plus one. Thirty-seven, plus one. Thirty-eight, plus six. Fifty-two, fifty-three, fifty-four, and somewhere in there a line skipped and caught up on the next, so neat that the eye ran straight over it, that Dana's own eye had run straight over it twice.</p>\n<p>Out on the floor the Haas was cutting something. Teo's Friday log was on the clipboard on the tool crib wall where he always hung them, the ones Dana never took down. Dana went and stood in front of it and read down to thirty-seven. Plus six. <em>REJ</em>, in Teo's blocky capitals, and the initials, and the date, four days before Dana had ever touched the part.</p>\n<p>---</p>\n<p>Hal drove to Corvid himself and Dana went with him and neither one of them said Dana's name in the meeting when Ruth asked what the shop's plan was. Hal said Teo Vasquez's, and how long he'd been there, and who had trained him, and that he was being added as a final release inspector on the actuator program with immediate effect. Ruth wrote it down. She looked at Dana once, and Dana nodded, and that was the whole of it.</p>\n<p>The next Corvid lot came off the machine on a Wednesday. Teo carried the tray into inspection at four and put it on the plate and looked at Dana, who was on the CMM with the manifold family, and Dana looked back and said, \"Ring's in the top drawer,\" and returned to the manifold.</p>\n<p>At five-thirty Dana packed the tools and wiped down the plate and left, past the wire tray with the travelers in it, past Teo bent over fitting eleven with the gauge in his hands, out the side door into a parking lot that still had sun in it, which had not been true in some months.</p>\n<p>At home the phone buzzed on the kitchen counter a little after seven. Teo.</p>\n<p><em>Sixty out. Twelve read plus four. Inside. Let it go.</em></p>\n<p>Dana read it standing at the sink and read it again, and then turned the phone face down on the counter, and left it there.</p>"}, {"id": "DO7", "title": "The Last Part", "html": "<p>The CMM machine hummed in the corner like a refrigerator nobody remembered to unplug, and Dana Reyes stood at the granite surface plate with a dial indicator pressed to a titanium fitting the size of a walnut. The shop floor was empty. It was 9:47 on a Friday night, and the only light came from the inspection bay \u2014 two fluorescent tubes, one flickering \u2014 because Dana had hit only that switch on the way in.</p>\n<p>Fourteen parts left in the tray. Fourteen more before the Monday shipment to Meridian Aerospace could go out. Dana's lower back had begun that particular ache that meant six hours standing on concrete, and the coffee from the thermos had gone cold enough to taste like nothing.</p>\n<p>The dial indicator's needle swung. 0.0002. Within tolerance. Dana set the fitting into the good tray and picked up the next one.</p>\n<p>They had tried, once, to explain to the owner what this moment felt like. Not the inspection itself \u2014 that was rote, almost meditative \u2014 but the moment after, when the part either landed in the good tray or the bad one, and Dana knew. Not suspected. Knew. The way you know your own heartbeat. Meridian's procurement woman, Linda, had said it on a visit once, leaning against the doorframe of the inspection bay: if it shipped, Dana touched it. She'd said it like a compliment. Dana had taken it as one.</p>\n<p>Now it was Friday night and the thermos was empty and there were fourteen parts and Dana was the only person in the building.</p>\n<p>---</p>\n<p>Six months ago, there had been twenty orders a month. Now there were forty-three. Dana had noticed the change not in the paperwork \u2014 though the paperwork had doubled, tripled, become a geology of travelers and inspection reports stacked in mismatched trays \u2014 but in the feel of the shop. More voices. The machines running second shift. Carl, the owner, hiring two new machinists in their twenties who called everything \"sick\" and left their coolant bottles uncapped.</p>\n<p>The new machinists were good. Dana had watched their work. Tight tolerances, clean finishes, tool marks within spec. But watching wasn't the same as knowing, and knowing required touching, and touching required time, and time had become something Dana no longer had enough of, which was why Dana was here at 9:47 on a Friday with a cold thermos and a back that felt like someone had tightened a bolt between the vertebrae.</p>\n<p>Carl had said, three weeks ago, standing in the doorway with his safety glasses pushed up into his hair: \"What if we train Marco on first-pass inspection? You'd still do final.\"</p>\n<p>Dana had looked at the surface plate. At the indicator. At the tray of parts waiting. \"Marco's good.\"</p>\n<p>\"He's sharp. He caught that tool wear on the 17-series before I did.\"</p>\n<p>\"He did.\"</p>\n<p>\"So?\"</p>\n<p>\"So he's been here four months.\"</p>\n<p>Carl had nodded the way he nodded when he was going to do what he was going to do regardless, and then he'd said, \"We can't keep burning you out, Dana. You look like hell.\"</p>\n<p>\"I'm fine.\"</p>\n<p>\"You're here every night.\"</p>\n<p>\"I'm fine, Carl.\"</p>\n<p>He'd left it alone. That was one of the things Dana liked about Carl \u2014 he knew when to leave things alone. It was also, Dana thought later, one of the things that had let the orders double without anyone asking the question that mattered: what happens when one person becomes the whole system?</p>\n<p>---</p>\n<p>Saturday morning. Dana woke at 6:12 on the shop floor's pullout cot in the back office, the one that smelled like WD-40 and Carl's old jacket. The cot had not been intended for regular use. It was there for the occasional all-night run, the emergency job, the once-a-year crunch. It was now, effectively, Dana's second bed.</p>\n<p>Twelve parts left. Dana's hands were stiff. The right thumb, the one that worked the indicator's contact point, had a sore spot at the joint that didn't go away anymore.</p>\n<p>By noon, eight left. Dana ate a sandwich from the vending machine \u2014 the one that sold the same turkey on rye it had sold for three years \u2014 and inspected two more parts while chewing.</p>\n<p>By three, four left.</p>\n<p>At 4:20, Dana picked up the second-to-last fitting and felt, before the indicator confirmed it, that something was off. Not the diameter. Not the surface finish. Something in the geometry of the internal bore, a slight asymmetry that the indicator would catch if Dana set it up right, which meant switching to the bore probe, which meant five minutes of setup for a part that would probably pass anyway.</p>\n<p>Dana set up the bore probe.</p>\n<p>The reading came back at 0.0007 out of tolerance on the cylindricity. Bad part. Into the bad tray.</p>\n<p>The last part passed. Dana signed the traveler, loaded the good tray into the shipping container, and sealed it. Monday morning, the truck would take it to Meridian.</p>\n<p>On the drive home, Dana's phone buzzed. A text from Carl: <em>New order coming in Tuesday. Vought Industries. 60 fittings, same spec as Meridian.</em></p>\n<p>Dana read it at a red light and did not respond.</p>\n<p>---</p>\n<p>The Vought order arrived with a six-week deadline. Sixty fittings. Plus the forty-three standing monthly orders. Carl hired a third machinist. He also, without asking, put Marco through a two-week inspection training program at the community college, and on a Monday morning, Marco appeared in the inspection bay with his own indicator and a tray of Meridian parts.</p>\n<p>\"I'm doing first-pass,\" Marco said. Not a question. He'd been told.</p>\n<p>Dana looked at him. He was twenty-four. He had steady hands \u2014 Dana had noticed that before. He'd caught the tool wear on the 17-series. He was careful in a way that reminded Dana of themselves at twenty-four, which was both a comfort and not.</p>\n<p>\"Okay,\" Dana said.</p>\n<p>Marco inspected twelve parts that day. Dana re-inspected all twelve after he left, working late, the familiar rhythm. Ten passed. Two failed \u2014 one for a burr Marco had missed, one for a tolerance stack-up he'd measured correctly but interpreted wrong. Dana set both in the bad tray and said nothing to Marco the next morning, because the system was working: Marco did first pass, Dana did final, and if it shipped, Dana touched it.</p>\n<p>But the math was the math. Marco's first pass saved Dana from inspecting the obviously bad parts, but Dana still inspected every good one. The savings were marginal. The nights got longer.</p>\n<p>By week four of the Vought order, Dana was sleeping on the cot four nights a week. The thumb joint had graduated from sore to a low, persistent ache that made the indicator feel like it was vibrating even when it wasn't. Dana had started taking ibuprofen with the vending machine coffee, which tasted worse than the coffee alone, which was saying something.</p>\n<p>On a Wednesday, Dana caught a bad part from Marco's tray that was bad in a way Dana had never seen before \u2014 a metallurgical defect, a void in the titanium that looked like a bubble under the surface. Not Marco's fault. Not anyone's fault. But if it had shipped, if it had gone into a hydraulic assembly and failed under load, Meridian would have traced it back here, and \"if it shipped, Dana touched it\" would have become a different kind of sentence.</p>\n<p>Dana held the part up to the light. The void was barely visible. A hairline shadow under a polished surface.</p>\n<p>This was why Dana did what Dana did. This was the reason for every night and every weekend and every ache. Because the voids were there, and they didn't show up on the first pass, and they didn't show up in the math, and they didn't show up in Carl's order book. They showed up here, in the inspection bay, under Dana's indicator, at 10 p.m. on a Wednesday when everyone else had gone home.</p>\n<p>---</p>\n<p>Week five. The Vought deadline was nine days out. Dana was behind. Not catastrophically \u2014 two days, maybe three \u2014 but behind in a way that meant the cot and the cold coffee and the thumb that now hurt even when Dana wasn't holding anything.</p>\n<p>On Thursday night, Dana was thirty parts into a tray of forty when the indicator's needle stopped settling. It would swing to its reading and then drift, slowly, like it couldn't make up its mind. Dana tapped the base. Checked the zero. Swung the contact point off and back on. The needle drifted again.</p>\n<p>The indicator was failing. Not catastrophically \u2014 a worn pivot, probably, the kind of thing that happens to a dial indicator that's been used twelve hours a day for three years. But failing. Which meant the last ten parts had been inspected on a drifting needle, which meant Dana didn't know \u2014 for the first time in years, Dana did not actually know \u2014 whether those parts were good.</p>\n<p>Dana stood at the surface plate and looked at the ten parts in the good tray. Any of them could have the void. Any of them could be the one. And the indicator that would have caught it was now the thing that might have missed it.</p>\n<p>The shop was quiet. The CMM hummed. One fluorescent tube flickered.</p>\n<p>Dana could re-inspect all ten. But the indicator was unreliable. The CMM could do it, but the CMM probe had been due for calibration last month and Dana hadn't sent it out because there hadn't been time. The backup indicator was in Carl's office, in a drawer, and it hadn't been used in two years and probably needed zeroing, which would take an hour, and it was 11:15 on a Thursday night and the shipment was due Monday and there were still ten more parts in the un-inspected tray and forty-three monthly orders underneath that and a new indicator cost $1,200 and a three-week lead time and\u2014</p>\n<p>Dana picked up one of the ten parts and held it to the light. Looked for the void. Saw only titanium, polished and perfect, reflecting the fluorescent tube like a small, cold mirror.</p>\n<p>The part looked good. It probably was good. Dana's hands knew these parts \u2014 the weight, the finish, the way a good one sat in the palm. This one felt right.</p>\n<p>Dana set it back in the tray.</p>\n<p>Felt it. That was what it had come to. Not measurement. Not verification. Not the indicator's needle and the granite plate and the certainty that had built the shop's reputation. Just feel. Just a tired person holding a part in a bad light and deciding it was probably fine.</p>\n<p>Dana sat on the stool \u2014 the hard one, the one with the wobble that Carl had been meaning to fix for a year \u2014 and looked at the ten parts and then at the ten un-inspected ones and then at the indicator with its drifting needle, and understood something that had been arriving for months, the way the drift in the needle arrived, slow and then undeniable: the system had not broken because Dana wasn't working hard enough. It had broken because it was Dana. One person. One indicator. One pair of eyes. The bottleneck wasn't a problem to be solved with more hours and a cot and ibuprofen. The bottleneck was the architecture. And the architecture was Dana.</p>\n<p>Marco was at home. His indicator was in the bay, sitting on the bench where he'd left it. His indicator was newer. His eyes were younger. His hands were steady. He'd missed the burr and the tolerance stack-up, and he'd catch those next time, because he was learning, the way Dana had once learned, by being wrong in small ways before being right in large ones. But he wasn't here, because Dana had never said: <em>Do the final. I'll check your work in the morning.</em> Dana had said \"okay\" and then re-inspected everything in secret, which was not training. It was a wall.</p>\n<p>The ten parts sat in the tray. Dana didn't know if they were good. The needle drifted. The fluorescent tube flickered.</p>\n<p>On Monday, the truck came. The parts shipped. Dana had re-inspected six of the ten on the backup indicator, found them good, and packed the other four with a traveler that read, in Dana's handwriting, <em>Conforms to print.</em> The four had felt right. They had looked right. Dana did not know if they were right, and the not-knowing was a new thing, a thing that lived in the chest like a slow breath that wouldn't finish, and on Tuesday morning when Carl came in with the Vought follow-on order \u2014 eighty more fittings, eight-week delivery \u2014 Dana was sitting at the inspection bay with Marco's indicator calibrated and a training checklist printed out and the cot folded away.</p>\n<p>\"You look better,\" Carl said.</p>\n<p>\"I'm going to train Marco on final inspection,\" Dana said. \"Full final. Not first-pass. The whole thing.\"</p>\n<p>Carl looked at the checklist. Looked at Dana. \"You sure?\"</p>\n<p>\"No,\" Dana said. \"But I'm going to do it anyway.\"</p>\n<p>Carl nodded the way he nodded when he was going to do what he was going to do, and then he went to his office, and Dana sat at the bench and waited for Marco to arrive, and the CMM hummed, and the shop was quiet, and the not-knowing was still there in Dana's chest, and Dana let it stay.</p>"}, {"id": "BP7", "title": "If It Shipped", "html": "<p>Dana found it at 11:40 on a Tuesday night \u2014 a cold shut in the grain of a titanium bracket, no wider than a hair, running along the radius where the milling cutter had changed feed. The bracket was for a satellite deployment arm. In vacuum, after thermal cycling, the crack would propagate. The arm would bind. An instrument package worth two hundred million dollars would fail to open.</p>\n<p>Lot 4471. Fourteen parts. Dana had checked thirteen. This was the last one. Marcus had run the job. Marcus was the best machinist in the shop \u2014 maybe the best in the valley. His setups were immaculate. His finishes were clean. Dana checked his work the same as everyone's.</p>\n<p>The cold shut was there. Dana found it because Dana looked. That was the whole thing.</p>\n<p>Dana set the bracket on the granite plate under the comparator and confirmed what their fingertips already knew. Then they called the customer.</p>\n<p>\"Holding one part from 4471. Replacement in seventy-two hours.\"</p>\n<p>\"What would we do without you, Dana.\"</p>\n<p>Not a question. Dana heard it three, four times a month. If it shipped, Dana touched it. That was the shop's reputation, and the reputation was the shop.</p>\n<p>Dana logged the defect, tagged the bracket for scrap, and went back to the next crate.</p>\n<p>---</p>\n<p>By March the order book had doubled. Two new defense contracts, a medical device company that needed five hundred titanium bone plates a month, and the existing aerospace work that had built the shop in the first place. Reyes Quality Machining had eleven employees and one quality inspector, and the inspector was Dana.</p>\n<p>Dana had hired a part-time inspector in January. A woman named Sylvia, meticulous, twenty years in automotive QA. Dana watched her check a lot of bone plates on a Friday, and on Saturday Dana went back and re-checked them. Not because Sylvia was wrong. Because if Dana didn't, the plates might break. That was the math. It wasn't personal.</p>\n<p>Sylvia lasted six weeks.</p>\n<p>Marcus lasted longer, but Marcus was different. Marcus had been at the shop for three years. He could hold tenths on a manual mill. He understood grain direction, thermal expansion, the way different alloys behaved under different feeds. He was twenty-eight. He was already better than half the machinists Dana had worked with in twenty years, and he was getting better fast.</p>\n<p>But Dana checked everything Marcus made. Every part. Sometimes Dana would find a burr Marcus had missed, or a dimension that was in tolerance but trending toward the edge \u2014 not a defect, not yet, but the seed of one. Dana would bring it back. Marcus would look at it. He'd nod. He'd fix it. He never argued.</p>\n<p>In February, Marcus stopped flagging his own catches. Dana noticed. A hole that was two-tenths off nominal \u2014 Marcus would have caught that, would have written it up, would have brought it to Dana himself. But it came through without a note. Dana found it during inspection, tagged it, brought it back.</p>\n<p>\"Marcus, this hole's off. You see this?\"</p>\n<p>\"I saw it. It's in tolerance.\"</p>\n<p>\"It's trending. You should've flagged it.\"</p>\n<p>\"You were going to check it anyway.\"</p>\n<p>\"I check everything. That's not the point.\"</p>\n<p>\"I know it's not the point.\" He took the part back to rework. That was the end of the conversation, or it should have been.</p>\n<p>In March, Marcus came into the office on a Saturday. Dana was there, as always. The inspection backlog was three days deep. Dana was working through it with a micrometer, a thread plug set, and a pot of coffee that had gone cold two hours ago.</p>\n<p>Marcus sat down. He didn't usually sit down.</p>\n<p>\"I got an offer. GKN in Santa Clarita. They run five-axis cells. I'd be running my own cell in eighteen months.\"</p>\n<p>Dana set the micrometer down. \"You don't want to go to GKN. They're a body shop.\"</p>\n<p>\"I know what they are. They run their own quality. Each cell does its own first-article inspection. The operator signs off.\"</p>\n<p>\"And if the operator's wrong?\"</p>\n<p>\"Then it's on the operator.\" Marcus paused. \"Dana, I can't grow here. You re-check everything I do. I could hold a part up to the light and see God in the surface finish and it wouldn't matter until you looked at it.\"</p>\n<p>\"Because if I don't check it\u2014\"</p>\n<p>\"I know. If you don't check it, it'll break. I've heard you. I believe you believe it.\"</p>\n<p>Marcus didn't take the offer that week. He said he'd think about it. But the word was out. Everyone knew Marcus might leave.</p>\n<p>---</p>\n<p>Walt parked his truck in the lot behind the shop every morning at five-thirty. He made breakfast burritos and coffee, and he'd been doing it for four years, long enough that his truck was part of the building, part of the routine. Dana bought two burritos every morning \u2014 one for breakfast, one for later \u2014 and Walt never asked how the shop was going and Dana never asked how the truck was going. They just talked.</p>\n<p>Walt had owned a restaurant once. A real one, downtown, white tablecloths, a wine list. Dana had learned this in pieces over years \u2014 not because Walt was hiding it, but because Walt didn't narrate his life. He'd been a chef. He'd controlled everything. Every plate that left the kitchen passed through his hands. He'd worked service every night for nine years. Then something in his chest \u2014 not a heart attack, something adjacent, something the doctors gave a long name \u2014 and he sold the place and bought the truck.</p>\n<p>The restaurant was still open. Different owners. Walt's daughter ran the kitchen now. People still went there. The food was still good. Dana had eaten there once, after Walt mentioned it, and it was good. Not the same as when Walt cooked \u2014 or maybe it was, and Dana couldn't tell the difference, which was its own kind of answer.</p>\n<p>Walt didn't seem diminished. He seemed settled. He stood in his truck every morning and made burritos and talked about the weather and the Dodgers and seemed, in a way Dana couldn't name, complete. Whatever Walt had needed from controlling every plate, he no longer needed. The work continued. He didn't.</p>\n<p>Dana never asked him about it directly. It wasn't the kind of thing you asked. You watched, and you saw, and you filed it somewhere you didn't look at too often.</p>\n<p>---</p>\n<p>By April the backlog was five days. Customers who had once praised Dana's vigilance were now asking, carefully, whether Reyes Quality Machining could meet delivery dates. The aerospace contracts had penalty clauses. The medical device company needed volume. Dana was working until eleven most nights and coming in on Sundays. The shop was paying time-and-a-half on overtime that wasn't billed to any job.</p>\n<p>Dana's response was to check faster, not less. They reorganized the inspection bench, bought a second comparator, color-coded the workflow. They started skipping lunch. Their eyes ached by eight o'clock every night, a dull pressure behind the sockets that meant the micrometer readings were getting less reliable, which meant Dana went slower, which meant the backlog grew.</p>\n<p>Marcus gave his notice on a Monday. Two weeks. He was polite about it. He said it was about the cell at GKN, about running his own operation. He didn't say what he'd said in February, about the re-checking. He didn't need to.</p>\n<p>The week Marcus was leaving, the shop had a rush order: forty flanges for a defense subcontractor. Hardened steel, tight tolerances, threaded bores. The customer needed them Friday. Dana scheduled the job for Wednesday and Thursday \u2014 Marcus's last two days.</p>\n<p>Marcus ran the job. He set up the CNC, ran first article, deburred, cleaned. He brought the first part to Dana. Dana checked it. Every dimension in spec. Good finish. Clean threads. Dana signed off and Marcus ran the rest.</p>\n<p>Forty parts. Dana had to check forty parts by Friday morning.</p>\n<p>Dana started Thursday evening after Marcus left. The first ten went fast \u2014 clean parts, good work, Marcus at his best. Dana was tired but functioning. Parts eleven through twenty took longer. The eyes were going. Dana switched to the optical comparator for the bore dimensions, then back to the mic for the thread pitch. Twenty-five through thirty were the worst. It was after one in the morning. Dana's left eye had started to twitch, a tiny spasm in the lid that made the comparator image jump.</p>\n<p>Dana caught a burr on part twenty-seven. Flagged it, set it aside for deburring. Good catch. The system working.</p>\n<p>Dana finished part thirty-two at 2:15 and decided the last eight could wait for morning. They went home, slept four hours, came back at six.</p>\n<p>Walt was setting up the truck. Dana bought one burrito instead of two. Walt said nothing about it.</p>\n<p>Dana checked the last eight flanges between six-fifteen and seven-thirty. Clean. In spec. Signed off. Packed. Shipped at eight.</p>\n<p>Friday afternoon the customer called. Flange number thirty-one had a thread defect \u2014 a partial engagement in the root of the third thread pitch. Under load, it would crack. The flange was in a hydraulic assembly. If it failed, the assembly failed.</p>\n<p>Dana pulled the inspection log. Part thirty-one, checked at 1:40 AM. Thread plug gauge: pass. Micrometer on major diameter: in spec. Bore diameter: in spec. Dana had checked the threads. The plug gauge had gone in.</p>\n<p>But Dana had not checked the thread root. The root wasn't on the standard inspection plan. Dana had always checked thread roots anyway \u2014 it was one of the things that made Dana's inspection better than standard, the thing that caught what others missed. But at 1:40 in the morning, after eleven hours, with the left eye twitching, Dana had checked the plug gauge engagement and moved on. The root went unchecked. The defect passed.</p>\n<p>The part that broke was the part Dana checked. Not a part Dana missed, not a part that slipped through \u2014 a part that went through Dana's hands, on a night when Dana's hands were shaking and Dana's eyes were failing, because Dana was the only inspector, because Dana couldn't let go, because if Dana didn't check it, it would break.</p>\n<p>It broke anyway. It broke because Dana checked it tired.</p>\n<p>---</p>\n<p>The customer pulled the order. Not just the flanges \u2014 the entire contract. Reyes Quality Machining lost eighteen percent of its annual revenue in one phone call. Dana sat in the office after the call and looked at the wall.</p>\n<p>The shop couldn't keep running the way it ran. Dana knew this. Had known it, maybe, since January, since Sylvia, since the first time Marcus sat down. But knowing was different from the wall, from the empty space where the contract had been, from the flange with its cracked thread root sitting on the bench like an accusation.</p>\n<p>Marcus's last day was the same Friday. He cleaned his station, returned his tools, shook Dana's hand at the door. He said, \"You taught me a lot, Dana.\" He meant it. Dana could see that he meant it.</p>\n<p>Dana went back inside. The shop was quiet. The inspection bench was clean, the comparators off, the micrometers in their cases. The backlog was still there, smaller now without the defense contract, but still there. Still waiting for Dana's hands and Dana's eyes.</p>\n<p>Monday morning, Dana came in early. Walt was setting up the truck. Dana stood in the lot for a minute, watching him arrange the steam trays, fill the coffee urns, wipe the counter. Walt did each thing once. He didn't look back to check the coffee was full. He filled it and moved on.</p>\n<p>Dana went inside. They opened the inspection log and wrote a new procedure \u2014 thread root inspection, standard, for every threaded part. Then they wrote another: first-article sign-off by operator, with operator's name on the traveler. Not instead of Dana's inspection. Before it.</p>\n<p>Dana called two machinists into the office. Eddie, who'd been there four years, and Sofia, who'd been there eight months. Dana showed them the procedures. Eddie read the thread root spec and nodded \u2014 he'd done thread root checks at his last shop. Sofia asked one question about the sign-off form, then took the stack of travelers Dana held out.</p>\n<p>Dana walked with them to the floor. Eddie started a new lot \u2014 titanium brackets, similar to 4471. He ran the first part, deburred it, checked the dimensions against the print. He picked up the part and turned it in the light, studying the radius where the feed changed. He set it on the bench and reached for the inspection form.</p>\n<p>Dana watched his hand hover over the form. Dana's hand moved \u2014 not far, just a twitch toward the micrometer, the old pull. Dana put the hand in a pocket.</p>\n<p>Eddie signed the form. He wrote his name. He set the part on the bench for Dana to check, and Dana picked it up, and turned it, and looked, and set it back down, and signed beneath Eddie's name. But the order mattered. Eddie's name came first.</p>\n<p>Dana left the part on the bench and walked away. There were three more crates to inspect. Dana went to the first one, and before opening it, pulled a chair from the break room and set it beside the bench. Dana sat down to work. Dana had never sat down to inspect before.</p>\n<p>The mic felt different from the chair. The same instrument, the same part, but the angle of the arm was lower, the pressure on the anvil lighter. Dana adjusted, took the reading, wrote it down. The reading was good. The part was good. Dana moved to the next one.</p>"}, {"id": "FE6", "title": "The Granite Table", "html": "<p>The temperature in Bay 4 was held at sixty-eight degrees year-round. The air had no smell except the faint, dry metallic tang of ultrasonic detergent and the mineral odor of the three-ton slab of black granite sitting on steel isolators in the center of the room.</p>\n<p>Dana Reyes wiped the anvil of the ten-inch micrometer with a lint-free silk swatch.</p>\n<p>Outside the glass partition, the shop floor hummed with the twelve-thousand-RPM whine of the five-axis Mazaks hogging out aluminum billet under streams of milky emulsion. On this side of the glass, the only sound was the periodic hiss of the coordinate measuring machine\u2019s air bearings and the flat, rhythmic click of Dana\u2019s ratchet thimble.</p>\n<p><em>Click. Click. Click.</em></p>\n<p>Seven tenths. Plus zero point zero zero zero seven inches over nominal. Within the tolerance band by three tenths of a hair.</p>\n<p>Dana set the micrometer down on its fitted wooden cradle, picked up the purple felt-tip inspection pen, and drew a crisp checkmark inside the machined relief pocket of the manifold housing. It was part seventy-two of ninety.</p>\n<p>A hand reached over the granite table.</p>\n<p>\"I can take the bore diameters on seventy-three through eighty,\" Marcus said. He held a three-point internal micrometer, already calibrated against the master ring gauge resting in its felt box. \"I'll log the pitch runouts on the spreadsheet, then you just have to look over the summary.\"</p>\n<p>Dana did not hand the part over. Dana turned it slowly under the forty-watt magnifier, checking the corner rads where the ball-end mill had transitioned from the flange to the body.</p>\n<p>\"The air plug is faster for the bores,\" Dana said without looking up.</p>\n<p>\"Air plug's set up on Bay 2,\" Marcus said. \"I calibrated it at six this morning. Zeroed to fifty millionths.\"</p>\n<p>\"Air gauges drift when the sun hits the south wall,\" Dana said. \"The manifold expands two tenths if you handle it longer than twenty seconds. You have to let them soak on the granite ten minutes after the deburr wash.\"</p>\n<p>Marcus let his hands rest on his thighs. He was thirty, ex-Navy avionics, with neat cuticles and a habit of standing with his weight evenly balanced on both heels. He had been in Quality at Solano Aerotech for eight months.</p>\n<p>\"They've been sitting on the north bench since one o'clock, Dana. They're sixty-eight degrees all the way through.\"</p>\n<p>\"I'll get to them,\" Dana said.</p>\n<p>Marcus stood there for four seconds, his boots squeaking faintly against the ESD-safe floor wax, then turned back to the height gauge on bench three.</p>\n<p>Vance came through the heavy swinging door with a clipboard tucked into his belt. He was the plant manager, and his collar was perpetually soaked with sweat at the hollow of his throat. He smelled of machine oil and the sugar-free energy drinks he crushed in his fist before tossing them into the scrap bins.</p>\n<p>\"Tell me forty through ninety are in the shipping foam,\" Vance said.</p>\n<p>\"Seventy-two is done,\" Dana said.</p>\n<p>Vance closed his eyes for a long, disciplined second. \"The hot-fire test at Mojave is Monday at eight. Apex Freight has a flatbed backing into Dock 2 at four o'clock tomorrow morning. If those manifolds aren't strapped to the bed, we pay sixteen thousand dollars an hour for test stand downtime.\"</p>\n<p>\"If an O-ring groove is shallow by four tenths, the nitrogen purge blows the seal at four thousand PSI,\" Dana said, adjusting the focus ring on the comparator. \"Then they don't have a test stand to worry about.\"</p>\n<p>\"Marcus is a certified Level II metrology tech,\" Vance said, keeping his voice down, though Marcus was six feet away, facing the wall. \"His stamp is recognized by Lockheed, Boeing, and the FAA.\"</p>\n<p>\"The cert on the crate has my signature,\" Dana said. \"Apex buys from Solano because in eleven years, not one manifold with my stamp has ever leaked a drop of helium. Not one.\"</p>\n<p>\"That was when we were running thirty parts a month, Dana. We're running eighty a week.\" Vance tapped the clipboard against the side of the granite table. The sharp plastic crack made Dana's jaw tighten. \"You're living here. I saw your car in the lot at midnight on Tuesday. I saw it at five on Wednesday. You look like you're being hunted.\"</p>\n<p>\"I'm on seventy-three,\" Dana said, picking up the next housing.</p>\n<p>Vance looked at Marcus's back, then at the eighty-pound granite surface plate, then walked out. The door gave a slow pneumatic sigh as it seated against its rubber gasket.</p>\n<p><em>*</em></p>\n<p>At ten in the evening, the main shop went dark. The third-shift roughing mills were automated, their enclosures glowing with dull interior LEDs as flood coolant cascaded over spinning blocks of 7075-T6 aluminum.</p>\n<p>Marcus packed his depth micrometers into their velvet recesses. He clicked the brass latches shut and slid the boxes into the bottom drawer of his roll-away cabinet.</p>\n<p>\"Dana,\" he said.</p>\n<p>Dana sat on the tall swivel stool, hunched over the optical comparator. The green silhouette of an internal thread tooth was projected onto the frosted glass screen at fifty times its actual size. Dana's right eye was clamped shut; the left was red-veined, the iris swimming behind a smear of lens flare.</p>\n<p>\"I did the depth sweeps on the relief ports for the whole second batch,\" Marcus said gently. He laid a stack of yellow traveler sheets on the corner of the desk, weighed down with a brass parallel bar. \"Eight-one through ninety. Every single one is within three tenths on the seating face. Number eighty-six had a tiny cutter drag line across the chamfer\u2014maybe two tenths deep. I flagged it on the non-conformance slip, clipped it to the housing.\"</p>\n<p>Dana didn't turn away from the screen. \"Did you sweep the thread flank with the lead gauge or the optical?\"</p>\n<p>\"Optical,\" Marcus said. \"Just like the traveler says.\"</p>\n<p>\"The light bounces off the anodize prep,\" Dana said. Her voice was raspy from ten hours of cold air and black coffee. \"You have to run the steel pitch wire across the second thread crest. If the wire hangs up, the tap was dull.\"</p>\n<p>Marcus took his jacket from the hook by the coat rack. \"I checked the wire too, Dana. It floated clean. All of them.\"</p>\n<p>\"I'll verify them before I box them,\" Dana said.</p>\n<p>Marcus zipped his jacket. He stood near the door, his keys jangling once in his hand. For a moment he looked as if he were going to say something about the clock on the wall, or the grey skin under Dana\u2019s cheekbones, or the fact that forty-two housings still sat in their raw plastic totes waiting for final stamp. Instead, he reached out, switched off the overhead fluorescent bank above the empty benches to save the tubes, and left the room.</p>\n<p>The latch clicked.</p>\n<p>Dana was alone with the compressor hum.</p>\n<p><em>*</em></p>\n<p>By two in the morning, the silence in the shop had a physical weight, pressing against the eardrums like deep water.</p>\n<p>Dana\u2019s neck burned where the trapezius met the base of the skull. The left eyelid had developed a dry, rhythmic fluttering that blurred the hairline reticle on the comparator every few seconds. Dana pressed the heel of a hand into the eye socket, held it there until purple geometric shapes bloomed in the dark, then blinked hard against the fluorescent glare.</p>\n<p>Part eighty-one.</p>\n<p>Dana picked up the air plug, slid it into the main bore of housing eighty-one, and watched the float tube on the column gauge. The little red bead bobbed, suspended on a cushion of sixty-PSI shop air.</p>\n<p>Right on the nominal line.</p>\n<p>Dana set eighty-one in the green shipping crate, nested inside its die-cut polyfoam cutout.</p>\n<p>Part eighty-two.</p>\n<p>Bore was nominal. Flange flatness within two tenths.</p>\n<p>Part eighty-three.</p>\n<p>Dana's fingers were numb at the tips from the constant chilled solvent of the wipe-down rags. The aluminum parts felt colder than sixty-eight degrees now; they felt like blocks of river ice.</p>\n<p>At three-fifteen, Dana reached for the yellow-flagged part Marcus had set aside: housing eighty-six.</p>\n<p>Dana peeled off Marcus\u2019s non-conformance tag. Marcus had written in his clean, architectural block letters: <em>Minor cutter drag line on secondary O-ring chamfer. Possible leak path at 3,000 PSI. Recommend re-face.</em></p>\n<p>Dana mounted eighty-six on the rotary chuck under the forty-power microscope. The light ring cast a bright white halo on the aluminum. Dana turned the fine-feed dial with a thumb and forefinger that felt thick, like wooden pegs.</p>\n<p>There was the line. A silvery eyelash across the forty-five-degree chamfer.</p>\n<p>Dana touched it with the tip of a dental pick.</p>\n<p>The steel tip didn't catch. Or rather, Dana couldn't feel it catch. The thumb was too cold, the nerves deadened by eighteen hours of vibrating metal and steel knurling.</p>\n<p>Dana blinked. The twitch in the eyelid dragged a film of tears across the cornea, smearing the silver line into a fuzzy grey smudge.</p>\n<p><em>It\u2019s just burnish,</em> Dana thought. <em>The deburr wheel dragged an aluminum flake across the land. It\u2019s not a step. It\u2019s visual.</em></p>\n<p>Dana looked at the wall clock. 3:28 AM.</p>\n<p>If Dana rejected the housing, the mill was shut down, the setup broken down. Vance would have to wake a setup machinist, get the five-axis zeroed again, re-cut a single part from raw stock, run the full cycle, send it to wash, send it to stress relief. It would take four hours. Apex Freight would arrive at four.</p>\n<p>Dana looked back through the eyepiece. The silver mark seemed fainter now. Dana's left eye was watering continuously, running down the crease beside the nose.</p>\n<p><em>Marcus was being cautious,</em> Dana told the empty room. <em>He\u2019s young. He doesn't know the difference between a tool gouge and a shadow in the grain.</em></p>\n<p>Dana took the green inspection stamp, rolled the rubber letters in the purple ink pad, and pressed it hard into the corner of traveler eighty-six.</p>\n<p><em>D. REYES \u2014 QA 01.</em></p>\n<p>Dana dropped eighty-six into slot eighty-six of the shipping crate.</p>\n<p>Then came eighty-seven. Eighty-eight. Eighty-nine. Ninety.</p>\n<p>By three-fifty, the crate was full. Ninety pockets of blue-gray anodized housings, each with its purple ink mark gleaming under the fluorescent lights. Dana\u2019s hands were shaking so hard that the heavy pneumatic strapping tool chattered against the fiberglass bands before biting down and crimping the steel seals.</p>\n<p>Dana dropped the traveler packet into the clear vinyl envelope, peeled the adhesive backing, and slapped it onto the side of the crate.</p>\n<p>At 4:02 AM, the air brakes of the Apex Freight flatbed hissed out in the alleyway.</p>\n<p>Dana opened the roll-up door into the raw, freezing morning air. The diesel exhaust poured in, sharp and acrid, cutting through the clean smell of the metrology room.</p>\n<p>The driver, an older man with a dirty knit cap, wheeled his pallet jack into the bay. \"This the hot load for Mojave?\"</p>\n<p>\"This is it,\" Dana said.</p>\n<p>\"All good?\"</p>\n<p>Dana looked at the crate. The wood was clean, the straps taut, the vinyl envelope sealed with the red tamper-evident Solano Aerotech tape.</p>\n<p>\"If it's in the crate,\" Dana said, \"it\u2019s right.\"</p>\n<p>The driver hooked the pallet jack, pumped the handle three times until the skids lifted off the concrete, and dragged the ninety manifolds out into the fog.</p>\n<p><em>*</em></p>\n<p>Dana did not go home.</p>\n<p>There was no point; the day shift would start arriving at six-thirty. Dana went into the small breakroom, sat on the vinyl couch that smelled of old upholstery foam, pulled a canvas shop jacket over both shoulders, and closed both eyes.</p>\n<p>The darkness inside Dana\u2019s skull was full of spinning dial needles, green reticles, and the infinite, terrifying descent of vernier scale lines that never quite aligned.</p>\n<p><em>*</em></p>\n<p>At ten-thirty in the morning, the sound of the phone ringing in Bay 4 woke Dana with a jolt that sent an electric spike through the chest.</p>\n<p>Dana stood up too fast; the room tilted. The mouth tasted of copper and stale grounds.</p>\n<p>Dana walked out of the breakroom into the blinding daylight of the main shop floor. The morning shift was running full bore; twenty machines were cutting steel and titanium, the chips singing as they hit the polycarbonate doors.</p>\n<p>Marcus was at his bench in Bay 4, wearing a clean shop coat, measuring a batch of fuel-rail fittings with a thread micrometer. He looked up as Dana entered.</p>\n<p>The phone on the wall was still chirping its flat, electronic pulse.</p>\n<p>Vance was standing by the desk. He wasn't holding his clipboard. His arms were hanging straight down at his sides, his fists unclenched, which was worse.</p>\n<p>\"Pick it up,\" Vance said.</p>\n<p>Dana took the receiver off the cradle. \"Reyes.\"</p>\n<p>\"Dana. It's Frank Hallowell at AeroDyne Mojave.\" Frank's voice was coming through a speakerphone, backgrounded by the hollow, echoing roar of a hangar. \"We just finished incoming receiving on the manifold lot.\"</p>\n<p>Dana straightened the spine instinctively. \"The travelers are all signed. Full traceability on the heat lots is in the sleeve.\"</p>\n<p>\"Dana, what happened to your eyes?\" Frank asked.</p>\n<p>The line went very quiet. On the other side of the glass, a Mazak tool-changer slammed a two-inch shell mill into its spindle with a heavy <em>thunk</em>.</p>\n<p>\"What do you mean?\" Dana asked.</p>\n<p>\"Part eighty-six,\" Frank said. \"My receiving tech caught it with his bare thumbnail before he even put it on the comparator. There\u2019s a cutter gouge across the secondary seal face four thousandths deep. It looks like an end-mill chipped and dragged a tooth across the land on the retract stroke.\"</p>\n<p>Dana\u2019s throat closed. \"That was... that was evaluated as a surface burnish.\"</p>\n
