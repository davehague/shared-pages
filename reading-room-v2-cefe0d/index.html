f what comes next.\u201d</p>\n<p>\u201cHe\u2019s six.\u201d</p>\n<p>\u201cHe won\u2019t be six long.\u201d</p>\n<p>Ada set a glass in the rack harder than necessary.</p>\n<p>Frank placed the dry plate on the stack. \u201cYou think I don\u2019t know he\u2019s struggling. I know. But there are two kinds of mercy. There\u2019s taking the weight away, and there\u2019s showing somebody he can carry it. Don\u2019t get so good at the first that you forget the second.\u201d</p>\n<p>Upstairs, Theo called, \u201cGrandpa, are you reading?\u201d</p>\n<p>Frank hung the towel over the oven door.</p>\n<p>\u201cIf I\u2019m invited.\u201d</p>\n<p>\u201cYou\u2019re invited,\u201d Theo shouted.</p>\n<p>Frank read all of <em>The Little Island</em>, without skipping the pages Ren usually shortened. When Theo interrupted, Frank tapped the line with one square fingernail and said, \u201cLet me finish this sentence.\u201d Theo waited.</p>\n<p>In December, Ada\u2019s sister held a birthday dinner at an Italian restaurant. They nearly declined. Then Ada said they could not live forever between the kitchen and the bathtub.</p>\n<p>The restaurant had hanging copper pans and a waiter who sang for birthdays. Ren packed crackers, headphones, and the picture card. Ada showed Theo the menu online. Frank promised to sit beside him.</p>\n<p>For forty minutes, it worked.</p>\n<p>Then the dining room dimmed. Eight waiters appeared clapping, bearing a cake armored with sparklers. Everyone began singing.</p>\n<p>Theo went under the table.</p>\n<p>Ada reached for him. He kicked backward, striking Frank\u2019s shin.</p>\n<p>\u201cDon\u2019t grab me!\u201d</p>\n<p>A sparkler spit white light. Someone laughed\u2014not at Theo, but the sound found him anyway. He crawled between chairs, overturned a water glass, and ran.</p>\n<p>Ren caught him in the vestibule. Theo struck the glass door with both hands while diners entering stepped around them.</p>\n<p>In the car, Ada held the headphones over Theo\u2019s ears. Ren drove. Neither spoke.</p>\n<p>At home, Theo vomited on the front mat.</p>\n<p>After they had cleaned him and changed him and put him to bed without a bath, Ren found Ada sitting on the kitchen floor.</p>\n<p>\u201cWe knew,\u201d she said.</p>\n<p>\u201cWe thought he could manage.\u201d</p>\n<p>\u201cWe wanted him to manage because we wanted dinner.\u201d</p>\n<p>\u201cThat\u2019s allowed.\u201d</p>\n<p>\u201cIs it?\u201d</p>\n<p>Ren sat across from her, knees touching hers.</p>\n<p>\u201cI miss going places,\u201d Ada said. \u201cI miss not studying every room before we enter it.\u201d</p>\n<p>\u201cI know.\u201d</p>\n<p>\u201cI hate that my father thinks we\u2019re making him weak.\u201d</p>\n<p>\u201cHe doesn\u2019t think we\u2019re bad parents.\u201d</p>\n<p>\u201cHe thinks we\u2019re afraid.\u201d</p>\n<p>Ren looked at the dark stove hood. \u201cI am afraid.\u201d</p>\n<p>Ada rubbed the heel of her hand over her eyes.</p>\n<p>In January, Theo began carrying his own card. Ada laminated a smaller copy, and he kept it in his pocket. At school pickup, he sometimes asked what dinner was before saying hello.</p>\n<p>They added one hard thing to certain evenings. Hair washing on Wednesdays. A food not touching anything else. Five minutes at the table after he finished eating. Frank approved of the five minutes and disapproved of the separate saucer. Nobody changed anyone\u2019s mind.</p>\n<p>On hair-washing nights, Theo cried. Ren poured from a cup instead of using the spray nozzle. Ada held a folded washcloth over his eyes. The first Wednesday he climbed out dripping and ran naked into the hall. The next week he stayed in but screamed. The week after that he said, \u201cTell me before.\u201d</p>\n<p>\u201cThree pours,\u201d Ren said. \u201cHere\u2019s one.\u201d</p>\n<p>Theo clutched the washcloth.</p>\n<p>\u201cOne.\u201d</p>\n<p>Water streamed down his neck.</p>\n<p>\u201cTwo.\u201d</p>\n<p>\u201cWait.\u201d</p>\n<p>Ren waited.</p>\n<p>\u201cOkay.\u201d</p>\n<p>At Frank\u2019s house, there were no picture cards. The lights were bright, and the clock in the hall chimed every quarter hour. But Frank served meatloaf at six exactly and never asked Theo what he wanted. Theo knew where the napkins were. He knew he must carry his plate to the sink.</p>\n<p>Once, he refused.</p>\n<p>Frank sat at the table, peeling an orange in one long spiral.</p>\n<p>\u201cWe\u2019re not leaving it for your grandmother,\u201d he said.</p>\n<p>Theo lay on the floor.</p>\n<p>Frank ate one section of orange.</p>\n<p>Theo kicked the table leg, once.</p>\n<p>Frank looked down. \u201cThe plate.\u201d</p>\n<p>For five minutes neither moved. Then Theo rose, cheeks wet, and carried the plate with both hands.</p>\n<p>\u201cThank you,\u201d Frank said.</p>\n<p>Theo returned and leaned against his grandfather\u2019s arm. Frank separated an orange section and placed it in his palm.</p>\n<p>By spring, some evenings were almost plain.</p>\n<p>Not all. A substitute teacher, a fire drill, wet socks\u2014any one of them could follow Theo home like a storm front. There were still nights when the bath card went untouched and Ren ate cold chicken standing over the sink. Once Theo threw the new blue bowl, but it struck the rug and rolled in a circle without breaking.</p>\n<p>On a rainy Thursday, Frank came through the back door carrying carrots. Theo was beneath the table, his blanket roofed over two chairs.</p>\n<p>\u201cBad one?\u201d Frank asked.</p>\n<p>Ada nodded.</p>\n<p>Frank removed his shoes. \u201cNeed anything?\u201d</p>\n<p>\u201cCut those into sticks. Not rounds.\u201d</p>\n<p>Frank gave her a look.</p>\n<p>\u201cPlease.\u201d</p>\n<p>He took up the knife.</p>\n<p>At dinner the empty socket remained above Theo\u2019s chair. The carrots sat on their own white saucer. Frank\u2019s pot roast touched his potatoes, as he preferred. Theo moved the clothespin from dinner to bath, then climbed back into his chair for one more piece of bread.</p>\n<p>His milk tipped when his elbow caught the cup.</p>\n<p>He froze.</p>\n<p>Frank reached behind him and held out the towel. Theo took it. Ada moved the serving dish aside. Ren kept his hands in his lap.</p>\n<p>Theo pressed the towel to the edge of the table and pushed the small white lake inward.</p>"}, {"id": "BG1", "title": "The Weather in the House", "html": "<p>The trouble started, most nights, at 5:40.</p>\n<p>Ren could feel it coming the way you feel a train through your shoes. Theo would be fine \u2014 genuinely fine, lying on the rug narrating a battle between a plastic triceratops and a wooden spoon \u2014 and then the oven timer would go, and Ada would call <em>hands</em>, and the light over the table would come on, and somewhere in that half minute the boy would stop being a boy and become a siren.</p>\n<p>Tonight it was the chicken. It had touched the rice.</p>\n<p>\"It's just the sauce,\" Ada said. \"The rice is fine, look, I can scrape\u2014\"</p>\n<p>\"IT'S NOT FINE.\" Theo was already off the chair, already on the floor, already at the volume where the neighbors upstairs would start moving furniture out of politeness. \"IT'S WET, IT'S WET, IT'S WET\u2014\"</p>\n<p>They had a system. They'd read the books. Ren crouched at a friendly distance and said, in the calm voice, \"I hear you. The rice got wet. That's disappointing.\" Ada cleared the plate without comment, because rewarding the volume was how you got more volume. They waited it out. It took forty minutes. At 7:15, Theo fell asleep on the hallway floor two feet from his bed, one sock off, breathing like something that had run a long way.</p>\n<p>Ada sat on the edge of the tub afterward with her shoes still on.</p>\n<p>\"Sticker chart,\" she said. \"Week three.\"</p>\n<p>\"Week three of the sticker chart,\" Ren agreed.</p>\n<p>\"He wants the stickers.\"</p>\n<p>\"He does want the stickers.\"</p>\n<p>\"He wants them so much.\" She pressed the heels of her hands against her eyes. \"That's the part I can't \u2014 he <em>wants</em> to do it. He isn't beating us.\"</p>\n<p>---</p>\n<p>Frank came for the weekend in October, filling the doorway with his overcoat and a bag of oranges nobody had asked for.</p>\n<p>\"There he is,\" he said to Theo, who was under the coffee table. \"There's the man.\"</p>\n<p>By Saturday afternoon Frank had assembled his position, which he delivered in the kitchen while Ada chopped.</p>\n<p>\"Four kids,\" he said. \"Four. And I'll tell you the whole trick. They knew what was expected. There was a table, and there was a time, and you sat at it, and if you didn't, you were hungry and you learned something. Nobody negotiated with me about <em>rice</em>.\"</p>\n<p>\"Different kid,\" Ada said.</p>\n<p>\"Every kid is a different kid. That's what every generation figures out and it's never true.\" He took an orange. \"The world isn't going to lower the lights for him, sweetheart. Somebody's going to hand him a job and a boss and a wet plate of rice, and what then?\"</p>\n<p>\"Dad.\"</p>\n<p>\"I'm not being cruel. I'm being <em>kind</em> on a longer timeline.\"</p>\n<p>Ren, from the doorway, said, \"Would you like to run dinner?\"</p>\n<p>Ada shot him a look. Frank didn't notice; he was already rolling his sleeves.</p>\n<p>It went like this. Frank turned on the big overhead light because a family should be able to see each other. He set the table properly, all four places, and put the food out in serving dishes so the boy could learn to serve himself. He announced dinner at 5:30, which was fifteen minutes earlier than usual, because a firm time is a firm time. The kitchen radio stayed on. Frank asked Theo three questions in a row about school, and offered him a choice \u2014 chicken or fish sticks, peas or carrots, milk or water \u2014 because he wasn't a tyrant, he believed in choices.</p>\n<p>Theo stood by his chair with his hands over his ears.</p>\n<p>\"Sit down, please,\" Frank said pleasantly.</p>\n<p>\"Turn it <em>off</em>\u2014\"</p>\n<p>\"After you sit down.\"</p>\n<p>The boy's face did the thing Ren had learned to read: the eyes going flat and far away, the mouth going square. Ada moved and Frank held up one hand, and she stopped, and Ren would think about that raised hand for a long time.</p>\n<p>\"He needs to know we mean it,\" Frank said.</p>\n<p>What happened next lasted an hour and ten minutes. Theo went through the chair \u2014 not around it, through it, taking it over sideways \u2014 and the serving bowl of peas went off the table in a green arc, and he got a fistful of tablecloth and hauled, and then he was in the corner by the radiator screaming in a register Ren had never heard from him, a sound with no words in it at all, hitting the back of his own head against the wall with a rhythm that made Ada shout. Ren got there first and got his hand between the head and the plaster and just held it there, taking the knocks in his palm, saying nothing, for a very long time.</p>\n<p>Frank stood by the table with a serving spoon in his hand.</p>\n<p>\"He's testing you,\" he said, but there was less in it than before.</p>\n<p>At 9:40 Theo woke and threw up, the way he did after the very bad ones, and Ada changed the sheets while Ren held a cup of water and Frank stood in the hallway not coming in.</p>\n<p>In the morning Frank said, \"He's a bright boy.\" He left after lunch, a day early. He said it was the traffic.</p>\n<p>---</p>\n<p>Ada started writing things down. Not feelings \u2014 times.</p>\n<p>She kept it on the back of an envelope on the fridge, and in three weeks it stopped being an envelope and became a page in a notebook, and it said things like <em>5:40 lights on, 5:52 blowup</em> and <em>bath ok when tub filled before he came in</em> and <em>Tues: no blowup \u2014 why? \u2014 snack at 4:30, no homework folder, Ren home early, quiet.</em></p>\n<p>\"Look at Tuesday,\" she said.</p>\n<p>Ren looked at Tuesday. They looked at Tuesday for a long time.</p>\n<p>They didn't make a plan so much as start subtracting.</p>\n<p>The overhead light went first. Ren bought a floor lamp with a warm bulb and they ate under it, the kitchen half in shadow, which felt strange for about four days and then felt like the only civilized way anyone had ever eaten.</p>\n<p>Then the choices. They had been so proud of the choices \u2014 <em>would you like the blue cup or the green cup, do you want peas or carrots</em> \u2014 because that was what you did, you gave a child agency. Ada put out one cup. The green one, always. She stopped asking what he wanted for dinner and just put the plate down, and the plate had a rim, and the food didn't touch, because on the envelope it said <em>touching = 4 of 5 blowups.</em></p>\n<p>They moved dinner to 5:15 and made it smaller, and put a real snack at 4:15 \u2014 cheese, apple, the same every day \u2014 because a child who has been holding himself together at school since eight in the morning is not a child with a discipline problem at six, he is a child running on nothing.</p>\n<p>They stopped talking to him for the first twenty minutes after school. Not coldly. Ren just handed him the snack and put on the same record, the one with the piano, and read his own book at the other end of the couch, and let the boy come back into himself in his own time. Theo started talking at about 4:35, every day, unprompted, in a flood \u2014 about a kid named Marcus, about a bird that got into the gym.</p>\n<p>They filled the bath before he was in the room, so the roar of the taps happened without him.</p>\n<p>They put a hook on the wall at his height so the coat had one place.</p>\n<p>They stopped saying <em>hurry.</em></p>\n<p>None of it was dramatic. Each single change was so small it was almost embarrassing to say out loud. But by the first week of December the notebook had a run of clean days in it, and Ada looked at the run for a while and then quietly stopped keeping the notebook, which was its own kind of announcement.</p>\n<p>---</p>\n<p>Frank came at Christmas, prepared to be gentle about it.</p>\n<p>He watched Ren dim the lamp at five o'clock and said nothing. He watched the single green cup go down and said nothing, in a way that took visible effort. Over the pie he said, \"You know what worries me. He's six. You've built him a very nice little world in here. What happens in the big one?\"</p>\n<p>\"Ask him about the concert,\" Ada said.</p>\n<p>\"What concert?\"</p>\n<p>Theo, who had been listening the way children always are, said, \"I sang in the front row.\"</p>\n<p>Frank turned. \"You did?\"</p>\n<p>\"There were two hundred people,\" Theo said. \"Mom said I could stand by the door if it got loud. I didn't need to.\" He considered. \"It was quite loud.\"</p>\n<p>\"He asked to be in the front,\" Ren said. \"We didn't ask him.\"</p>\n<p>Frank chewed. \"One concert.\"</p>\n<p>\"He sleeps over at Marcus's,\" Ada said. \"He handled the fire drill. He got a filling done at the dentist in October and didn't cry, and I'll remind you that in June he screamed for twenty minutes in the parking lot because we couldn't find the car.\"</p>\n<p>\"So he grew up.\"</p>\n<p>\"Sure,\" Ada said. \"Let's say that.\"</p>\n<p>Frank set down his fork with the air of a man conceding a hand of cards and pretending it's a small pot. \"In my day we'd have called it spoiling him.\"</p>\n<p>\"You did call it that,\" Ada said. \"In October. You said he'd get worse.\"</p>\n<p>There was a pause that went on slightly too long for comfort, and Frank looked over at the boy, who was building something out of pie crust, humming, entirely unbothered, in the low warm light.</p>\n<p>\"Well,\" Frank said. \"He's a bright boy.\"</p>\n<p>Later, drying dishes, he asked Ren where he'd got the lamp. He said the light in his own kitchen was murder on his eyes. He said it in the tone of a man who had thought of it himself.</p>\n<p>---</p>\n<p>February, a Thursday, nothing special about it.</p>\n<p>The lamp is on. The rice is on one side of the plate and the chicken is on the other and there is a clean inch of white between them. The radio is off. Theo has his feet hooked around the chair legs and is telling a long story about Marcus that has no ending in sight, and Ada is listening with her chin in her hand, and Ren gets up to refill the green cup at the sink. Outside the window it's sleeting, going sideways under the streetlight. It's 5:20. Nobody looks at the clock.</p>"}, {"id": "CE6", "title": "Stove Light", "html": "<p>The chicken was fine. Ada had made it the way he liked it, plain, cut into strips, no sauce, and Ren had put it on the blue plate, and none of that mattered, because at 6:40 on a Tuesday Theo looked at the plate and his face did the thing.</p>\n<p>They knew the thing. The chin first. Then the eyes going flat and far, like he was watching something over their shoulders that they couldn't see. Then the sound.</p>\n<p>\"Buddy,\" Ren said. \"It's the chicken you like.\"</p>\n<p>\"I don't LIKE it.\"</p>\n<p>\"You liked it Sunday.\"</p>\n<p>\"I DON'T\u2014\"</p>\n<p>The plate went over. Peas fanned across the table, ticked onto the floor. Ada was already up, already saying his name in the low, even voice the book had recommended, and Theo was already sliding off his chair and under the table, where he screamed into the rug in a way that made the dog leave the room.</p>\n<p>It lasted forty minutes. It usually lasted forty minutes. Afterward he was limp and sweaty and sorry, and he let Ada carry him upstairs even though he was too big for that, and Ren wiped up the peas and thought, as he did most nights, that they were doing everything right and it wasn't working.</p>\n<p>They were not careless people. Ren was a project manager for a civil engineering firm; Ada taught eighth-grade science. They had read the books. There was a chart on the refrigerator with a rocket ship on it that had gotten Theo to the moon twice in September and then never again. They had tried consequences: no tablet, no dessert, the timer, the stairs. They had tried the opposite of consequences, kneeling on the kitchen floor with their palms up while he raged. They had tried being very firm and very calm and, once, at the end of a long week, neither. Every approach worked for a night or two and then didn't. Every night at six-thirty they set the table like people laying out instruments before an operation.</p>\n<p>\"He's testing you,\" Frank said. This was in October, on the phone; Ada had made the mistake of crying in front of her father, or the phone equivalent, which was a pause too long. \"You know that. Four kids. Every one of them tried it. You hold the line and they figure out where the line is and then they relax. That's what they want, honey. They want to know somebody's driving.\"</p>\n<p>\"We hold the line.\"</p>\n<p>\"You hold it Tuesday. Then Wednesday he's under the table for an hour and Thursday you're cutting the crusts off. I've watched you two. You negotiate with him like he's a union.\"</p>\n<p>He was not wrong that they negotiated. He was not wrong about the crusts. Ada hung up and stood in the kitchen with her hand over her mouth.</p>\n<p>Frank came for a week in November. He was seventy-one and had had a knee replaced and could not do the stairs fast, but he still had the voice, the one that had gotten four children through public school and into the car on time for eighteen years. Ada had loved that voice. She had also, at eleven, locked herself in a bathroom to get away from it, but she was not thinking about that when she agreed to let him \"take a couple of evenings.\"</p>\n<p>\"You two go out,\" Frank said. \"Get a drink. I've done this.\"</p>\n<p>They went to the Thai place two miles away and did not order drinks and did not talk about anything else and were home by 7:15.</p>\n<p>They could hear it from the driveway.</p>\n<p>Frank was standing in the kitchen doorway with his arms folded, and Theo was on the floor by the refrigerator, and it was not the ordinary sound. It was higher. He was hitting the back of his own head against the cabinet, not hard, but rhythmically, and there was a plate of cold macaroni on the table with a fork stuck upright in it like a flag.</p>\n<p>\"He's fine,\" Frank said, over the noise. \"He's putting on a show. He knows I'm not buying it.\"</p>\n<p>\"What happened,\" Ada said.</p>\n<p>\"Nothing happened. I told him he could eat what was on the plate or go to bed. He decided he'd rather scream. That's a decision. I'm letting him have it.\" He looked at Theo with what Ren would later recognize as genuine, uncomplicated confidence. \"You're going to eat that macaroni, sport, or you're going to bed hungry, and either way it's up to you.\"</p>\n<p>Theo threw up. Not much, mostly water and the sob-hiccups; but he threw up on the kitchen floor and then looked at the three of them with an expression Ren had never seen on him, which was fear.</p>\n<p>Ada picked him up. He was rigid, then he wasn't. Frank stood there. \"Well,\" he said finally. \"Now he's learned that works.\"</p>\n<p>Ren cleaned the floor. When he came upstairs, Ada was sitting on the edge of Theo's bed in the dark with her hand on his back, and she said, without turning around, \"I'm not doing that again. I don't care what he thinks. I'm not doing that again.\"</p>\n<p>\"Okay.\"</p>\n<p>\"I don't mean my dad.\" She turned. \"I mean I'm not doing <em>dinner</em> like that again. Any of it. Six-thirty, all of us at the table, the light, the questions, how was your day, two more bites. I'm not.\"</p>\n<p>\"What do we do instead.\"</p>\n<p>\"I don't know,\" she said. \"Something else.\"</p>\n<p>The something else started small, and stupidly, and by accident. The next night the overhead kitchen light \u2014 the big flat LED panel Ren had installed himself two summers ago and been proud of \u2014 flickered, and rather than deal with it he turned it off and left the little bulb over the stove on. The kitchen went amber and low. Theo, coming in from the living room, stopped in the doorway.</p>\n<p>\"Why is it dark?\"</p>\n<p>\"Light's broken. Is this okay?\"</p>\n<p>Theo considered. \"It's like a cave,\" he said, and got in his chair, and ate half a bowl of rice before anyone had said anything, and nobody said anything, because Ada had grabbed Ren's wrist under the table.</p>\n<p>Ren did not fix the light. He told Frank, who was still there, that he'd ordered a part.</p>\n<p>They moved dinner to six. Ada had noticed \u2014 the way you notice something you've been looking at for a year \u2014 that the thing in Theo's face arrived at almost exactly six-thirty whether or not there was food in front of him, the way a tide comes in. At six he was still a person. So they ate at six, and if it meant Ren was still on a call and joined them ten minutes late, he joined them ten minutes late.</p>\n<p>They stopped asking questions. This one was Ren's. He had watched himself, one night, from the outside \u2014 <em>how was school, who'd you sit with, did you do the reading thing</em> \u2014 and heard how much it sounded like an interview, and how a six-year-old with a fork might feel about being interviewed at the exact hour his body was giving out. So they talked to each other instead, over his head, about nothing. The truck. Ada's principal. And Theo, unasked, said things. Not much. \"Marcus has a snake.\" But things.</p>\n<p>They stopped offering choices. Not all of them \u2014 Frank was right that a child needed to feel like somebody was driving \u2014 but the little cascade Ada now heard, listening to herself, as a kind of static: <em>milk or water? the blue cup or the green? do you want it cut up? do you want to sit here or here?</em> Now the water was already poured. The cup was the blue one. He could say no to the blue one, and once he did, but usually he just drank.</p>\n<p>And they watched their own faces. This was the hardest, and the one neither of them talked about. Ren caught himself, standing at the counter as Theo pushed a piece of chicken to the rim of his plate, with his jaw set and his eyebrows down \u2014 braced, already, for the thing \u2014 and understood that Theo, who noticed everything, was looking at that face and reading it as a forecast. He let his jaw go. He picked up the paper. It felt like acting. He kept doing it.</p>\n<p>Frank watched all of this from the living room with his bad knee up. He was not unkind about it. He was, if anything, patient, the patience of a man waiting for the weather to prove him right.</p>\n<p>\"You're building a kid who can't eat with the lights on,\" he said, the fourth night. \"I'm just saying it once. He goes to a friend's house, they eat at seven under a chandelier and the mother asks him what he wants to be when he grows up, and what does he do? Falls apart. You're not teaching him anything. You're rearranging the furniture.\"</p>\n<p>\"Maybe,\" Ada said.</p>\n<p>\"Marcus's mom asked me what I want to be,\" Theo said, from the floor, where he was doing something with a Lego truck. \"I said a snake.\"</p>\n<p>\"That's not \u2014\" Frank started, and then let it go, and Ren, at the sink, turned so nobody would see his face.</p>\n<p>The week ended. Ada drove Frank to the airport and he was quiet most of the way, and at the curb he said, \"He seems better.\"</p>\n<p>\"He is.\"</p>\n<p>\"That's the age. Six to seven, they turn a corner. Every one of mine did.\" He got his bag out of the back. \"You'll see.\"</p>\n<p>\"Okay, Dad.\"</p>\n<p>\"But I'll grant you,\" he said, and stopped, and she could see him look for a way to say the thing without saying it, \"the light was a good idea. That panel of Ren's is like an interrogation room. I never liked it.\"</p>\n<p>\"I'll tell him.\"</p>\n<p>\"Don't tell him I said interrogation.\"</p>\n<p>By Christmas the thing came maybe one night in five, and when it came it was shorter, and there was a shape to it now, a way through, that all three of them knew. Bath moved before dinner instead of after \u2014 Ren's idea, from watching Theo go under the table one night in December with wet hair and realizing the bath was not the reward at the end of the evening but the second half of a fight \u2014 and it turned out that a boy who was warm and in pajamas at six-fifteen was a different boy than the one who'd been told, at seven, that it was time to go get wet. Ada bought a second stove light, the plug-in kind, and put it in the bathroom, and Theo brushed his teeth in a cave too.</p>\n<p>They did not go to Frank's for Christmas; the flight was too much. But they went in March, for four days, and on the second night Frank's wife \u2014 Ada's stepmother, Diane, who had been mostly quiet on the phone all year \u2014 set the dining room table for six-thirty because that was when Frank ate, with the chandelier on, and Ada watched Ren look at it, and watched him look at her, and watched him make the calculation.</p>\n<p>\"Diane, could we eat at six?\" he said. \"He's on a schedule. And \u2014 would you mind if I did the sconces instead of the big light? He's a little sensitive.\"</p>\n<p>\"You're going to be sitting in the dark for the rest of your lives,\" Frank said from the head of the table.</p>\n<p>\"Frank,\" Diane said, and turned the chandelier off, and turned the sconces on, and the room went gold, and Theo, who had been holding on to Ada's leg since they walked into the house, let go of it and got into his chair.</p>\n<p>He ate. Not everything. Enough. Frank asked him one question \u2014 \"What's this about a snake\" \u2014 and Theo told him, at length, and Frank listened, and something in his face went sideways for a moment, and he did not ask another. Afterward, in the kitchen, drying, Frank said to Ren, \"Six o'clock, though. That's early.\"</p>\n<p>\"It's when he's hungry.\"</p>\n<p>\"Huh.\" Frank dried a glass for a long time. \"You know, Ada was a screamer. Ada, of all of them. We just \u2014 powered through it. Might've been simpler this way.\" He set the glass down. \"Don't tell her I said that either.\"</p>\n<p>\"I'll add it to the list.\"</p>\n<p>They flew home. Spring came. The kitchen light panel stayed broken.</p>\n<p>On a Thursday in April, Ren came in from the garage at ten to six to find the stove light on and the kitchen amber and Ada at the counter with a wooden spoon, and Theo \u2014 bathed, in the dinosaur pajamas, hair still wet \u2014 already in his chair with the blue cup, watching the dog watch him, telling nobody in particular that snakes did not, in fact, have eyelids.</p>"}, {"id": "CX4", "title": "Low Light", "html": "<p>The kitchen had six recessed halogen cans in the ceiling, installed the summer before Theo started kindergarten. When Ren turned the dimmer all the way up, the room looked like an operating theater: white subway tile, bleached maple counters, the stainless-steel hood over the range humming on its lowest setting like an idling truck.</p>\n<p>On the front of the refrigerator hung the behavior board. It was magnetic, bordered in green plastic, with three columns: <em>Calm Body</em>, <em>Tasting Bite</em>, <em>Bedtime on the Bell</em>. Beneath each column were little yellow foam stars with magnetic backs. Theo had three stars under <em>Calm Body</em> and none under <em>Tasting Bite</em>. The column for <em>Bedtime</em> had two red squares that meant <em>Lost Privilege</em>.</p>\n<p>\"Look at Mommy\u2019s eyes, Theo,\" Ada said. She was kneeling on the cork floor by the pantry, her palms resting on Theo\u2019s knees. Her voice was level, pitched in the gentle, slightly raised register recommended by the three books stacked on the microwave. \"We use our words when the shoes come off. We don't kick the radiator.\"</p>\n<p>Theo was six. His school uniform polo was damp at the collar from where he\u2019d chewed it on the bus ride home, and his shins were dark with playground dust. He did not look at Ada\u2019s eyes. His gaze was fixed on the second hand of the electric wall clock, which jumped forward with a dry, plastic snap every sixty seconds. His chest hitched.</p>\n<p>\"Pasta or rice tonight, sweetie?\" Ren asked from the stove. He had the strainer in one hand. \"You choose. Green bowl or yellow bowl?\"</p>\n<p>\"Yellow,\" Theo whispered.</p>\n<p>\"Yellow is in the dishwasher,\" Ren said, trying for cheerful. \"How about the blue one with the fish?\"</p>\n<p>Theo\u2019s left shoulder jerked upward toward his ear. His fingers, gray with pencil lead, caught the hem of his shorts and twisted until the fabric went white.</p>\n<p>\"You said I could choose,\" he said.</p>\n<p>\"I know, buddy, but the yellow one is dirty. The blue one is right here.\" Ren lifted it down from the cabinet. \"See? Blue fish.\"</p>\n<p>Theo did not scream immediately. He made a sound like water coming through a pinched hose\u2014a thin, tight whistling in the back of his throat. Then his heels came down hard against the cork floor, once, twice, and he threw himself sideways into the baseboard. His shoulder hit the wood with a dull thud. The blue bowl left Ren\u2019s hand, bounced off the counter edge, and cracked across the tile.</p>\n<p>\"Timer,\" Ada said, her face setting into the firm, neutral mask she had practiced in the bathroom mirror. She reached for the kitchen timer shaped like a white egg, twisted it to four minutes, and set it on the floor two feet from Theo. \"You have four minutes to find your calm breathing. We are right here.\"</p>\n<p>Theo rolled onto his stomach, buried his face in the corner where the cabinets met the stove, and began to shriek. It was not anger; it was the noise of an animal caught in a wire fence, high and ragged, continuing long after his lungs were empty, until he gagged on his own spit and the skin around his eyes mottled into dark plum patches.</p>\n<p>Ren stood over the broken plastic on the floor. His hands were shaking. Across the counter, the six halogen bulbs poured down their flat, merciless heat.</p>\n<p><em>*</em></p>\n<p>Frank arrived on a Tuesday at five o\u2019clock, carrying a gallon of cider from the orchard out by the reservoir and a plastic bag of McIntosh apples. He had spent thirty-four years as a foreman for the county water board, and he moved through rooms with the heavy, unhurried certainty of a man who had never had to explain himself twice.</p>\n<p>\"Smells good,\" Frank said, hanging his canvas jacket on the hall peg. \"Pork chops?\"</p>\n<p>\"Pork chops and applesauce,\" Ada said. She kissed his cheek. \"Ren\u2019s just finishing the beans.\"</p>\n<p>Theo was sitting under the dining room table, his knees drawn to his chest, rolling a matchbox car back and forth along the grain of the floorboards.</p>\n<p>Frank bent down, his knees cracking like dry pine. \"Hey there, partner. What\u2019s that you got? A Dodge?\"</p>\n<p>Theo didn\u2019t answer. The car rolled forward four inches, then back.</p>\n<p>\"Cat got your tongue?\" Frank asked. He stood up, looking at Ada. \"You let him eat under there?\"</p>\n<p>\"He\u2019s transitioning, Dad,\" Ada said quietly. \"He had a big day at school. They had an assembly.\"</p>\n<p>\"An assembly,\" Frank repeated. He walked into the kitchen, leaned against the counter beside Ren, and watched Ren set the table. \"You put the fork on the wrong side, Ren.\"</p>\n<p>\"Theo likes it on the right,\" Ren said. \"He\u2019s left-handed, but he grabs with his right first.\"</p>\n<p>\"World\u2019s not left-handed,\" Frank said. He reached over, took the fork, and set it squarely to the left of the plate. \"You cater to every little tick, the boy\u2019s never going to adjust. Four kids I raised. None of them had a chart on the icebox.\"</p>\n<p>\"Things are different now, Frank,\" Ren said, turning the pork chops in the iron skillet. The grease popped, sharp and loud.</p>\n<p>\"Things are the same,\" Frank said. \"People are just softer. You give a child a line, he pushes on it to see if it\u2019s solid. If it gives, he gets scared because nobody\u2019s in charge. That\u2019s all this is. He\u2019s running the house because nobody\u2019s telling him he can\u2019t.\"</p>\n<p>At five-thirty, Ada called Theo to the table. Theo stayed under the dining room table.</p>\n<p>\"Theo,\" Ada said, standing in the doorway. \"First dinner, then fifteen minutes of Lego. That\u2019s the deal.\"</p>\n<p>Theo\u2019s fingers dug into the carpet pile. \"Not hungry.\"</p>\n<p>\"You need protein, honey,\" Ada said. \"Just three bites of chop and two green beans.\"</p>\n<p>Frank pushed his chair back and stood up. \"Let me,\" he said.</p>\n<p>\"Dad,\" Ada said, her hand coming up. \"We have a system.\"</p>\n<p>\"Your system\u2019s got you whispering in your own house like you\u2019re hiding from the landlord,\" Frank said. He walked into the dining room, reached down with two large, liver-spotted hands, hooked Theo under the armpits, and lifted him out from under the table in one smooth motion.</p>\n<p>Theo\u2019s body went rigid as an iron rod. \"No!\"</p>\n<p>\"Yes,\" Frank said, his voice dropping into the low, chest-heavy register he used for new crew members on the ditches. He set Theo into the oak dining chair and pushed the chair firmly against the table, trapping him between the seat back and the wood. \"Feet on the floor. Hands in your lap.\"</p>\n<p>Theo\u2019s eyes went wide, the pupils swallowing the brown of his irises. \"I want Mommy.\"</p>\n<p>\"Mommy\u2019s having her supper,\" Frank said. He took his own seat across from the boy, picked up his knife and fork, and cut a neat triangle of pork. \"We sit up straight. We eat what\u2019s put in front of us. When the plate is cleared, we ask to be excused. That\u2019s how a man eats.\"</p>\n<p>\"Frank, please,\" Ren said from the kitchen door.</p>\n<p>\"Leave it, Ren,\" Frank commanded, without looking up. \"Look at him. He\u2019s testing you. Go on, Theo. Fork in your hand.\"</p>\n<p>He reached across the table, took Theo\u2019s small, cold wrist, and closed the boy\u2019s fingers around the handle of the fork.</p>\n<p>What happened next did not have a ramp. It was an instantaneous detonation. Theo\u2019s arm jerked sideways, and the fork flew out of his grip, striking Frank\u2019s water goblet. The glass tipped, sending a sheet of ice water across the tablecloth and into Frank\u2019s lap. Theo did not stay in the chair; he threw his skull backward against the oak spindles with a crack that sounded like a dry branch snapping.</p>\n<p>\"Theo!\" Ada lunged forward.</p>\n<p>Theo fell out of the chair, his feet tangled in the legs, and hit the rug. He began to kick violently, his heels hammering the floorboards with a rapid, drum-like cadence. His mouth opened into a square, and the scream that came out was so loud, so devoid of language, that Frank flinched, his hands hovering over his wet trousers.</p>\n<p>\"Up!\" Frank barked, trying to find his footing in the noise. \"You get up right now!\"</p>\n<p>Theo\u2019s eyes rolled back until only the whites showed. He began to hyperventilate\u2014short, barking gasps that sucked no air into his lungs. His hands clawed at his own throat, leaving red streaks on the pale skin above his collar. When Ada dropped beside him, he caught her forearm with his nails and tore downward, breaking the skin.</p>\n<p>\"Get out, Dad,\" Ada said. She didn't shout. Her voice was flat, dead, trembling with adrenaline.</p>\n<p>\"Ada\u2014\"</p>\n<p>\"Get out of the room. Go sit in the living room.\"</p>\n<p>Frank stood there for five seconds, the water dripping off the hem of his trousers onto the rug, his face mottled red. \"He\u2019s out of control,\" Frank muttered, stepping back toward the hallway. \"You\u2019ve made a rod for your own back. He belongs in a clinic.\"</p>\n<p>It took forty-five minutes for Theo\u2019s breathing to slow. When it was over, he lay on the rug with his head in Ada\u2019s lap, his skin gray and cold to the touch, his socks soaked with sweat. The pork chops on the table were covered in a thin, white skin of congealed fat.</p>\n<p><em>*</em></p>\n<p>On Friday, Ren came home from work at four-thirty. He did not turn on the kitchen halogens. He walked through the hallway and switched on only the small brass lamp on the sideboard, the one with the pleated paper shade that threw a warm, yellow circle against the wall.</p>\n<p>He went into the kitchen. He did not turn on the radio. He did not start the range hood. He took a paring knife and sliced cold chicken breast into thin ribbons on a wooden board, then cut half an apple into translucent half-moons. He put the chicken, the apple, and three salted crackers onto a wide, shallow wooden tray\u2014not a plate, not a bowl\u2014and carried it into the living room.</p>\n<p>He set the tray on the low coffee table. Then he took the behavior board off the refrigerator, carried it down the cellar stairs, and laid it face-down on the workbench behind the paint cans.</p>\n<p>At five-fifteen, the front door opened.</p>\n<p>Ada came in first, carrying her shoulder bag, her keys already silenced in her pocket so they wouldn't jingle. Behind her was Theo. His coat was half-unzipped, his backpack dragging on the floor behind him like an anchor.</p>\n<p>Ada did not say <em>How was your day?</em> She did not say <em>Did you use the paint markers?</em> She did not say <em>Take off your boots and wash your hands.</em></p>\n<p>She took his backpack from his hand without making eye contact, set it in the corner, and walked straight into the kitchen to pour a glass of water.</p>\n<p>Ren was sitting on the sofa, looking at a magazine about timber framing. He didn't look up when the door shut. He turned a page.</p>\n<p>Theo stood in the foyer for a full minute, his boots planted on the rubber mat. The house was half-dark. The only sound was the radiator ticking in the corner as the hot water rose through the pipes, and the slow, rhythmic sweep of Ren turning a glossy page.</p>\n<p>Theo took off his coat. He dropped it on the bench. He peeled his socks off and left them where they fell. He walked into the living room, his bare feet silent on the floorboards, and saw the tray on the coffee table.</p>\n<p>He didn't sit on a chair. He sat on the floor, cross-legged, pulled the wool throw off the back of the sofa, and draped it over his shoulders like a cape. He reached out one hand, took a slice of cold chicken, and put it in his mouth.</p>\n<p>Ren turned another page. \"Cedar shingles last about thirty years,\" Ren said to the room, not looking at Theo. \"If you treat them with oil, they last fifty.\"</p>\n<p>Theo chewed. He reached for an apple slice. \"Do they smell like pencils?\"</p>\n<p>\"They smell like pencils,\" Ren said.</p>\n<p><em>*</em></p>\n<p>The changes were small, but they accumulated like silt in a river bend.</p>\n<p>The bathroom had always been cold in the evenings, the glazed tile pulling the heat out of the air. Ren bought a small oil-filled radiator on wheels and plugged it in beside the tub at four o'clock, so that by six, the room was eighty degrees and smelled like warm cast iron. Ada took Theo\u2019s pajamas and put them in the clothes dryer for six minutes while Theo was in the water. When he stepped out onto the bathmat, the air didn't shock his skin; she wrapped him in a bath sheet that had been warming on the register, lifting him into it without asking if he was ready.</p>\n<p>They stopped asking questions that had two answers. They stopped asking questions that had any answers.</p>\n<p>\"Bed in ten minutes,\" Ren would say, walking past the doorway, not stopping, not waiting for a response, his voice dropping into the quiet middle of the house.</p>\n<p>When Frank came over on the third Sunday of November, the sun had already gone down behind the ridge. The wind was coming hard out of the north, rattling the storm sashes.</p>\n<p>Frank stamped his feet on the porch, shook the snow from his collar, and came inside carrying a plastic tub of beef stew his neighbor had made.</p>\n<p>\"Dark in here,\" Frank said, reaching for the wall switch by the coat rack.</p>\n<p>\"Leave it, Dad,\" Ada said, stepping out of the kitchen. She took his coat. \"The lamp\u2019s on.\"</p>\n<p>Frank looked into the living room. The large overhead light was off. The floor lamp in the corner cast long, soft shadows across the rug. Theo was lying on his stomach by the radiator, his chin propped on his forearms, watching a line of gray plastic knights defend a cardboard shoebox from three pinecones.</p>\n<p>\"Still got him in the dark?\" Frank muttered, lowering his voice as he followed Ada into the kitchen. \"Like an owl.\"</p>\n<p>\"He likes it,\" Ada said.</p>\n<p>\"He's got to learn to live in the light, Ada. School\u2019s not dark. The grocery store\u2019s not dark.\"</p>\n<p>\"He's six,\" Ren said. He was standing by the stove, ladling soup into three heavy stoneware bowls. He had already set a wooden board on the table with butter, torn sourdough, and a saucer of green grapes. There were no plates.</p>\n<p>\"Where's his bowl?\" Frank asked, nodding toward the table.</p>\n<p>\"He's eating off the board,\" Ren said.</p>\n<p>Frank shook his head, a short, bitter chuckle catching in his throat. \"You're building him a glass house. First stiff breeze, the whole thing shatters. You think his boss is going to turn off the lights and feed him off a plank?\"</p>\n<p>\"We'll worry about his boss in twenty years,\" Ren said.</p>\n<p>\"Dinner,\" Ada called into the hall. Her voice was conversational, low.</p>\n<p>Theo didn't run, and he didn't hide. He stood up from the rug, stepped over his shoebox castle, and walked into the kitchen. He had a smudge of gray lead on his temple. He climbed into his chair, pulled his feet up onto the wooden rung beneath the seat, and reached for a piece of sourdough.</p>\n<p>Frank sat down opposite him. Frank\u2019s face was set, his jaw working as he watched the boy dip the bread directly into the butter without using a knife.</p>\n<p>\"Use your butter knife, son,\" Frank said.</p>\n<p>Theo stopped. His hand hovered over the butter dish. The room went very still; the refrigerator hummed its low, steady chord. Ren did not move from the counter. Ada kept her eyes on her soup.</p>\n<p>Theo looked at Frank. His brow furrowed, a small, tight line appearing between his eyebrows\u2014the old line, the one that usually came right before the heels started drumming the floor.</p>\n<p>Frank braced himself. He set his forearms on the edge of the table, his shoulders broadening, ready for the storm. \"I said\u2014\"</p>\n<p>Theo didn't scream. He looked down at the wooden board. He saw the butter knife resting beside the grapes. He picked it up by the blade, turned it awkwardly in his small fingers until he had the handle, scraped a corner of butter off the block, and smeared it across his bread.</p>\n<p>Then he looked back up at Frank. \"The knights won,\" Theo said.</p>\n<p>Frank stared at him. The boy took a bite of bread, chewed, and reached for a grape.</p>\n<p>\"What?\" Frank said.</p>\n<p>\"The knights,\" Theo said around the bread. \"They had shields.\"</p>\n<p>Frank looked at Ada. Ada was eating her soup. He looked at Ren, who was leaning against the sink with his mug of cider, looking out the black square of the window into the snow. Nobody was correcting the boy's grammar. Nobody was telling him not to speak with his mouth full. Nobody was timing him.</p>\n<p>Frank opened his mouth to say something about table manners, looked down at his own bowl of stew, and closed it again.</p>\n<p>\"Pinecones didn't have a chance, huh?\" Frank said, his voice rough.</p>\n<p>\"No,\" Theo said. \"They're just wood.\"</p>\n<p><em>*</em></p>\n<p>After Frank left, the wind died down, leaving the street quiet under two inches of wet snow.</p>\n<p>Ren went into the bathroom. The little heater had been running for twenty minutes; the air was thick, warm, and smelled faintly of almond soap. He turned on the tap, letting the water run until the tub was four inches deep, then shut it off so the house wouldn't fill with the roar of the pipes.</p>\n<p>In the bedroom, Ada was folding a pair of flannel trousers. Theo sat on the edge of the mattress, his feet dangling four inches above the floor, holding his arms straight out to the sides while Ada pulled his undershirt up over his head.</p>\n<p>His ribs showed when he reached up\u2014thin, pale slats under the yellow lamplight. He didn't flinch when the cotton cleared his ears. He dropped his arms, hopped down from the bed, and walked into the bathroom, his small heels making no sound at all on the warm floor.</p>"}, {"id": "MR7", "title": "Low Light", "html": "<p>The chart on the refrigerator had five columns, one for each school night, and stickers meant to add up to a trip to the trampoline park. It was Wednesday. There were two stickers, both from Monday, and one of them had been peeled off and pressed back on crooked by a small thumb.</p>\n<p>\"Three more bites,\" Ren said. \"Then you're done.\"</p>\n<p>Theo looked at the chicken the way you'd look at a dog you weren't sure about. \"It's touching.\"</p>\n<p>\"It's not touching. I moved it.\"</p>\n<p>\"It was touching before.\"</p>\n<p>Ada, at the sink, kept her back to them and turned off the water so she could hear it start. It always started the same way, a hum in the room like a bad bulb, and then Theo pushed the plate, and the plate went into the milk, and the milk went across the table into Ren's lap, and Theo screamed a scream with no words in it and slid off his chair to the floor, where he kicked the table leg until the salt tipped over.</p>\n<p>They had a system. Ren stood and said, \"I'm going to wait until you're calm,\" and was calm. Ada knelt and said his name. Theo bit her forearm. Not hard, but the marks were there in the morning, four small dents.</p>\n<p>Later, when he was finally down, Ada stood in the shower with her forehead on the tile, and Ren sat on the edge of the bed with the parenting book open on his knee, not reading it, and neither of them said what they were both counting: the fourth night in five.</p>\n<p>Frank came the second weekend of every month with a cooler of venison and a look at the yard. He'd raised four in a three-bedroom house in Zanesville on a lineman's pay, and all four of them called him on Sundays. He was seventy-one and could still carry a bag of concrete on each shoulder.</p>\n<p>He watched Saturday dinner from the end of the table with his hands folded, and when Theo started in about the corn, Frank said, \"Theo. Sit up and eat your supper,\" in a voice that wasn't loud and wasn't asking. And Theo sat up. He ate maybe six kernels. But he stayed in the chair, and it was the first dinner that week that ended with the plate on the table.</p>\n<p>\"He minds you,\" Ren said afterward, on the back step, where Frank was smoking the one cigarette Ada pretended not to know about.</p>\n<p>\"He minds because he knows I mean it.\" Frank tapped ash into a flowerpot. \"You two are good parents. I want to say that first. You're better at it than I was, in a lot of ways. Patient. Lord, you're patient.\" He shook his head. \"But you keep asking him. Would you like to, could you please, how about. He's six. He doesn't want to be asked. He wants to know where the wall is, and every time you move it he's got to go find it again, and it wears him out. Wears you out too.\"</p>\n<p>\"We've tried the wall.\"</p>\n<p>\"You've tried the wall for three days and then felt bad about it.\" He said it kindly. \"Listen. The world's not going to ask him. His teacher won't give him three choices. His boss won't. Some kid on a ballfield sure won't. If he learns at this table that when it gets hard he can go to pieces and everything stops, that's what you've taught him. I'm not saying be hard on him. I'm saying be steady, and let him rise. They rise, Ren. All four of mine did. Every one of them thanked me for it, eventually.\"</p>\n<p>Ren didn't answer. Through the window he could see Ada wiping down the high chair they didn't need anymore and hadn't gotten rid of.</p>\n<p>The turn didn't happen at home. It happened at a Bob Evans off the interstate on the way back from Ada's cousin's wedding, at 6:40 on a Sunday, with the sun coming flat through the window onto the table and the speaker over their booth playing something with a fiddle in it. Theo had been in a car seat for two hours in a clip-on tie. The waitress brought his pancakes with whipped cream on them, which he had not asked for and could not look at, and Ren said, gently, reasonably, \"You can scrape it off, bud,\" and Theo threw the plate.</p>\n<p>Not pushed. Threw. It hit the booth divider and came apart, and the whole restaurant turned around, and Ren picked him up like a bag of laundry, arms and legs going, and carried him out through the vestibule past the gumball machines while a man in a Bengals cap said, to nobody, \"Somebody needs a spanking,\" and Ada stayed to pay and to apologize and to help the girl pick up the pieces, and her hands were shaking so hard she dropped a fork twice.</p>\n<p>In the car, Theo asleep in the back with tears dried white on his cheeks, they had the fight. It was about the whipped cream, then the chart, then how Ren always did the reasonable voice and Ada always did the kneeling and neither of them was working, and Ada said, \"He's not a bad kid. So why does it feel like we're punishing him for something he can't\u2014\"</p>\n<p>\"Nobody's punishing him.\"</p>\n<p>\"He said 'I'm a red day' on Thursday. About himself. He was in the tub, he was playing, and he looked up and said, 'I'm a red day.' Like it was his name.\"</p>\n<p>Ren drove. Somewhere past Chillicothe he said, \"I keep thinking about the whipped cream. That he couldn't even look at it. That's not a kid who's testing me.\"</p>\n<p>\"No.\"</p>\n<p>\"So what is it.\"</p>\n<p>She didn't know. But she'd been sitting there for forty miles rewinding the booth: the sun in his eyes, the fiddle, the tie, the two hours in the seat, the pancakes he wanted arriving wrong, and then his father asking him, one more time, to do a small reasonable thing.</p>\n<p>They started with the light. It sounded stupid even to them. But the kitchen had eight can lights on one switch, and Ada realized, standing under them, that at six-thirty every night they had been eating in an operating room. Ren put in a dimmer on a Tuesday afternoon. Forty dollars at Lowe's.</p>\n<p>Then dinner moved. Not later; earlier. Five-fifteen, before Theo hit the place where he was too hungry to eat. Ren started leaving work at 4:40 and eating his own supper standing up at nine, which he hated, and did.</p>\n<p>They stopped running the dishwasher until after bedtime, because Theo covered his ears at the drain cycle and they had never once put that together with anything. They stopped the podcast Ren liked to have on. They took the chart down. Ada rolled it up and put it in the recycling and felt, doing it, like she was throwing away something that had cost her more than paper.</p>\n<p>They stopped asking questions at the table. This was the hardest one. Ren was a talker, and dinner was where you asked about the day, and Ada watched him sit there with his fork and physically not say <em>how was school</em>, and she loved him for it and had to look away.</p>\n<p>The plate was the same plate every night, the blue one. Foods didn't touch. Nobody said three more bites. Nobody said anything about the food at all. He could eat it or not, and afterward there was toast.</p>\n<p>And there were two choices, ever. Bath or shower. Blue pajamas or the dinosaur ones. Not what do you want to do first, do you want to brush now or after, two books or three. Two. Then done.</p>\n<p>The first week was not better. Wednesday was as bad as any Wednesday. Ren, in a dim kitchen with milk down his leg for the two hundredth time, said, \"This is idiotic,\" out loud, and Ada didn't argue.</p>\n<p>The second week had two good nights and one that ended with Theo asleep on the bathroom floor.</p>\n<p>The third week, on a Thursday, he ate the whole blue plate and asked for toast anyway, and then sat on the couch in the dinosaur pajamas with his head on Ren's arm while Ren read, and at some point Ren realized the kid was talking, unprompted, about a girl at school named Priya who could do a cartwheel, and that this was the school day he'd been asking for every night for a year, and it had come out on its own in a room with the lights down.</p>\n<p>Frank noticed the dimmer the next time he came. He noticed the toast, and the way nobody said anything when Theo pushed his broccoli to the rim. He brought it up at the fence, afterward, where Ren was showing him the rot in a post.</p>\n<p>\"You're managing him.\"</p>\n<p>\"I guess we are.\"</p>\n<p>\"That's fine when he's six.\" Frank crouched and pushed a thumb into the wet wood. \"What's the plan for sixteen? You going to dim the lights at his job? Tell his coach not to ask him questions?\" He straightened up. \"I'm not being smart with you. I'm asking. I've watched a lot of kids get handled real careful, and what it taught them was that they were fragile. He's not fragile, Ren. He's tough. I've seen him come off that swing set and get up. You start acting like everything's got to be just so before he can eat supper, he's going to believe you.\"</p>\n<p>Ren pulled a splinter off the post and looked at it. \"He ate supper six nights this week.\"</p>\n<p>\"That's good.\" Frank meant it. \"That's real good. I'm glad. I'm just telling you what I see. You can do both. Give a kid some slack and still expect something of him.\" He clapped Ren on the back. \"This post is shot. I'll bring the auger next month.\"</p>\n<p>The backslide came in May, when the days went long, and for reasons neither of them could find, Theo went to pieces four nights running, plate and floor and biting. Ada cried in the pantry with the door shut. Ren said, \"What did we change,\" and they went through it. Nothing. Except the light through the window at five-fifteen was different now, and the neighbor had a new mower, and there'd been a field day, and he was six.</p>\n<p>Frank was there for the fourth night. He was in the living room with the news on low. He heard it start in the kitchen and did not get up. When Theo came flying through the room, past him, toward the stairs, screaming, Frank said, \"Theo,\" once, at normal volume, and Theo stopped on the second step.</p>\n<p>\"Come sit here a minute.\"</p>\n<p>\"NO.\"</p>\n<p>\"All right. I'll be here.\"</p>\n<p>Frank turned back to the television. Ren, in the kitchen doorway, watched his son stand clenched on the stair, and watched his father-in-law watch the weather map like a man with nowhere else to be, and after a minute that lasted about a year, Theo came down the two steps and climbed onto the couch and put himself under Frank's arm, and Frank did not look at him or say a word, and they watched the seven-day forecast together, and it was over.</p>\n<p>Later Ada said, \"How does he do that.\"</p>\n<p>Ren said, \"I don't know.\" He'd been thinking about it. \"He's not scared of him. That's most of it. He doesn't have anything riding on it.\"</p>\n<p>\"We have everything riding on it.\"</p>\n<p>\"Yeah.\"</p>\n<p>In June the post got done. Frank came with the auger, and Theo carried a corner of the gravel bag, and Frank let him hold the level and told him it was crooked and Theo fixed it, and neither of them said anything nice to the other, and it was one of the best afternoons of the year.</p>\n<p>Frank still thought they were babying him. He said so, at the fence, once more, in a way that had gotten gentler and no less certain. Ada still thought her father did not know what it was to have a child whose skin was on the outside. She said so, in the kitchen, in a way that had gotten gentler too. They loved each other. Nobody moved.</p>\n<p>At supper he cut Theo's chicken into squares because that was how Theo liked it, and said, \"Napkin, bud,\" when the sauce got on his chin, and Theo wiped it. Ren had turned the lights down before Frank came in. Frank had noticed. He hadn't said a word.</p>\n<p>Theo ate the chicken and pushed the peas to the rim of the blue plate and asked for toast, and Ada got up and put two slices in, and the dishwasher stood dark and full, and out the window it was still light, and Frank reached over without looking and slid the salt out of Theo's reach, and the toast came up.</p>"}]}];
const FLAT=DATA.flatMap(g=>g.stories.map(s=>({...s,premise:g.premise})));
const KEY='c2s-judge-v1';
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
let cur=Math.min(+localStorage.getItem(KEY+'-pos')||0,FLAT.length-1);
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(KEY+'-pos',cur);refreshToc()};
const scored=s=>{const a=state[s.id];return a&&a.teach&&a.grade};

const grades=['A','A-','B+','B','B-','C+','C','D','F'];
document.getElementById('grades').innerHTML=grades.map(g=>
  `<label><input type="radio" name="grade" value="${g}" data-k="grade">${g}</label>`).join('');

function refreshToc(){
  const t=document.getElementById('toc');t.innerHTML='';
  DATA.forEach(g=>{
    const h=document.createElement('div');h.className='grp';h.textContent=g.premise;t.appendChild(h);
    g.stories.forEach(s=>{
      const i=FLAT.findIndex(f=>f.id===s.id);
      const b=document.createElement('button');
      b.innerHTML=`<span class="dot${scored(s)?' done':''}"></span> story-${s.id}`;
      if(i===cur)b.classList.add('active');
      b.onclick=()=>{cur=i;render()};t.appendChild(b);
    });
  });
  const n=FLAT.filter(scored).length;
  document.getElementById('ptext').textContent=`${n} of ${FLAT.length} judged`;
  document.querySelector('#bar i').style.width=(100*n/FLAT.length)+'%';
}

function render(){
  const s=FLAT[cur];
  document.getElementById('premise').textContent=s.premise;
  document.getElementById('title').textContent=s.title;
  document.getElementById('ident').textContent='story-'+s.id;
  document.getElementById('prose').innerHTML=s.html;
  const a=state[s.id]||{};
  document.querySelectorAll('#judge [data-k]').forEach(el=>{
    const k=el.dataset.k;
    if(el.type==='radio'){el.checked=a[k]===el.value}
    else if(el.type==='range'){el.value=a[k]||el.getAttribute('value');el.nextElementSibling.textContent=el.value}
    else{el.value=a[k]||''}
  });
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===FLAT.length-1;
  save();window.scrollTo({top:0,behavior:'instant'});
}

document.getElementById('judge').addEventListener('input',e=>{
  const el=e.target,k=el.dataset.k;if(!k)return;
  const s=FLAT[cur];state[s.id]=state[s.id]||{};
  state[s.id][k]=el.type==='radio'?(el.checked?el.value:state[s.id][k]):el.value;
  if(el.type==='range')el.nextElementSibling.textContent=el.value;
  save();
});
document.getElementById('prev').onclick=()=>{if(cur>0){cur--;render()}};
document.getElementById('next').onclick=()=>{if(cur<FLAT.length-1){cur++;render()}};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type==='text')return;
  if(e.key===']')document.getElementById('next').click();
  if(e.key==='[')document.getElementById('prev').click();
});
document.getElementById('export').onclick=()=>{
  let md='# Judge answers\n\n';
  FLAT.forEach(s=>{const a=state[s.id]||{};
    md+=`## story-${s.id} (${s.premise})\n`;
    md+=`1 TEACH: ${a.teach||''}\n2 CONFIDENCE: ${a.conf||''}\n`;
    md+=`3 PREACHINESS: ${a.preach||''} — ${a.preachwhere||''}\n`;
    md+=`4 ENDING: ${a.ending||''}\n5 NOVEL: ${a.novel||''}\n6 GRADE: ${a.grade||''}\n\n`;});
  const b=new Blob([md],{type:'text/markdown'});
  const u=URL.createObjectURL(b),el=document.createElement('a');
  el.href=u;el.download='judge-answers.md';el.click();URL.revokeObjectURL(u);
};
refreshToc();render();
</script>
</body>
</html>
