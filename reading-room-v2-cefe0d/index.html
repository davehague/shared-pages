lery, and the young man looked up with surprise and said \"that's really something,\" and handed it back and walked to the next stand.</p>\n<p>By midafternoon, Micah had spoken to six people. Two were other makers, both complimentary. One was a student who wanted to know what varnish he'd used. Three were browsers who looked and nodded and walked away. No dealer had asked to play it. No one had asked the price. No one had taken his card.</p>\n<p>He watched the dealers stop at other stands \u2014 stands where makers had brought two or three instruments, where the cards listed prices and websites and commission terms. One dealer played a violin from across the aisle for five minutes, then shook the maker's hand and wrote something in a notebook. A collector asked a cellist to play a cello at the far end of the room, and a small crowd gathered to listen.</p>\n<p>At four o'clock, a man in a blazer stopped at Micah's stand. He looked to be in his fifties, well-dressed, the kind of collector who could tell you the provenance of every instrument in his collection. He studied the violin for two minutes without touching it. Then he said: \"Beautiful work. Who commissioned it?\"</p>\n<p>\"Nobody,\" Micah said. \"I built it on spec.\"</p>\n<p>The man nodded, and something passed over his face that Micah couldn't read. \"It's a very crowded field,\" the man said. Not unkindly. Then he walked away.</p>\n<p>At six, Micah packed the violin in its case and carried it back to his car. He sat in the driver's seat for a while. The case was on the passenger seat, holding everything he'd made in a year. The gallery was dark behind him. His phone showed a text from his landlord: <em>Rent?</em></p>\n<p>He drove home. The apartment was quiet. He owed three months of back rent. His repair clients were gone. The violin was in its case on the kitchen table, perfect, unsold, unasked-for. He opened the case and looked at it \u2014 the amber varnish, the scroll he'd recarved in three weeks, the purfling he'd cut at one in the morning. He closed the case.</p>\n<p>Lena came by on Sunday. She brought sandwiches, the good ones from the deli on Hawthorne. She sat at the kitchen table across from the violin case and didn't say anything for a while.</p>\n<p>\"I sold everything yesterday,\" she said. \"Every spoon, every board. I've got orders for three more bowls and a restaurant wants twelve spoons.\"</p>\n<p>Micah said nothing.</p>\n<p>\"Last year,\" Lena said, \"before the spoons \u2014 you probably don't remember. I spent four months making a chess set. Walnut and maple. I carved every piece by hand. The knight alone took me three weeks.\" She paused. \"I showed it to two shops. Neither wanted it. Nobody wanted a hand-carved chess set. I never asked if they did. I just made it because I wanted to.\"</p>\n<p>Micah looked at her.</p>\n<p>\"You have to find out if someone wants the thing before you build it,\" she said. \"Before you pour yourself into it. That's the part I skipped with the chess set. That's the part you skipped.\"</p>\n<p>She said it simply, without emphasis, the way she said everything. Then she ate her sandwich.</p>\n<p>Micah sat with that. The apartment was quiet. The violin case sat between them on the table, closed, holding its year of work.</p>\n<p>The next morning, Micah opened his laptop. He typed an email to a cellist he'd repaired a cello for two years ago \u2014 a woman named Ruth who played in a quartet and had liked his work. He wrote: <em>I'm starting to take custom commissions again. If you or anyone you know is looking for an instrument, I'd like to talk about what you'd want before I build it. What sound, what feel, what wood. I'd want to know what you're looking for first.</em></p>\n<p>He read it over. He deleted the last sentence, then put it back. He pressed send.</p>\n<p>Then he went downstairs to the workshop, picked up a pencil and a piece of scrap paper, and wrote: <em>Ask first. Then build.</em> He taped it to the wall above his bench, beside the chisels, where he'd see it when he sat down to work. He picked up a fresh piece of maple from the bin \u2014 a small offcut, no more than a foot long \u2014 and set it on the bench. He didn't pick up a tool. He stood there, looking at it, and thought about who might want something from it, and what he might ask them.</p>"}, {"id": "ZO7", "title": "The Last Recurve", "html": "<p>Micah worked the spruce after midnight, when delivery trucks stopped grumbling in the alley and the building settled around him.</p>\n<p>He held the guitar's top beneath the bench lamp and turned it by degrees. The plate was thin enough now that light entered the grain. He had carved it from a billet his father bought in Cremona before Micah was born, tapping through a warehouse of spruce until he found one that answered in a clear, descending note. For thirty years it had waited above the office door.</p>\n<p>Micah flexed the plate between his hands. It yielded, then returned. He set it on the padded bench and touched a knuckle to the lower bout.</p>\n<p>The wood rang.</p>\n<p>\"That's it,\" he said.</p>\n<p>From the loading bay came the metallic clatter of Anya dropping something.</p>\n<p>\"You alive?\" she called.</p>\n<p>\"Yes.\"</p>\n<p>\"Good.\"</p>\n<p>His sister rented the back third of the shop. At the beginning of winter, she had arrived with two folding tables, a soldering iron, and a box of aluminum enclosures meant for electrical junctions. Now the loading bay held shelves of guitar pedals in various states of undress. Circuit boards lay among coffee cups. Masking tape served as labels: BITE, WARMER, LESS GHOST, RUE'S WEIRD ONE.</p>\n<p>On Thursday nights, Anya carried whatever she had made to the Rusty Nail and set it on the stage between bands.</p>\n<p>The first pedal had hummed whenever the bartender turned on the blender. The second had emitted a crack like a rifle shot and silenced three amplifiers. Rue Mercer, the house guitarist, had crouched beside it with a drink in one hand.</p>\n<p>\"Can it keep the dry signal underneath?\" Rue asked.</p>\n<p>Anya had borrowed a pen and written directly on the silver box.</p>\n<p>The next Thursday it could.</p>\n<p>By February, musicians were coming to the loading bay. They played while Anya swapped capacitors and turned tiny screws. Their cigarette smoke drifted in each time the door opened. They complained about knobs that vanished beneath boots, switches that sat too close together, and blue lights bright enough to blind them on dark stages.</p>\n<p>Anya listened with her soldering iron raised. The following week the lights were amber, the switches farther apart.</p>\n<p>Micah kept the door to his side closed.</p>\n<p>He fitted the spruce top to ribs of flamed maple and brushed hot hide glue into the seam. The guitar had no cutaway. A cutaway disturbed the long curve from neck to waist, and Micah wanted that curve unbroken. He carved parallel tone bars and tuned them against the top until the whole assembly answered near F-sharp. He inlaid the fingerboard with twelve phases of the moon cut from white shell, gray shell, and a piece of black pearl no larger than his thumbnail.</p>\n<p>He named the guitar Orison.</p>\n<p>His father had called his best instruments by names that sounded like women or weather. Micah had resisted the habit until now.</p>\n<p>In March, a man in a red coat came through the loading bay and bought two of Anya's pedals. He was touring with a singer whose face Micah had seen on buses. Anya packed the pedals in kitchen-supply boxes and apologized for the bubble wrap.</p>\n<p>\"Make me twenty more before May,\" the man said.</p>\n<p>\"Twenty?\"</p>\n<p>\"If they survive the tour.\"</p>\n<p>Anya stood holding his money after he left. It was more cash than Micah had seen her with in years.</p>\n<p>\"You're going to need proper boxes,\" he said.</p>\n<p>\"I ordered some.\"</p>\n<p>\"Printed?\"</p>\n<p>\"Stickers.\"</p>\n<p>He looked at the handwritten labels curling off the pedals.</p>\n<p>\"Stickers,\" she repeated.</p>\n<p>In April, Micah sprayed the first coat of lacquer. In May, he leveled it with wet paper until the finish shone like water over stone. He shaped the bridge from ebony and fitted its feet so closely that a slip of cigarette paper caught at every edge. He wound the pickup screws into a drawer and closed it. Orison would be heard as wood and air.</p>\n<p>The Greater Lakes Instrument Exhibition opened in June at a hotel beside the airport. Micah had attended with his father as a boy, carrying cases while men with silver hair played chords and spoke about projection. This year he rented a corner booth for four thousand dollars. A cream banner hung above it:</p>\n<p>MICAH VALE, ARCHTOP GUITARS   HAND-BUILT IN OHIO</p>\n<p>He brought one chair, one music stand, and Orison.</p>\n<p>Anya arrived on setup day pushing a hardware-store cart. She had rented half a table in the accessories hall. Her new boxes were black, with white vinyl stickers applied slightly crooked. RUE'S WEIRD ONE had become the Mercy Blend. She had made forty.</p>\n<p>\"They put me next to a strap company,\" she said. \"Feel this.\"</p>\n<p>She handed him a strap printed with orange lobsters.</p>\n<p>\"It's terrible.\"</p>\n<p>\"I ordered fifty.\"</p>\n<p>The exhibition opened at ten.</p>\n<p>By ten fifteen, six people had played the Mercy Blend. By eleven, Anya had written BASS VERSION? on her wrist. Micah heard her laughing from across the hall.</p>\n<p>At his booth, visitors stopped.</p>\n<p>They bent close to the guitar. They followed the curl of the maple with their eyes. A luthier from Toronto examined the binding through a jeweler's loupe and called Micah's miters obscene. An old man asked permission before touching the headstock.</p>\n<p>\"Your father would have liked this,\" he said.</p>\n<p>Micah swallowed. \"Thank you.\"</p>\n<p>The old man moved on.</p>\n<p>Around noon, a conservatory student sat with Orison. The first chord bloomed into the noisy hall, warm and dry, each inner note distinct. The student played more softly. Orison followed him. When he dug in, the sound leapt past the booth and turned heads two aisles away.</p>\n<p>He stopped with his right hand resting on the strings.</p>\n<p>\"Jesus.\"</p>\n<p>Micah felt the long year gather beneath his ribs.</p>\n<p>\"How much?\"</p>\n<p>\"Thirty-eight thousand.\"</p>\n<p>The student laughed once, then saw Micah's face.</p>\n<p>\"Sorry,\" he said. \"I mean, of course. I just...\" He returned the guitar with both hands. \"Could I get your card?\"</p>\n<p>At three, Elias March entered the hall. A crowd moved with him. He had played guitar on records Micah's father kept beside the shop turntable, and though he was nearly seventy, his hands remained broad and loose.</p>\n<p>He noticed Orison from the aisle.</p>\n<p>For twenty minutes, Elias played standards without amplification. Conversations nearby thinned and stopped. He found notes above the twelfth fret by folding his hand around the body, his thumb searching for room the cutaway would have made. Still, the guitar gave him everything. The bass notes held shape. The high strings had no glass in them.</p>\n<p>When he finished, people applauded.</p>\n<p>Elias looked at the guitar for a long time.</p>\n<p>\"That's the finest new archtop I've played in fifteen years,\" he said.</p>\n<p>Someone behind Micah murmured approval.</p>\n<p>Elias turned it sideways. \"Where's the pickup?\"</p>\n<p>\"It doesn't have one.\"</p>\n<p>\"You can fit a floating one?\"</p>\n<p>\"It would dampen the top.\"</p>\n<p>\"Some, yes.\"</p>\n<p>\"The top is tuned without it.\"</p>\n<p>Elias nodded. He played another chord, quieter this time. \"I haven't worked a room without an amp since 1989.\"</p>\n<p>He gave Orison back. The crowd followed him toward the next aisle.</p>\n<p>By closing, Micah's stack of cards had diminished by twenty-three. He had no deposits.</p>\n<p>Saturday brought more praise. A collector photographed Orison but bought a 1956 Gibson from a dealer near the escalators. Two players asked whether Micah made a sixteen-inch body with a cutaway. A woman from a music store asked about wholesale pricing, then learned he had spent eleven months on one instrument.</p>\n<p>Sunday afternoon, the carpet beneath Micah's chair was littered with cards from other makers. He watched people carry out carbon-fiber travel guitars, collapsible stands, compact amplifiers, and Anya's pedals in their kitchen-supply boxes.</p>\n<p>At four thirty, the student returned.</p>\n<p>\"I kept thinking about it,\" he said.</p>\n<p>Micah stood.</p>\n<p>\"My professor wants to see it. Could you bring it to the school sometime?\"</p>\n<p>\"Are you interested in buying?\"</p>\n<p>The student's face closed by small degrees. \"I couldn't.\"</p>\n<p>The announcement came over the speakers thanking exhibitors for another successful year.</p>\n<p>Micah wrapped Orison in its white cloth.</p>\n<p>On Tuesday morning, the bank's locksmith arrived at the shop. He was younger than Micah and wore a ring of keys against his thigh. A woman named Pritchard walked behind him with a clipboard.</p>\n<p>The refinance had bought maple, pearl, lacquer, the exhibition booth, and eleven months without repair jobs. The building had secured it. Micah had known the date printed on every letter.</p>\n<p>He stood at his father's bench while Pritchard read the inventory numbers aloud. Bandsaw. Jointer. Bending iron. Dust collector.</p>\n<p>The locksmith removed Micah's key from the door.</p>\n<p>\"You can take personal tools and finished goods,\" Pritchard said.</p>\n<p>\"What about the bench?\"</p>\n<p>\"It's attached.\"</p>\n<p>\"My father built it.\"</p>\n<p>She looked underneath, where six bolts entered the floor.</p>\n<p>\"It's attached.\"</p>\n<p>Anya carried boxes to her van. Her shelves had already moved to a former tire store across town. Micah lifted Orison from the wall, then packed his chisels into his father's canvas roll. The wooden handles had darkened where two generations of hands had held them.</p>\n<p>Outside, he waited while the locksmith shut the door.</p>\n<p>Through the glass, his father's bench stood under the white lights. A crescent of spruce still lay beside the vise.</p>\n<p>The lock turned.</p>\n<p>Three weeks later, Anya found Micah sitting on an upturned bucket in the tire store. Orison's case lay beside him. A summer storm ticked against the broad front windows.</p>\n<p>She handed him a paper cup of coffee and sat on a crate.</p>\n<p>\"I had an amp once,\" she said. \"You remember the black one I used as a doorstop?\"</p>\n<p>Micah nodded.</p>\n<p>\"Eleven months. Every dollar I had.\"</p>\n<p>\"What happened to it?\"</p>\n<p>\"Nobody bought it.\"</p>\n<p>The rain strengthened. Across the shop, forty black pedal boxes waited in foam trays.</p>\n<p>Anya rubbed a thumb over a burn mark on her wrist. \"You find out whether anybody wants the thing before you pour yourself into building it.\"</p>\n<p>Micah opened his coffee. Steam touched his face.</p>\n<p>The following Thursday, he carried a shape wrapped in a bath towel into the Rusty Nail. Rue was onstage winding cables after sound check.</p>\n<p>Micah set the bundle on a chair and uncovered a guitar body cut from cheap poplar. It was solid, narrow, and still furry from the bandsaw. The neck was held on with four hardware-store screws. A pickup wire trailed through an open hole in the top.</p>\n<p>Rue stared at it.</p>\n<p>\"That yours?\"</p>\n<p>\"For tonight, if you'll try it.\"</p>\n<p>Rue turned the rough guitar over. \"No finish?\"</p>\n<p>\"Not yet.\"</p>\n<p>She strapped it on and played. The first chord came through the amp with a hard midrange bark. She adjusted the volume, played standing, then sat on the edge of the stage. The cable plug pressed against her thigh.</p>\n<p>\"This jack,\" she said. \"Put it up here.\"</p>\n<p>Micah took a carpenter's pencil from his pocket.</p>\n<p>\"Show me.\"</p>\n<p>Rue placed his hand on the unfinished wood, and Micah made the mark.</p>"}, {"id": "IB1", "title": "The Long Grain", "html": "<p>Nell said it in the parking lot behind the shop, cigarette unlit in her fingers because she'd quit eleven months ago and still liked the shape of it. \"Micah. Ask somebody if they want it before you build it. That's the whole trick. Not making the good thing \u2014 finding out first whether anybody's hungry for it.\"</p>\n<p>Micah was unloading claro walnut from the truck bed, slabs he'd driven to Ashland for, a nine-hour round trip. The wood had a figure in it like weather.</p>\n<p>\"They'll want it when they see it,\" he said.</p>\n<p>\"Sure. And I'll quit smoking when I'm dead.\" She put the cigarette behind her ear. \"You're building a thing nobody's asked you for and you're gonna hand them the bill.\"</p>\n<p>\"It's a <em>sideboard</em>, Nell. People have been wanting sideboards for four hundred years.\"</p>\n<p>\"People want a place to put their crap. That's different.\" She helped him lift the third slab, walking backward through the roll-up door, and when they set it on the sawhorses she wiped her hands on her jeans and said, \"Fine. I'm gonna go sell eleven cutting boards.\"</p>\n<p>---</p>\n<p>He built it through a whole year. Not full-time \u2014 he did the work that paid, the built-ins for the doctors up on Fairmount, a run of white oak floating shelves \u2014 but the sideboard was what he thought about at four in the morning when his shoulder woke him.</p>\n<p>Nobody had commissioned it. That was, in Micah's mind, the point. Commissions were compromise: the client's cousin's opinion, the budget, the color of a rug he'd never see. Left alone, he could make the thing itself.</p>\n<p>He resawed the claro for the doors and bookmatched it so the grain opened like a Rorschach, mirror-perfect, the sapwood running pale down the center seam. He cut the case joints by hand \u2014 through-dovetails at the top corners, pins narrow as a pencil line, because a machine cuts them fat and he could see the difference across a room. He made the drawer sides out of quartersawn white oak and planed them until they moved on their own air, so that pushing one closed pressed the next one open, a little breath through the case. He shopped for the right hinges for three weeks and then decided nothing manufactured was right and made his own knife hinges out of brass stock, filing the leaves until his thumb went numb.</p>\n<p>The finish took eleven coats of oil-varnish, wet-sanded between, rubbed out with pumice and rottenstone until the surface held light the way water does \u2014 not shiny, deep. When he moved a lamp across it in the dark shop, the figure in the doors seemed to move underneath, like something swimming.</p>\n<p>He was forty-one years old and he had never made anything close to it.</p>\n<p>---</p>\n<p>Nell's shop was two units down. She made cutting boards, mostly. End-grain, edge-grain, whatever offcuts came through. Some had chips in the corners. She sold them at the farmer's market off a folding table.</p>\n<p>Micah stopped by on a Saturday in March, in the mud and the cold, because she'd asked him to help carry.</p>\n<p>\"These are bad,\" he said, not unkindly, picking up a board with a glue line you could feel with a thumbnail.</p>\n<p>\"That one's forty dollars, so.\" She was setting out a second row. \"Watch.\"</p>\n<p>A woman in a barn coat stopped, ran her hand over the boards, and picked one \u2014 smallish, maple and cherry, nothing.</p>\n<p>\"That's a nice one,\" Nell said. \"Little narrow though. What're you cutting on it?\"</p>\n<p>\"Bread, mostly. My husband gets crumbs everywhere.\"</p>\n<p>\"Then you want a lip,\" Nell said. \"Catches the crumbs. I don't have one today. Give me your name, I'll make you one Thursday.\"</p>\n<p>The woman gave her name. She bought the narrow one anyway.</p>\n<p>That happened four more times in two hours. Somebody wanted a juice groove. Somebody wanted one that fit in a specific drawer and gave Nell the measurement off her phone. A man asked whether she could burn a monogram into it and Nell said she'd never done it but would try, and by then Micah had realized she was writing all of it down in a composition notebook, page after page, in a hand like a doctor's.</p>\n<p>\"That's your product development,\" he said.</p>\n<p>\"That's <em>people telling me what they want.</em>\" She capped her pen. \"It's the cheapest thing in the world and everybody's too proud to do it.\"</p>\n<p>\"You're making forty-dollar cutting boards.\"</p>\n<p>\"I'm making eleven forty-dollar cutting boards a week and I'm about to make a run of bread boards with a lip because a lady told me to.\" She looked at him. \"How's the sideboard.\"</p>\n<p>\"Doors are on.\"</p>\n<p>\"How much you got in it?\"</p>\n<p>He didn't answer that.</p>\n<p>---</p>\n<p>He put it in the spring show at the Craft Alliance on a Thursday, and he stood next to it for six hours on Saturday, and that was when he learned.</p>\n<p>People came. They stopped. Almost everyone stopped \u2014 that was the strange, ruinous part. They saw it from across the floor, and they came over, and they said <em>oh</em> the way you say it in a church.</p>\n<p>\"That's beautiful.\"</p>\n<p>\"Thank you.\"</p>\n<p>\"Did you do the \u2014 is that all one piece?\"</p>\n<p>\"Bookmatched. Same board, opened like a book.\"</p>\n<p>\"Huh.\" A hand hovering, not touching. \"How much is something like this?\"</p>\n<p>\"Fourteen five.\"</p>\n<p>And here was the thing he replayed for months afterward: nobody flinched. Nobody said <em>that's insane.</em> They said, gently, kindly, \"Oh, it's worth it,\" and then they looked at it for another few seconds and then they went and looked at something else.</p>\n<p>A woman with reading glasses on a chain opened the top drawer, and felt the second one sigh open, and made a small delighted sound. \"That's the nicest drawer I've ever touched,\" she said. Micah felt his whole year land in his chest at once.</p>\n<p>\"Where would you put it?\" he asked her.</p>\n<p>She laughed. \"Oh, God, I don't know. That's the trouble, isn't it. My dining room's four feet wide. It's a galley.\"</p>\n<p>An architect gave him a card and said he'd love to spec it for a client sometime, and then, apologetically: \"They usually want it wall-to-wall, though. Built in. So it disappears.\" He tapped the top. \"This is the opposite of disappearing.\"</p>\n<p>A younger couple stood in front of it for a long time. The one in the denim jacket finally said, \"Sixty-eight inches?\"</p>\n<p>\"Sixty-six.\"</p>\n<p>\"We measured for fifty-two.\" A shrug like an apology. \"Everything's fifty-two now. It's the rentals.\"</p>\n<p>By four o'clock Micah had counted eleven people who told him it was the best thing in the show. He had counted zero who could put it in their house.</p>\n<p>He'd made a beautiful object for a room that no longer existed. The dining rooms it was built for were in houses built in 1926, and the people who owned those houses had inherited furniture. The people who wanted new furniture lived in apartments with fifty-two inches of wall and moved every three years and were not going to hire a truck for eight hundred pounds of walnut.</p>\n<p>He had never once asked. He had gone straight to the wood.</p>\n<p>---</p>\n<p>It sat in the shop that summer under a bedsheet. He'd priced it down to eleven, then nine, and at nine he had to stop, because at nine he was paying for the privilege.</p>\n<p>In August the transmission on the truck went, and the credit line on the wood was still there, and he sold the sideboard to a hotel in Nashville for six thousand dollars because a designer saw a photo of it and needed something with presence for a lobby nook. They put a bud vase on it. They cut a hole in the back for a lamp cord \u2014 he found out from an Instagram photo, the round hole raw and unbanded through his bookmatched panel, and he had to put the phone face-down on the bench and stand there breathing for a while.</p>\n<p>Nell came by in September with two coffees. The bedsheet was still hanging on a nail where he hadn't taken it down.</p>\n<p>\"Sixty-eight hundred,\" she said, when he told her. \"For a year.\"</p>\n<p>\"Six.\" He drank his coffee. \"Six thousand.\"</p>\n<p>She sat on the sawhorse. She'd hired a kid part-time by then, and had a cart at the market, and a small waitlist, and was still, as far as Micah could see, making cutting boards that a good eye would call fine but not remarkable.</p>\n<p>\"You want to know what the difference was?\" he said. \"Genuinely. Not being a prick. I want you to say it.\"</p>\n<p>\"You already know.\"</p>\n<p>\"Say it anyway.\"</p>\n<p>Nell blew on her coffee. \"You built the best thing in the room and then went looking for somebody who wanted it. I found people who wanted a thing and then built it.\" She shrugged. \"Mine's uglier. Mine sells. That's not a talent gap, Micah, you're twice the woodworker I am. It's just the order of operations.\"</p>\n<p>\"Ask first.\"</p>\n<p>\"Ask first,\" she said. \"Then build.\"</p>\n<p>---</p>\n<p>He started carrying a composition notebook. It felt stupid for about six weeks.</p>\n<p>At the market, at job walks, at the counter of the hardware store, he asked people what they didn't have room for. He heard the same sentence maybe forty times in two months \u2014 <em>there's nowhere to put anything, and I can't have something huge</em> \u2014 and by November he had a design for a wall-hung cabinet, thirty-six inches, a foot deep, that hung on a French cleat one person could install with a level and a drill. Rental-safe. Movable. Two doors, a drawer, one shelf.</p>\n<p>The first one was rough. He knew it was rough \u2014 the door gap was a hair uneven, and he'd used shop-grade cherry because he wasn't going to put claro walnut into a prototype. He hung it at Nell's cart on a piece of plywood wall with a price on it and a card that said <em>tell me what's wrong with this.</em></p>\n<p>People told him. A lot of them. It needed to be deeper for plates. Could the drawer be lockable, for meds. Somebody wanted it in white. Somebody wanted two.</p>\n<p>He built eleven of them that winter, none of them as good as the sideboard, all of them sold before they were finished, and he wrote it on the inside of the notebook cover so he'd stop having to relearn it, in a hand almost as bad as Nell's:</p>\n<p><em>Find out if they want it. Then pour yourself into it. Not the other way around.</em></p>"}, {"id": "PU5", "title": "The Ugly One", "html": "<p>Micah had shaved thirteen spindles and had seven to go when Teo came through the shop door backwards, dragging a bench.</p>\n<p>It was a bench the way a sentence is a sentence: two-by-fours, a plank of yellow pine, deck screws sunk straight through the top so the heads showed like buttons. He set it down on her clean floor and put his hands on his hips.</p>\n<p>\"Can I use your sander?\"</p>\n<p>She held the spindle up to the window. Walnut, riven, straight-grained end to end because she had split it, not sawn it, from the butt log of the tree that had stood over their mother's driveway for sixty years until a March wind put it through the fence. Four boards, two half-logs. She had wanted it since the day the crew cut it up. Everything in this chair would come from that tree.</p>\n<p>\"The orbital's on the bench. Use the eighty grit, then one-twenty. Then one-eighty. Wipe it between.\"</p>\n<p>\"I've got eighty.\"</p>\n<p>\"You can plug the screws,\" she said. \"I've got walnut dowel. Twenty minutes and you'd never see them.\"</p>\n<p>\"She's coming at four.\" He was already plugging in the sander. \"It's for shoes. She's got four kids and the shoes are in a pile by the door. She doesn't care about the screws.\"</p>\n<p>The sander whined and drowned out anything else. Micah went back to the spokeshave. She was working to a gauge she'd made from a strip of brass, one notch for the foot of the spindle and one for the waist and one for where it passed through the arm bow, and she checked every inch as she went. Under her hands the wood came off in curls the color of tea.</p>\n<p>Behind her the phone buzzed on the bench. She looked once. Mrs. Okafor, second time this week. The daughter's wedding, a table for the reception, would Micah call. Micah put the phone face down and picked up spindle fourteen.</p>\n<p>When Teo left, he took the bench and left the dust. He'd sanded it with eighty and stopped.</p>\n<p>---</p>\n<p>She had planned it in November. Sack-back rocker, walnut throughout, which nobody did because walnut wouldn't take a bend as kindly as oak. She'd worked around it. Seat carved from a two-inch slab with the adze and then the travisher until it held her like a hand. Legs turned and driven through the seat and wedged from above. Arm bow and back bow steamed in a PVC pipe fed by a wallpaper steamer, bent hot around a form she'd shaped from three failed forms, and the second bow had cracked, and the third had held. Rockers sawn to a curve she'd drawn and redrawn until the chair came to rest, loaded, with the sitter's eyes level to the horizon. Nobody would know that. She would know it.</p>\n<p>By January she was two months behind on the shop. Dale, who owned the building, said the storage people had made him an offer, and he'd rather have her, but he couldn't carry her past June. She said the show was the first weekend in June. She said Renata Voss came to that show every year and had bought two of Micah's pieces before, and had said, standing in this shop, that Micah should stop doing tables for people's kitchens and make the thing only Micah could make. Dale said fine. June.</p>\n<p>She turned down four jobs between November and May. A cherry bed. Built-ins for a dentist. A conference table for the credit union. Mrs. Okafor, whom she finally called back in April, standing in the shop with oil on her hands.</p>\n<p>\"After the show,\" Micah said. \"September I could start.\"</p>\n<p>\"The wedding's the ninth of August.\"</p>\n<p>\"I know. I'm sorry. I'm in the middle of something.\"</p>\n<p>\"You made my mother's hutch,\" Mrs. Okafor said, not unkindly, and let her go.</p>\n<p>Saturdays, Teo set up at the flea market by the fairgrounds. Micah went once, in March, for a bandsaw blade from the tool guy, and found her brother between a woman selling candles and a man selling knives, with a folding table full of the ugliest things she'd ever seen. Cutting boards with the glue lines showing. A stool. Two of the shoe benches, and a third, taller, with a shelf. He had a notebook open on the table and a Sharpie.</p>\n<p>\"Somebody asked for a taller one,\" he said. \"So I did the taller one. This lady wants hooks.\" He drew hooks on the bench, right there on the wood, in Sharpie, while the lady watched. \"Here? Or lower, for the kids?\"</p>\n<p>\"Lower,\" the lady said. \"And could it be white?\"</p>\n<p>\"It could be white.\"</p>\n<p>Micah bought her blade and drove home and steamed the arm bow, and it held.</p>\n<p>---</p>\n<p>The show was in the old armory, a hundred and forty makers under a steel roof. She'd rented a corner booth and driven up at five in the morning with the chair wrapped in moving blankets in the bed of the truck. When she uncovered it, the man in the next booth, a turner, stopped setting up his bowls and came over and stood there for a while.</p>\n<p>\"Sit in it,\" she said.</p>\n<p>He sat. He rocked. He looked at her over his shoulder. \"You did the rockers.\"</p>\n<p>\"I did the rockers.\"</p>\n<p>People came all morning. They did what he'd done. They sat, rocked, closed their eyes; they came up out of it slowly, one hand on the arm bow. They took pictures. They asked what it was and she told them: walnut, one tree, hand-riven, hand-bent, hand-carved, and their faces did a thing she'd been picturing for seven months. Then they asked how much and she said sixty-eight hundred and they said it was worth it, it was worth every penny, and they thanked her and walked to the next booth.</p>\n<p>Renata came at one. She was small and gray and she wore a canvas apron even here, and she'd sold Micah's cherry blanket chest in ten days two years ago. She sat in the chair a long time. She rocked, and stopped, and rocked. When she got up she put a hand flat on the seat as if it were an animal.</p>\n<p>\"It's the best thing you've made,\" she said. \"It might be the best thing in this building.\"</p>\n<p>\"Thank you.\"</p>\n<p>\"I can't take it.\"</p>\n<p>Micah waited.</p>\n<p>\"I had a rocker in the front window twenty-six months. A good one. Not this good, but good. People sat in it and said the same things they're saying to you. Nobody has the room. Nobody wakes up wanting one. What they call me for is a bed, a dining table, a credenza for the TV. They call because they've measured a wall.\" She looked at the chair again, and then she looked at the floor.</p>\n<p>At three, a man in a good jacket sat and rocked and asked if she'd do dining chairs like it. The same back, the same seat, no rockers. Eight of them, walnut. Thanksgiving.</p>\n<p>\"I don't have the wood,\" Micah said, and heard it as she said it. Everything from the tree was in the chair. The offcuts were on the shop floor, and some of them were in the stove.</p>\n<p>She loaded the chair at six. Nobody had bought it. Twelve people had taken her card.</p>\n<p>---</p>\n<p>Dale had already had the sign made. She saw it Monday, leaning inside the door where he'd left it for her, so she wouldn't have to hear it from him: the storage company's logo, ClimateGuard, in blue. He gave her till the end of the month, and he didn't charge her for it.</p>\n<p>She moved out on a Sunday. Teo brought his truck and they took the lathe apart on the floor because it wouldn't go through the door whole, which was how it had come in, twelve years ago, with their father on the other end of it. The bench went to their mother's garage. The hand tools went in milk crates. The chair went on their mother's porch because it was the only place there was for it, and it looked, out there, like something that had always been there, which was the worst part.</p>\n<p>They sat on the porch steps after, drinking their mother's iced tea out of jelly jars. Teo's phone kept lighting up on the step between them. Somebody wanting a bench. Somebody wanting the white one. He turned it over.</p>\n<p>\"Mrs. Okafor's table held,\" he said. \"The wedding one. Forty people leaned on it and it held. She sent a picture.\"</p>\n<p>Micah looked at him.</p>\n<p>\"She called me in May. She said you were busy.\" He rubbed the back of his neck. \"It's yellow pine, Mike. Two-by-twelves. I put a beam under it and painted the legs and I was scared the whole time.\"</p>\n<p>\"Did she like it?\"</p>\n<p>\"She cried. But she cried about everything that day.\"</p>\n<p>The chair creaked behind them in a wind that was mostly nothing. Micah turned and looked at it, the walnut gone dark and deep with oil, the spindles she'd checked with a brass gauge, every inch. It rocked twice and settled level.</p>\n<p>\"How'd you know she'd want the hooks?\" Micah said. \"The lady in March. How'd you know about the shelf, or the white one. How do you know any of it.\"</p>\n<p>\"I don't.\" Teo picked at the label on the jar. \"I stopped building anything till somebody's already told me they want it. I make the ugly one first and I put it in front of them and let them tell me what it's supposed to be.\" He shrugged. \"That's all I've got.\"</p>\n<p>She didn't say anything. He didn't either. Their mother came out with the pitcher and filled the jars and went back in.</p>\n<p>---</p>\n<p>Saturday, at the flea, Teo had the table up by seven and Micah put a stool down on the end of it. She'd made it Friday night in their mother's garage out of a pine two-by-ten and a piece of poplar from the bin, legs through-wedged because she couldn't help that, but nothing else. Forty minutes. No finish. The seat still had pencil on it. Under it she set an index card in Sharpie: SIT ON IT. TELL ME WHAT'S WRONG WITH IT.</p>\n<p>The candle woman came over first, before she'd even opened her boxes, and sat, and shifted her weight forward and back.</p>\n<p>\"Too low,\" she said. \"For me, anyway. Where's it going to live? Kitchen?\"</p>\n<p>\"I don't know yet,\" Micah said. She got out her notebook. \"Where would you put it?\"</p>"}, {"id": "WW0", "title": "Float Day", "html": "<p>Micah had the strongback leveled to a sixty-fourth of an inch when Jo pulled into the bay with the ugliest boat he had ever seen strapped to the roof of her Corolla.</p>\n<p>She carried it in through the roll-up door one-handed, like a ladder. Fourteen feet of pine ribs under heat-shrunk nylon, painted highway-sign yellow. You could see the stitching along the gunwale from across the room.</p>\n<p>\"Don't,\" she said.</p>\n<p>\"I didn't say anything.\"</p>\n<p>\"You were about to.\" She set it on the concrete beside his molds. It rocked. It weighed nothing. \"Two weekends. Thirty-one dollars of lumber and a roll of fabric off eBay. I've had it in the water four times.\"</p>\n<p>Micah looked from the yellow boat to his own work: seventeen station molds cut from Baltic birch, screwed plumb to a beam that ran half the length of the bay, the skeleton of the canoe he'd been drawing since March. Western red cedar in the rack, book-matched. Ash for the gunwales. Cherry for the decks.</p>\n<p>Jo said it then, before he'd shown her the drawings. She said it the way she said most things, without heat, wiping her hands on her jeans.</p>\n<p>\"Find out if anybody wants it before you pour yourself into it, Mike. Build one rough. Let somebody paddle it. Then build the good one.\"</p>\n<p>\"People will want it.\"</p>\n<p>\"You don't know that. Nobody's asked you for a canoe.\"</p>\n<p>\"Nobody asked Stradivari for a violin.\"</p>\n<p>\"I bet somebody did, actually.\" She knocked on the yellow hull. It sounded like a drum. \"I'm not saying don't. I'm saying ask first.\"</p>\n<p>He said he'd think about it. He went back to the level.</p>\n<p>---</p>\n<p>He'd been laid off from Kessler Cabinet in February, nineteen years, and the severance had felt like a lot of money in February. The bay was six-fifty a month, an old tire warehouse on Water Street with a roll-up door and a floor drain and no heat. He'd told himself a canoe was a reasonable thing to build with a year and a severance. He was the best finish man Kessler had ever had. Everyone at Kessler said so.</p>\n<p>He stripped the hull without a single staple, because staples leave holes. He hot-glued blocks to the molds and clamped each cedar strip to the one below it and waited for the glue and did the next. A strip a half hour. Two hundred and six strips. He scarfed every joint so the grain ran unbroken bow to stern, and he laid the strips so the color went from honey at the sheer to rust at the keel and back, and at two in the morning under the shop lights he would stand at the stern and sight down the hull and see the whole thing as one piece of wood, which is what he was after.</p>\n<p>Jo posted a picture of the yellow boat on the county Facebook group. <em>Made this. It floats. Trying it Saturday at Alum Creek, 10am, come paddle it if you want.</em> Six people came. A retired teacher named Denise said it was tippy and she couldn't get out of it with her knee. A man named Curtis wanted one that would fit in his truck bed with the gate up.</p>\n<p>The second boat was four inches wider and two feet shorter and painted a green Micah could only describe as institutional. Denise paddled it and said better. Curtis put a deposit down before it was painted. Four hundred dollars.</p>\n<p>\"You're going to drown somebody,\" Micah said at Christmas, at their mother's table.</p>\n<p>\"Denise put a cup holder in hers.\" Jo passed the rolls. \"Drilled it herself. She sent me a picture.\"</p>\n<p>He faired the hull in January with the space heaters going, sanding with a longboard he'd made from a strip of ash, checking the surface with his palm and then with a raking light and then with his palm again. He glassed it in February, six-ounce cloth wet out with epoxy, the cedar going dark and deep under it the way wood does, like it's been underwater forever. He put the bay on the credit card in March.</p>\n<p>Jo built the third boat in her garage with Curtis watching, and Curtis asked why the seat was so far back, and she moved it. She built the fourth for Denise's sister. Photographs went up on the county group, boats sitting crooked on the beach, people in life jackets grinning in them. In April she came by the bay with a clipboard.</p>\n<p>\"Float day at the reservoir. May seventeenth. Bring it.\"</p>\n<p>\"It's not done.\"</p>\n<p>\"It doesn't need to be done. It needs to be sat in.\" She walked around the hull on its sawhorses. It was upright now, gunwales on, the ash steamed and bent and scarfed and screwed with silicon bronze. She didn't touch it. She looked like she wanted to. \"Mike. It's beautiful. Let somebody sit in it.\"</p>\n<p>\"There's no finish on it. Epoxy goes cloudy in the sun.\"</p>\n<p>\"For one day?\"</p>\n<p>\"You'll see it in June,\" he said. \"You'll see.\"</p>\n<p>---</p>\n<p>June, then. The paddling club's Boats on the Lawn, forty vendors on the grass above the reservoir launch and the sky the white-blue that means ninety by noon.</p>\n<p>He'd trailered it in and unloaded it with Jo's help onto padded sawhorses. Seventeen feet two inches. Sixty-eight pounds. Seven coats of spar varnish, wet-sanded between, the last one laid on with a badger brush in a room he'd sealed with plastic and misted with water to hold the dust down. Cherry decks. Hand-caned seats. A card, printed at the library, propped against the bow: $8,400.</p>\n<p>People came. They came all morning. They put their hands on it and pulled them back and then put them on again. They took pictures. A man asked how long, and Micah said a year, and the man whistled and said it showed. A woman said it belonged in a museum. A man in a Patagonia vest walked the length of it twice and asked what it weighed.</p>\n<p>\"Sixty-eight.\"</p>\n<p>\"I paddle alone.\" The man said it kindly. \"I cartop on a Subaru. I couldn't get that up there by myself.\"</p>\n<p>\"You'd want a rack with rollers.\"</p>\n<p>\"Sure.\" He touched the cherry deck. \"It's the best thing here. It really is.\"</p>\n<p>A couple asked if it would handle the Kokosing, which was the river the club actually paddled, which was shallow and shaley and low by July.</p>\n<p>\"It'll take some scraping,\" Micah said. \"That's what the glass is for.\"</p>\n<p>The woman laughed, not unkindly. \"I'd be sick every time I heard a rock.\"</p>\n<p>At one o'clock a girl of about ten asked if she could sit in it and her father said honey, no, and Micah heard himself say the ramp was gravel, and it wasn't rigged for the water today anyway, and the father was already steering her off by the shoulder. Micah stood by his canoe on the grass and understood that this was the third or fourth time that morning he'd said something to keep somebody out of it.</p>\n<p>Down at the beach Jo had three boats in the water and a hand-lettered sign, TRY ONE, and the clipboard. From the lawn Micah could see the yellow one and the green one and a newer one, blue, with a shape that had gotten, without his noticing, actually decent. Kids in it. Denise in it. Curtis standing thigh-deep holding the stern of the blue one for a woman climbing in, saying something that made her laugh. Jo took deposits on the tailgate of the Corolla. Two hundred down, four-fifty total, four weeks. By two o'clock she had nine names.</p>\n<p>Nobody bought the canoe. Nobody had come close. What they wanted, he could see now, plainly, from up here on the lawn, was something they could lift alone and throw in a truck bed and scrape down a shale river and not think about. Nobody had asked him for a cathedral. He'd built one anyway, and it had taken two people to carry it in.</p>\n<p>Jo helped him load it at five. It took both of them, one on each end, and she didn't say anything about it, which was worse.</p>\n<p>---</p>\n<p>He took it out once. A Tuesday, before dawn, the reservoir flat and the mist standing on it. He waded in to his knees so the keel wouldn't touch gravel and got in the way their father had taught them, low and centered, and pushed off.</p>\n<p>It was perfect. He'd known it would be. It tracked like a thought. The paddle went in without a sound and the hull ran and kept running after he'd stopped, and he sat still in the middle of the water while the sun came up on the varnish and lit the cedar from the inside, honey to rust to honey, one piece of wood, and there was nobody on the shore.</p>\n<p>Ray, who owned the warehouse, came by the following week. Three months. Micah said he knew. Ray said he liked him and had let it go longer than he should have.</p>\n<p>The Water Street brewery bought the canoe for three thousand dollars to hang from the taproom ceiling. Micah watched them hoist it with two chain falls, keel up, so people drinking underneath could see the color run bow to stern. The manager said it was the most beautiful thing they'd ever put in the building, and meant it. Micah gave Ray the rent, and the rest went to the card, and he moved his tools into Jo's garage.</p>\n<p>---</p>\n<p>The garage smelled of pine and hot nylon. Boat eleven was on the jig, ribs steamed and clamped, and Jo was at the bench reading him a message from a man named Owen who drove a Honda Fit and wanted a boat that fit in the back with the seats down.</p>\n<p>\"That's what, six feet of floor? Six and a half with the hatch open?\"</p>\n<p>\"Something like that.\"</p>\n<p>Micah looked at the ribs. Six and a half feet was a bathtub. It wouldn't track. He could think of a way to make it track, a keel strip, a little rocker, the bow folded up so the waterline ran longer than the floor. He could see the whole boat in his head. He could see it lofted and faired and finished. Nineteen years at Kessler; he could see the finish on almost anything.</p>\n<p>\"I could build him something good,\" he said.</p>\n<p>\"I know you could.\"</p>\n<p>\"Don't cut the good ribs yet.\" He picked up a length of the cheap pine. \"Let me knock one together out of this first. Rough. Get Owen in it Saturday and see what he says. Then we build the good one.\"</p>\n<p>Jo put the phone face down on the bench. She didn't say anything about October, or the lawn, or the taproom ceiling. She pulled the roll of nylon down off the shelf and set it by his hand.</p>\n<p>\"Ask first,\" Micah said, to nobody in particular, and started marking the pine.</p>"}, {"id": "OK8", "title": "The River Scale", "html": "<p>The steam box was twelve feet of spruce box-beam wrapped in old horse blankets, fed by a copper kettle that sat over a two-burner Coleman stove. When the water reached a rolling boil, the shop filled with the sweet, wet-hay smell of heated white oak.</p>\n<p>Micah worked in wool socks and canvas apron, moving without a rush. He opened the hatch at the box\u2019s end, pulled a five-foot rib of clear white oak with heavy leather welding mitts, and had it against the form in under six seconds. The wood was supple as boiled licorice for forty seconds, no more. He drove the wooden wedge home with three taps of a rawhide mallet, clamped the rib at the sheer line, and stepped back to watch the grain take the curve.</p>\n<p>Outside, in the driveway between the old lime-shed and the marsh channel, a circular saw shrieked through fir plywood.</p>\n<p>The noise stopped, followed by the clatter of a two-by-four hitting gravel. A truck engine idled\u2014Gid Barrow\u2019s rusted Dodge with the broken manifold.</p>\n<p>Micah did not look through the dusty six-pane window. He took his drawknife from the rack, laid its bevel against a cedar plank, and pulled. A shaving curled off the edge, translucent as an onion skin, curling around his thumb before falling among thousands of identical curls on the pine floorboards.</p>\n<p>A laugh drifted through the wall\u2014Ray\u2019s flat, easy bray, followed by the wet cough of Gid spitting tobacco into the weeds.</p>\n<p>Micah kept his thumbs even on the handles. The cedar had come by freight from a mill in Port Angeles: thirty boards of northern white, vertical grain, sixteen feet long, without a pin-knot in the run. It had cost fourteen hundred dollars, half of what Micah had left in the Mason jar behind the water heater.</p>\n<p>Outside, gravel crunched. Ray\u2019s voice came clear through the cedar siding: \"Stand in it, Gid. Don\u2019t look at it from there. Get your boots in.\"</p>\n<p>A tailgate dropped with a heavy iron bang. Through the gap in the double doors, Micah could see them. Ray was wearing his grease-stained Carhartt vest over a gray thermal shirt. On two sawhorses in the open sun sat two sheets of half-inch CDX plywood, stitched together along the keel with plastic zip-ties and smeared with yellow polyurethane construction adhesive.</p>\n<p>Gid climbed up onto the sawhorses in his rubber knee-boots. He was sixty, with hands like salt-cured ham, and he stood in the raw plywood trough with his feet wide.</p>\n<p>\"Too narrow in the belly,\" Gid said. \"When I haul a pot over the rail, the crate sits right here. My shins\u2019ll hit.\"</p>\n<p>Ray reached behind his ear, pulled out a flat red carpenter\u2019s pencil with a blunt, squared-off lead, and handed it across the gunwale.</p>\n<p>\"Mark it,\" Ray said.</p>\n<p>Gid took the red pencil, bent at the waist, and drew a thick, jagged line four inches back from the cross-brace. \"Put the seat there. And cut the rail down two inches right where my left hand goes, so the pot clears without tipping the brine in.\"</p>\n<p>Ray took the pencil back, tucked it behind his ear, and reached for the jigsaw. \"Come back at four,\" he said.</p>\n<p>\"Paint\u2019s wet, I don\u2019t care,\" Gid said. He spat into the nettles, climbed down, and let the Dodge roll into gear.</p>\n<p>Micah turned back to his bench. He took up his brass micrometer, measured the plank edge\u2014five-sixteenths of an inch, true to the line\u2014and picked up the badger-hair brush to lay a coat of boiled linseed and turpentine into the end-grain.</p>\n<p><em>*</em></p>\n<p>By November, the marsh grass had turned the color of an old broom, and the mudflats froze into gray ridges between tides.</p>\n<p>Micah kept the potbelly stove going with pine offcuts, but the air at the edges of the shed stayed cold enough to stiffen the tallow on his planes. He was planking the hull now: lapstrake, nineteen strakes to a side, every plank lapped five-eighths of an inch over the one below it, fastened through the laps with solid copper boat nails peened over tiny concave roves.</p>\n<p>He had twenty-four hundred rivets to drive. For each one, he drilled a pilot hole with a hand-cranked eggbeater drill, pushed the square-shank nail through from the outside, held an iron backing buck against the head, slipped the copper washer over the pointed shank inside the hull, clipped the excess with diagonal cutters, and peened the copper down into a bright, perfect mushroom head with twenty light strokes of a two-ounce ball-peen hammer.</p>\n<p>His shoulder ached into his collarbone by noon. When he tapped the hammer, the whole shop rang with a high, clear note, like an iron clock striking the minute.</p>\n<p>Clara came down the outside stairs from the loft apartment at four o\u2019clock, wearing her wool coat and carrying a cardboard box with her sewing machine inside.</p>\n<p>Micah had three rivets left on the seventeenth strake. He held the bucking iron with his knee, the cutter in his left hand.</p>\n<p>\"The fuel oil man came,\" she said from the doorway. She did not step onto the shavings.</p>\n<p>\"I know,\" he said. He tapped the rivet twice. <em>Tink. Tink.</em> \"I saw the slip under the door.\"</p>\n<p>\"He won't fill the tank.\"</p>\n<p>\"I'll go down to the harbor with the five-gallon jugs after I finish this strake.\"</p>\n<p>\"There's no money in the jar, Micah.\"</p>\n<p>He set the hammer on the thwart. His fingers were stained black from the copper dust and the raw linseed. The boat sat on its building frame in the center of the room\u2014a seventeen-foot sweep of white cedar, its sheerline rising to a plumb stem of black walnut, the wood glowing in the lantern light like the skin of an apple.</p>\n<p>\"When she\u2019s in the water,\" Micah said, his voice quiet, \"there won't be another pulling boat within two hundred miles that can touch her. A man can row her six miles out to the shoals and back on a cup of tea. She\u2019ll sell for seven thousand at the spring fitting-out. Eight, if the summer people come up from the yacht club.\"</p>\n<p>Clara looked at the boat. She looked at the copper nails, lined along the laps like tiny copper coins spaced exactly two inches apart from stem to stern.</p>\n<p>\"The lease on the shed is due next week,\" she said.</p>\n<p>\"Vance knows me,\" Micah said. \"He knows what's on the floor.\"</p>\n<p>She carried the box to her car. The engine started, the gravel popped under her tires, and the red taillights vanished down the creek road toward the highway.</p>\n<p>Micah picked up the two-ounce hammer. He set the backing iron against the cedar, aligned the washer, and struck the copper. <em>Tink. Tink. Tink.</em></p>\n<p>Outside, the snow began to fall, melting as it touched the open mud. Under the blue tarp across the driveway, a halogen work light burned against the white flakes.</p>\n<p>A boy named Jesse stood there in a yellow rain slicker, holding a plastic shotgun case. Ray was leaning against a three-sided box of five-eighths fir, drinking coffee from a thermos cup.</p>\n<p>Ray reached behind his ear, pulled the flat red pencil from his knit cap, and passed it to the boy.</p>\n<p>Jesse laid his gun case across the top edges of the plywood, moved it six inches toward the bow, and drew two heavy red arrows on the raw wood. \"Cut the coaming out here,\" Jesse said. \"So the Lab can get over the side without hanging his hind legs in the decoys.\"</p>\n<p>Ray took the red pencil, made a notch with his thumb, and nodded. \"Bring two hundred dollars on Friday. I\u2019ll have the tractor enamel dry on her.\"</p>\n<p>The boy handed him three crumpled twenties from his pocket. Ray smoothed them with his thumb, stuffed them into his Carhartt vest, and pulled the pull-cord on his chainsaw to notch a two-by-four for the transom knee.</p>\n<p><em>*</em></p>\n<p>In March, the ice broke up in the creek, leaving dirty brown foam along the spartina grass.</p>\n<p>Micah began the varnishing.</p>\n<p>He spent four days sweeping, vacuuming, and wiping down the walls with damp rags to kill the dust. He locked the double doors from the inside, hung wet canvas sheets across the windows to trap the lint, and heated the air to seventy degrees with two electric radiant heaters he had bought on credit at the hardware store.</p>\n<p>He used four-ounce cans of marine spar varnish, six coats on the cedar, eight on the walnut transom and the cherry breast-hook. Between each coat, he rubbed the entire hull with four-hundred-grit wet paper and mineral spirits, until the surface was smooth as cold marble.</p>\n<p>When the eighth coat dried, the wood looked an inch deep. You could see the grain of the white cedar twisting through the laps, amber and cream, with the copper rivets glinting beneath the clear resin like amber beads frozen in ice.</p>\n<p>A heavy fist struck the double doors.</p>\n<p>Micah set down his tack cloth, unbolted the interior latch, and pulled the door open two inches.</p>\n<p>Vance stood in the mud, his coat collar turned up against the salt mist. He carried a narrow clipboard with a yellow carbon form clipped to the top.</p>\n<p>\"I need the floor, Micah,\" Vance said.</p>\n<p>\"Three weeks,\" Micah said. \"The fitting-out fair is the third Saturday in May.\"</p>\n<p>Vance didn't look past Micah's shoulder into the shed. He looked at the clipboard. \"You're twenty-four hundred behind. The marina down at the point wants to put their winter outboards in here starting the first of the month.\"</p>\n<p>\"Look at her, Vance,\" Micah said, opening the door wider.</p>\n<p>The skiff sat in the light of the radiant heaters. The cherry thwarts were hand-planed to fit the curve of a man\u2019s thighs, rubbed with beeswax and walnut oil. On the floorboards lay two spoon-bladed sculls he had carved from Sitka spruce, balanced with lead plugs poured into the handles so they would float weightless in the oarlocks.</p>\n<p>Vance glanced at the boat. He tapped the brass clip of the board against his knee.</p>\n<p>\"She\u2019s pretty,\" Vance said. \"My brother-in-law had a mahogany Chris-Craft back in eighty-two. Spent every Saturday with a scraper.\" He looked back down at the yellow slip. \"May eighteenth. Sunday morning, eight o\u2019clock, the chain goes on the hasp.\"</p>\n<p><em>*</em></p>\n<p>The Saturday of the fitting-out fair at St. Jude\u2019s Cove was clear and windy, with whitecaps running across the outer bay and the smell of fried dough drifting from the firemen\u2019s tents on the pier.</p>\n<p>Micah had borrowed a flatbed trailer from the feed store for forty dollars. He had lined the timber bunks with thick scraps of sheepskin, strapped the skiff down with four-inch cotton web straps, and driven fifteen miles an hour along the shoulder so the gravel wouldn't pit the varnish.</p>\n<p>He set the boat in the middle of the gravel turnout between the fuel dock and the municipal launch ramp. He had polished the bronze rowlocks with jeweler's rouge until they shone like new gold, and he had laid the Sitka oars across the cherry thwarts on clean white towels.</p>\n<p>By ten in the morning, a circle of people stood around the trailer.</p>\n<p>A man in a navy wool sweater and leather deck shoes walked slowly around the stern, his hands clasped behind his back.</p>\n<p>\"Look at the scarfing on that sheer strake,\" the man said to his wife. \"You couldn't slip a razor blade into that joint.\"</p>\n<p>Micah stepped forward, the salt wind in his hair. \"White cedar over white oak,\" he said. \"Copper-fastened throughout. She draws three inches with two grown men aboard.\"</p>\n<p>The man smiled, his hands still behind his back. \"What do you do with her?\"</p>\n<p>\"Row,\" Micah said. \"She\u2019ll run four knots without raising your pulse.\"</p>\n<p>The man nodded, his eyes wandering along the curve of the walnut stem. \"God, you\u2019d weep if you touched a stone with it, wouldn't you? My boy would drop an iron sinker on those floorboards and put a dent in a hundred hours of work.\" He patted his wife\u2019s elbow. \"Beautiful thing. Like something in a museum.\"</p>\n<p>They walked toward the chowder tent.</p>\n<p>At noon, a man with two boys in baseball caps stopped. He reached out a hand, paused two inches from the varnished rail, and pulled his fingers back.</p>\n<p>\"Can you clamp a five-horse Evinrude on the back?\" the man asked.</p>\n<p>\"She\u2019s a pulling boat,\" Micah said. \"The transom is black walnut, double-rabbeted to the sternpost. An outboard would shake the rivets loose in a season.\"</p>\n<p>The man looked at the slim, tapering stern, nodded politely, and took his boys by the shoulders. \"Come on, boys, let's look at the inflatables.\"</p>\n<p>Sixty feet down the gravel ramp, Ray\u2019s Ford F-250 sat parked with its tailgate down. In the bed were three plywood skiffs, painted the dull green of a farm tractor, with galvanized rowlocks bolted through two-by-four blocks on the gunwales.</p>\n<p>A woman who ran the oyster nursery at the mouth of the tidal gut stood on the lower tailgate, her rubber bibs smeared with brown marsh slime.</p>\n<p>Ray sat on a plastic milk crate on the gravel, eating a cold fried-egg sandwich from a sheet of foil.</p>\n<p>He reached behind his ear, took out the flat red pencil, and handed it up to the woman.</p>\n<p>She stepped into the center of the green box, took the pencil in her fist, and drew a circle on the flat floorboards by the corner of the transom.</p>\n<p>\"I need a two-inch hole drilled right here,\" she said, \"and a plug on a chain, so I can wash the spat off the seed bags and let the mud drain out while I\u2019m under power.\"</p>\n<p>Ray took the red pencil back, made a cross mark inside the circle, and licked his thumb. \"Pick it up at the dock on Tuesday,\" he said.</p>\n<p>The woman reached into her oilskin pocket, pulled out five one-hundred-dollar bills held with a rubber band, and counted them onto the tailgate. Ray dropped them into his vest pocket next to his sandwich wrapper without counting them again.</p>\n<p>By four o'clock, the wind had come around to the northeast, cold and damp off the open water. The firemen were taking down the canvas tents, and the smell of fried dough was replaced by the sour tang of low tide.</p>\n<p>The gravel around Micah\u2019s trailer was empty.</p>\n<p>The sheepskin pads on the bunks had soaked up the road dust. A gull landed on the bow, its black feet leaving two small gray smudges on the mirror-finish varnish of the forward deck.</p>\n<p>Micah took a clean flannel rag from his pocket, walked to the bow, and wiped the smudges away. The wood underneath was flawless.</p>\n<p>He took the cotton straps from the truck cab, laid them over the sheer line, and clicked the ratchets tight.</p>\n<p><em>*</em></p>\n<p>The sun was below the pine ridges when he backed the trailer into the driveway at the lime-shed.</p>\n<p>The double doors were closed.</p>\n<p>Through the two iron hasps, Vance had run a three-foot length of half-inch transport chain, secured with a heavy yellow brass padlock. A white eviction notice from the county sheriff was stapled to the weathered pine casing, the paper fluttering softly in the creek draft.</p>\n<p>Micah stood in the driveway.</p>\n<p>His breath showed in the cold air, white and thin. The trailer hitch creaked as the truck settled.</p>\n<p>Across the gravel, Ray\u2019s blue tarp was empty. The Ford was gone. The three-legged sawhorses stood in the dirt, their top edges notched and grooved from dozens of hurried saw cuts.</p>\n<p>On the flat top of the nearest sawhorse, left behind beside a pile of green-painted plywood offcuts and an empty paper coffee cup, lay the flat red carpenter's pencil. Its lead was worn down to a blunt, leaden bevel, gray with wood-dust.</p>\n<p>Micah stood beside the trailer.</p>\n<p>The first heavy drops of the evening rain began to fall through the hemlocks, ticking against the dry paper on the door. They struck the open hull behind him, beading instantly on the eight coats of amber varnish\u2014hundreds of small, clear drops, resting on the cedar without sinking in, until the weight of the water broke their surface tension and they ran together, sliding off the polished curve of the sheer and dropping one by one into the mud.</p>"}, {"id": "UM6", "title": "The Cabinet", "html": "<p>Ruth came by the workshop on a Tuesday in March, the kind of gray afternoon that made the shop lights look like the only warm place in the county. She stood in the doorway watching Micah sand the inside of a drawer, and she didn't speak for a long time, which was how Ruth said hello.</p>\n<p>She'd been his teacher at the craft school in Penland, then his landlord for two years, then something closer to a friend \u2014 though Ruth didn't use that word for anyone who still owed her money. She was seventy-one and still built a chair or two a year, chairs that looked like they'd grown that way, like the wood had decided to become a chair and Ruth had simply helped. She had hands like knotted rope.</p>\n<p>Micah set down the sandpaper. \"You want coffee?\"</p>\n<p>\"I want to see what you've been doing in here for six months.\"</p>\n<p>He led her past the lathe and the bench to the back corner where the cabinet stood under a drop cloth. He pulled the cloth off with the care of someone revealing a child, and Ruth looked at it for a full minute without moving. It was a credenza in black walnut, the doors inlaid with a marquetry landscape \u2014 a river valley, the grain of the wood following the actual contours of the hills, each piece of veneer cut and fitted so the seams disappeared unless you pressed your face to the surface. The joinery was hand-cut dovetails, so tight they looked poured into place. The finish was seventeen coats of hand-rubbed shellac. It was, by any honest measure, the best thing Micah had ever made, and probably the best thing anyone in the county had made in a decade.</p>\n<p>Ruth touched one of the doors with a single fingertip. Then she pulled her hand back.</p>\n<p>\"Who's it for?\" she said.</p>\n<p>\"Nobody yet. I'm going to show it at the spring show.\"</p>\n<p>\"Micah.\"</p>\n<p>\"What?\"</p>\n<p>She sat down on a sawbuck \u2014 something she'd taught him never to do, because sawbucks were for wood, not for sitting \u2014 and she looked at him with the expression he remembered from the semester he'd spent six weeks carving a spoon when the assignment was a stool.</p>\n<p>\"Find out whether anyone wants the thing before you pour yourself into building it,\" Ruth said. \"That's not a critique of your work. Your work is extraordinary. It's a critique of your method. You've spent half a year on a piece that has no buyer, no commission, no request. You're building a cathedral and you haven't checked if anyone goes to church.\"</p>\n<p>\"I don't build to order,\" Micah said. \"The work speaks for itself.\"</p>\n<p>\"The work always speaks for itself,\" Ruth said. \"The question is whether anyone's listening.\"</p>\n<p>She left without coffee. Micah put the drop cloth back on the cabinet and went back to sanding the drawer.</p>\n<p>---</p>\n<p>His sister Nell worked out of a converted garage two miles down the road. They'd gone to the same craft school, a year apart, and had come back to the same county and set up separate shops, which people found either charming or strange depending on how well they knew the family. Nell made small things: benches from reclaimed oak, side tables from slabs of ash with the bark still on, shelves from construction-site scrap. She finished them quick and rough \u2014 tung oil, a single pass with the sander, visible tool marks left in \u2014 and she posted photos of each one on her phone the day she finished, sometimes the same day she started.</p>\n<p>Micah had watched this with something he was not proud to call contempt. The work was fine. It was honestly fine. Nell had good hands and a decent eye. But the benches wobbled if you didn't shim the legs. The tables had splits she'd filled with colored epoxy, which Micah considered a confession of failure dressed up as a design choice. And she showed everything early \u2014 before the finish cured, before the wood had settled, before she could possibly know if the piece would still be square in a month. She showed the world her rough drafts.</p>\n<p>And the world kept buying them.</p>\n<p>She sold the benches at the farmers' market for a hundred and twenty dollars. People put them on their porches. She posted a photo of a side table on a Tuesday and by Friday it was in someone's living room in Asheville. A restaurant in Boone commissioned six benches for their waiting area after one of the owners saw a photo Nell had posted of a bench she'd made from a barn beam. The benches weren't perfect. One of them had a leg that was a quarter inch short, which Nell had fixed by gluing a felt pad to the bottom and calling it a day. The restaurant owner didn't notice or didn't care.</p>\n<p>Micah visited Nell's shop in October. She was working on a stool \u2014 the third version of a design she'd started in August. The first version had been too tall, so she'd cut it down and sold it to a woman who wanted a plant stand. The second had a seat that was too narrow, so she'd widened the design and the original went to her neighbor as a gift. The third one was just right. She knew this because the woman who'd bought the first one as a plant stand had asked if Nell could make her a matching one for sitting.</p>\n<p>\"You're just making the same thing over and over,\" Micah said, not unkindly. He was trying not to be unkind.</p>\n<p>\"I'm making the thing people keep asking for,\" Nell said. She was sanding the seat with a block, standing in a circle of pine shavings. \"That's different.\"</p>\n<p>\"Where's the craft in it?\"</p>\n<p>Nell looked up. There was sawdust in her hair. She was thirty, two years younger than Micah, and she looked genuinely puzzled. \"The craft is in making it better each time. The first one was okay. This one's good. The next one might be great.\"</p>\n<p>\"The first one should be great.\"</p>\n<p>\"Why?\"</p>\n<p>This stopped him. He didn't have an answer that didn't sound like a manifesto, so he said nothing, and Nell went back to sanding.</p>\n<p>---</p>\n<p>He finished the cabinet in February, eleven months after he'd started. The last coat of shellac had cured for two weeks. He rubbed it down with 0000 steel wool and wax, and the surface was so deep it looked like you could put your hand through it. He loaded it into the bed of his truck with moving blankets and drove it to the spring craft show in Asheville, where he'd been given a corner booth because he'd shown there three years running and the organizers knew his work.</p>\n<p>He set the cabinet against the back wall of the booth and stood back. People walked by. They slowed. Several stopped and touched the surface. A woman leaned in close to study the marquetry and said, \"Oh my God,\" to whoever was with her on the other end of the phone she was holding. A man in a sport coat examined the dovetails for five minutes and asked Micah what kind of saw he'd used for the pins.</p>\n<p>Nobody bought it.</p>\n<p>The price was nine thousand dollars, which Micah knew was less than the work was worth and more than most people at a craft show were prepared to spend. But the issue wasn't just the price. The issue was that the cabinet was large \u2014 six feet long, three feet deep \u2014 and nobody had come to the show looking for a six-foot walnut credenza with marquetry doors. They'd come looking for cutting boards, jewelry boxes, maybe a chair. Several people asked if he made anything smaller. One woman asked if he did commission work, and he said yes, but she described a dining table and he could see that what she wanted was not what he made. What she wanted was a table, not a statement. He felt himself wanting to explain the difference and then felt ashamed of the impulse.</p>\n<p>On the second day of the show, Nell appeared. She was supposed to be at her own booth \u2014 she'd gotten a spot for the first time this year, selling benches and side tables and a set of shelves \u2014 but she'd sold everything by noon on Saturday and come to check on Micah.</p>\n<p>She stood in front of the cabinet for a long time. She didn't touch it. Finally she said, \"It's the most beautiful thing I've ever seen.\"</p>\n<p>\"Thanks.\"</p>\n<p>\"Has anyone \u2014\"</p>\n<p>\"No.\"</p>\n<p>She was quiet. She didn't say I told you so because she'd never told him anything. She'd just made her rough benches and asked people what they thought and made better benches. She looked at him and her face was so open and sorry that he had to look away.</p>\n<p>\"I have to go back to my booth,\" she said. \"I have nothing to sell but I'm supposed to be there.\"</p>\n<p>\"Nell.\"</p>\n<p>She stopped.</p>\n<p>\"It's not about the work,\" he said. \"I know that now. The work is good.\"</p>\n<p>\"I know it is,\" she said.</p>\n<p>\"It's that nobody asked for it.\"</p>\n<p>She nodded. She didn't say anything else. She left and he stood alone in the booth with the cabinet, which was the most beautiful thing anyone in that building had made, and which was going home in the back of his truck.</p>\n<p>---</p>\n<p>He lost the workshop in May. Not because of the cabinet specifically, but because of the cabinet as a method \u2014 eleven months of overhead, wood, finish, and time that produced one unsold object. The lease on the shop was eight hundred a month. He'd been paying it with commissions that had dried up because he'd stopped taking commissions to focus on the cabinet. His savings had gone to walnut and shellac. The landlord, who was not Ruth but a man named Dale who owned the building, gave him until the end of the month.</p>\n<p>He moved the cabinet and his tools into Nell's garage. She cleared space without being asked, pushing her bench blanks and her sander and her jar of tung oil to one side. They worked in silence for an afternoon, and when the tools were arranged and the cabinet was covered again, Micah sat on an upturned bucket and put his face in his hands.</p>\n<p>Nell sat beside him. She didn't touch him. She'd always been someone who gave you the exact amount of space you needed, which Micah had once interpreted as distance and now understood as attention.</p>\n<p>\"Ruth told me something once,\" he said. \"I didn't listen.\"</p>\n<p>\"I know. She told me too.\"</p>\n<p>He looked at her. \"When?\"</p>\n<p>\"Two years ago. When I started posting photos of the benches and you told me I was cheapening the craft. She called me and said, 'Don't let your brother's perfectionism become your standard. Find out if anyone wants the thing first. Then make it better.'\"</p>\n<p>Micah almost laughed. It came out wrong, more like a sound of pain. \"So you were \u2014 what \u2014 doing what she said.\"</p>\n<p>\"I was doing what made sense. People told me what they wanted. I made it. I made it better. That's all.\"</p>\n<p>\"That's all,\" he repeated.</p>\n<p>\"She was right, Micah. She was right about you and she was right about me. The difference is I listened because I didn't think I had anything to lose.\"</p>\n<p>He thought about that. The cabinet sat under its cloth, ten months of his life, the best work he would do for years, maybe ever, and no one had asked for it and no one would. It was a masterpiece without a home. He could feel its weight in the room like a stone.</p>\n<p>\"What do I do now?\" he said.</p>\n<p>Nell stood up. She pulled a piece of paper off the workbench \u2014 a sketch, rough, a dining table with simple legs and a breadboard end. \"The woman from the show. The one who wanted a dining table. She called me. I told her you made tables. She wants to talk.\"</p>\n<p>He stared at the sketch. It was basic. It was unambitious. It was the kind of thing he would have turned down a year ago.</p>\n<p>\"She wants a table,\" he said.</p>\n<p>\"She wants a table,\" Nell said. \"She doesn't know she wants a masterpiece. She might want one if you make it. But she's asking for a table first.\"</p>\n<p>He picked up the sketch. The lines were wobbly. Nell had drawn it in two minutes, probably while talking on the phone. It was the rough draft of a rough draft.</p>\n<p>\"Find out whether anyone wants the thing,\" he said.</p>\n<p>\"Before you pour yourself into building it,\" Nell finished. \"Then pour yourself in. All the way. But pour it into something someone's holding out their hands for.\"</p>\n<p>He folded the sketch and put it in his pocket. The cabinet stood in the corner under its cloth, perfect and silent, the thing nobody had asked for. He left it there. He picked up a pencil and a piece of clean paper, and he started drawing the table, beginning not with what he wanted to make but with what someone wanted to have.</p>"}, {"id": "AE6", "title": "The Thousand-Hour Chair", "html": "<p>Micah Ostrander had been sanding the same curve for eleven days.</p>\n<p>It was the transition where the crest rail met the rear leg \u2014 one continuous run of white oak, no joint, the grain bending through the corner the way water bends around a stone. He'd steam-bent it. He'd broken nine before the tenth held. Now he worked it with a cabinet scraper he'd sharpened that morning, taking off shavings so thin they curled up and hung in the light like something exhaled.</p>\n<p>The shop smelled of oak dust and hide glue. Through the window over the bench, February in Ohio: gray field, gray fence, a hawk on a post that had been there since Christmas.</p>\n<p>His phone lit up on the windowsill. <em>Nessa</em>. He let it go.</p>\n<p>He was forty-one. He had eleven thousand dollars left, which was what remained of the money from selling his father's tractor, and he had until roughly May before that stopped being an amount of money and started being a countdown. He'd told himself in April of last year: one chair. Not a line, not a collection. One chair so good that when people saw it they would understand, immediately and without argument, what he could do.</p>\n<p>He turned the chair on the bench and started on the other side.</p>\n<p>---</p>\n<p>Nessa's garage was heated by a kerosene salamander that made everything smell faintly like an airport. She had a band saw with a wandering blade, a chop saw missing its guard, and a folding table covered in what she called inventory.</p>\n<p>\"Sit,\" she said. \"Not on that one, it's still wet.\"</p>\n<p>Micah sat on a milk crate. He'd driven over because she'd texted six times.</p>\n<p>\"Okay.\" She held up a small wooden object. \"Spoon.\"</p>\n<p>It was a spoon. The bowl was a little lopsided. There was a tool mark on the underside she hadn't chased out.</p>\n<p>\"It's cherry,\" he said.</p>\n<p>\"It's whatever was in the scrap bin.\" She turned it over in her hands, pleased with it in a way he found almost physically difficult to watch. \"I made forty. I put them on the table at the winter market next to Deb's honey. Eighteen dollars. They went in ninety minutes.\"</p>\n<p>\"Eighteen dollars.\"</p>\n<p>\"I know. I should have said twenty-two.\" She set it down and picked up another. \"This one's maple. A woman bought the cherry one and came back and asked if I made left-handed ones, because she's left-handed and the bowl was canted wrong for her. So.\" She showed him: the same spoon, mirrored. \"Now I make left-handed ones. Twelve of them last month.\"</p>\n<p>Micah picked up the maple spoon. The handle was too thick where it met the bowl. It would fatigue the hand over a long stir. He put it down without saying so.</p>\n<p>\"How's the chair,\" Nessa said.</p>\n<p>\"Close.\"</p>\n<p>\"You said close in October.\"</p>\n<p>\"It was close in October.\" He stood up. \"It's closer now.\"</p>\n<p>She walked him out. At the door she said, \"There's a table at the spring market if you want one. Fifty bucks, first weekend in April.\"</p>\n<p>\"I'm not making spoons, Ness.\"</p>\n<p>\"I didn't say make spoons.\"</p>\n<p>He drove home through the salt haze with the heater roaring and did not think about the table.</p>\n<p>---</p>\n<p>He finished the chair on the ninth of April.</p>\n<p>The last thing was the seat \u2014 a saddle he'd hollowed with an adze and then a travisher, working from a plaster cast he'd made of his own body sitting in wet sand at Alum Creek in September. The dish of it fit a person the way a good hand fits another hand. Eight coats of oil, wet-sanded between four and five. When he was done he stood in the shop with the lights off except the one over the bench, and the chair sat there in the cone of light, and Micah Ostrander cried a little, quietly, standing up, the way you do when a thing you doubted for a year turns out to be true.</p>\n<p>It was the best object he had ever made. He knew it the way you know your own name.</p>\n<p>He
