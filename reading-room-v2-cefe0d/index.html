 photographed it against a canvas drop. He wrote to the gallery in Columbus that had shown his father's work once, in 1994, and to the design fair in Chicago, and to a woman in Brooklyn whose shop sold four-thousand-dollar stools to people who owned two apartments. He priced it at eleven thousand dollars, which was one year, which was what it was.</p>\n<p>The gallery didn't answer for six weeks and then did: <em>lovely work, we're programmed through 2027.</em></p>\n<p>Chicago wanted a booth fee of $6,200 plus travel, plus a second piece minimum.</p>\n<p>Brooklyn answered in four days. <em>Stunning craftsmanship. Honestly though \u2014 our buyers are looking for pieces around $900\u2013$1,500 that photograph well in small apartments. Do you make anything smaller?</em></p>\n<p>He read it standing at the window over the bench. The hawk was gone. The field had gone green without his noticing.</p>\n<p>He wrote back: <em>I don't. Thank you.</em></p>\n<p>---</p>\n<p>He sold it in August, in the parking lot of a Cracker Barrel outside Dayton, to a man named Ron who had found the listing on Facebook Marketplace after it had been up for eleven weeks and Micah had dropped the price four times.</p>\n<p>Ron was decent about it. He was maybe sixty, in a Bengals windbreaker, and he walked around the chair twice with his hands in his pockets and said, \"That's real nice. My wife saw the picture.\"</p>\n<p>\"It's white oak. That corner's one piece \u2014 it's bent, not joined.\"</p>\n<p>\"Huh.\" Ron crouched, looked, stood back up. \"For the back porch, mostly. She wanted something for by the door where you take your boots off.\"</p>\n<p>Fourteen hundred dollars. Cash, in a bank envelope, counted out on the tailgate in the heat with the smell of pancake syrup coming off the building. Micah helped him lift it into the bed of the truck and watched Ron throw a moving blanket over it and cinch a ratchet strap across the crest rail \u2014 across the curve, the one that broke nine times \u2014 and pull it tight.</p>\n<p>He didn't say anything about the strap. He said, \"Keep it out of standing water and it'll outlive us both.\"</p>\n<p>\"Will do, chief.\"</p>\n<p>He sat in his truck in the parking lot for a while after Ron pulled out. Then he drove to the storage place on 42 and paid two months for a ten-by-ten unit and went home and started moving the shop into it, because the house was going to the bank in October and there was no version of the arithmetic where it didn't.</p>\n<p>---</p>\n<p>Nessa came on a Saturday with her brother's trailer.</p>\n<p>They loaded the bench first, then the lathe, then the tool chest his grandfather had built and his father had ruined the till of. It was ninety-one degrees. They drank warm Gatorade sitting on the trailer gate with their legs hanging down.</p>\n<p>\"Do you want to know what I sold this year,\" she said.</p>\n<p>\"Not really.\"</p>\n<p>\"Nineteen thousand and change. Spoons, cutting boards, and those little stools.\" She wiped her face with the hem of her shirt. \"The stools came from a guy at the market in June who asked if I made anything for a kid to stand on at the sink. I'd never thought about it. I made him one out of pine in an afternoon. It's ugly. He came back with two friends.\"</p>\n<p>Micah looked at the field.</p>\n<p>\"I made a coffee table in 2019,\" Nessa said. \"Walnut. Book-matched top, breadboard ends, seven months. It's in my mom's basement. Nobody's ever going to buy it.\" She drank. \"I stopped guessing what people want. I just make a rough one and put it in front of somebody and let them tell me. Turns out you can find that out for about six dollars and a weekend, and I was spending years to learn the same thing.\"</p>\n<p>She said it and then she stopped, and knocked the ice down in her cup, and that was all.</p>\n<p>The cicadas went up in the hedgerow and wound back down.</p>\n<p>\"The strap,\" Micah said. \"He put a ratchet strap right across the bend.\"</p>\n<p>\"Yeah.\"</p>\n<p>\"It'll be fine. It's oak.\"</p>\n<p>\"It'll be fine.\"</p>\n<p>They loaded the rest of it as the light went orange, and when the trailer was full Micah went back into the empty shop for the last of it and came out with the drop-leaf of scrap \u2014 offcuts, mostly, white oak in short lengths, the failed bends, curved and useless for anything flat.</p>\n<p>He stood there holding an armful of it in the doorway.</p>\n<p>\"Ness.\"</p>\n<p>\"Yeah.\"</p>\n<p>\"That table in April. Is there one in October too?\"</p>\n<p>She was tying down the lathe. She didn't look up. \"First Saturday. Thirty-five bucks in the fall.\"</p>\n<p>Micah set the scrap down on the gravel and squatted over it and started sorting \u2014 this curve, that curve \u2014 pulling out six pieces where the grain ran the long way through the bend. They'd make backrests. Small ones. Rough ones, three or four hours apiece, the tool marks left where they fell.</p>\n<p>\"Put my name down,\" he said. \"I'll bring six. I want to see which ones they pick up.\"</p>"}]}, {"premise": "The Evenings", "stories": [{"id": "KO9", "title": "The Weather Inside", "html": "<p>The Tuesday meltdown began with a spoon.</p>\n<p>Theo had eaten three bites of the pasta when the spoon hit the floor. Ada picked it up, wiped it, set it back beside his bowl. He pushed it away with the back of his hand. She offered a different spoon \u2014 the blue one, his favorite from last week. He shoved the bowl itself, pasta slopping over the rim onto the placemat, and the sound he made was not a word. It was the sound of a building coming down.</p>\n<p>Ren came in from the kitchen with a dish towel. \"Hey, bud. Let's just \u2014\"</p>\n<p>\"I don't WANT it!\" Theo's face was the color of a bruise. He kicked the table leg hard enough to rattle the water glasses.</p>\n<p>Ada reached for him and he hit her hand. She pulled back, steadied her face, tried the calm voice she'd been practicing since the parenting book. \"I see you're frustrated. When you're ready to use your words \u2014\"</p>\n<p>The screaming that followed was operatic. Theo slid off the chair, lay on the hardwood, and thrashed. His socks made sliding streaks on the floor. The dog retreated under the dining room credenza.</p>\n<p>Ren sat down across from him and waited. Ada sat down. They waited together. The pasta cooled. The clock over the stove ticked through four minutes of sustained wailing before Theo's body began to tire of it and the sound thinned into hitching sobs.</p>\n<p>This was, by their count, the fourth evening that week.</p>\n<p>They had taken things. They had used the sticker chart, the time-out chair, the gentle-scripted language. They had held the line and held it and held it. Theo was not improving. He was, if anything, getting worse \u2014 the meltdowns longer, the triggers smaller, the recovery slower.</p>\n<p>That night, after they'd carried his limp, tear-smeared body to bed, Ada sat on the kitchen floor with her back against the cabinet and said, \"We have to stop.\"</p>\n<p>\"Stop what?\"</p>\n<p>\"All of it. The fixing. The \u2014\" She gestured at the fridge, where the sticker chart hung, half its squares empty, its columns a record of failure. \"We keep trying to change him. What if we can't?\"</p>\n<p>Ren slid down beside her. \"So what, we just let him \u2014\"</p>\n<p>\"What if we changed the things around him instead? Not him. The things.\"</p>\n<p>---</p>\n<p>They started with the table.</p>\n<p>Wednesday, Ada set out plates but no food. She put a low bench where Theo's chair had been \u2014 a bench with no back, close to the floor, where his feet could rest flat. She put small portions on a tray on the counter: pasta in one ramekin, green beans in another, a few strawberries. No big plate. No arrangement. No expectation.</p>\n<p>Theo came in, looked at the bench, looked at the counter. He sat on the bench. He ate two strawberries and a piece of pasta. He left the rest. Nobody said anything. Ren and Ada ate at the table, and Theo sat beside them at his low perch, and the dog came out from under the credenza and lay against the wall.</p>\n<p>It wasn't peace, exactly. But it was quieter than any dinner in a month.</p>\n<p>Thursday, Ren changed the bath. He'd been running it full and hot, the way his mother had \u2014 a deep tub, bubbles, toys. Theo fought it every night, fought the water, fought the soap, fought the towel. Ren ran it shallow, warm, and still. No bubbles. One toy \u2014 the seal, not the whole bin. He didn't announce bathtime. He just went in and started the water, and when Theo wandered in, the tub was already there, quiet, and Ren was sitting on the bathmat reading his phone.</p>\n<p>Theo got in on his own. He sat in the shallow water and held the seal. Ren washed his back with one hand while pretending to scroll. It took four minutes.</p>\n<p>Ada watched from the hallway. She didn't say anything. She pressed her hand to her mouth and watched.</p>\n<p>---</p>\n<p>Frank arrived Saturday for his monthly visit \u2014 a large man, loud in a way that filled rooms, with opinions that arrived before his luggage. He had raised four children in a three-bedroom house in Queens and all four of them had turned out fine, which he mentioned with the regularity of a man checking a watch.</p>\n<p>He watched the Saturday dinner \u2014 the bench, the tray, the small portions \u2014 and said nothing until Theo left the table. Then: \"He barely ate.\"</p>\n<p>\"He ate,\" Ada said.</p>\n<p>\"He ate a strawberry.\"</p>\n<p>\"He'll eat more when he's hungry.\"</p>\n<p>Frank looked at the tray, the ramekins, the bench. \"What is all this?\"</p>\n<p>\"We're trying something.\"</p>\n<p>\"You're catering to him.\" Frank said it the way he said most things \u2014 as a verdict already rendered. \"The world isn't going to arrange itself in ramekins for this kid. He's six. He sits at a table, he eats what's in front of him, he says thank you. That's the deal.\"</p>\n<p>\"Dad.\"</p>\n<p>\"I'm telling you what I know. You give a child an inch of accommodation, he takes a mile of it. You think he won't notice that you've turned dinner into a buffet? He notices. They all notice.\"</p>\n<p>Ada set down the sponge she'd been using to wipe the counter. \"We're not arguing about this tonight.\"</p>\n<p>\"Good,\" Frank said. \"Because I'm right.\"</p>\n<p>---</p>\n<p>Sunday, Frank offered to handle the evening.</p>\n<p>\"Let me do dinner,\" he said, already pulling pans from the cabinet. \"The way it's done. A meal at a table, with a chair, and he eats what we eat. He's not going to starve.\"</p>\n<p>Ada and Ren looked at each other. Something passed between them \u2014 not agreement exactly, but the exhaustion of two people who knew this argument would keep coming until it was settled.</p>\n<p>\"Fine,\" Ada said. \"Do it your way.\"</p>\n<p>Frank made chicken. He made rice. He put out a green salad. He set Theo's place at the table with a full plate and a glass of milk and a napkin folded into a square. He pulled out the chair.</p>\n<p>\"Come on, Theo. Dinner.\"</p>\n<p>Theo came in and saw the table. His face did something Ren recognized \u2014 a tightening around the eyes, the first tremor of a system overloading.</p>\n<p>\"Sit down,\" Frank said. He pointed to the chair. \"We eat together. That's how it works.\"</p>\n<p>Theo sat. He looked at the plate. He looked at the full glass of milk, which he had never been given at dinner because he always knocked it over. He looked at the napkin, which he didn't know what to do with.</p>\n<p>\"Eat your chicken,\" Frank said.</p>\n<p>\"I don't want chicken.\"</p>\n<p>\"Chicken's what's for dinner. There's nothing else.\"</p>\n<p>Theo's hands found the table edge. His knuckles went white. Ren could see it starting \u2014 the pressure building in the boy's chest like steam in a pipe.</p>\n<p>\"Take a bite,\" Frank said. \"One bite. Then you can have a strawberry.\"</p>\n<p>\"I don't \u2014\"</p>\n<p>\"One bite, Theo.\"</p>\n<p>The glass went first. Theo's elbow caught it \u2014 accidentally, then deliberately \u2014 and milk spread across the table in a white sheet that reached the napkins, the salad, the rice. Frank pushed his chair back. \"Hey \u2014\"</p>\n<p>Theo was already gone. He was on the floor, under the table, and the sound came out of him like something ripped \u2014 not crying, not screaming, but a raw, airless keening that went on and on. His body jackknifed against the hardwood. His head hit the table leg.</p>\n<p>Frank reached for him. \"Theo. Theo, stop it. That's enough.\"</p>\n<p>The touch made it worse. Theo shrieked and clawed at Frank's hand, and Frank pulled back with a scratch welling on his wrist, and for a moment the large man stood in his daughter's kitchen with milk pooling at his feet and a six-year-old writhing under the table and nothing in his forty years of child-rearing that could reach this.</p>\n<p>Ada knelt by the table. She didn't reach for Theo. She reached for the tablecloth and pulled it slowly off the table, taking the plates and the soaked napkins with it, clearing the surface. She reached over and turned off the overhead light so only the stove light remained. She opened the window above the sink. The evening air came in \u2014 cool, smelling of cut grass \u2014 and the kitchen went quiet and dim.</p>\n<p>She sat on the floor near Theo, not touching him. Just near him. Ren turned off the stove fan. The hum died. The room got still.</p>\n<p>Under the table, Theo's breathing changed. Not right away. But the keening thinned, and the thrashing slowed, and after a while he was just lying there, breathing, his face on the cool wood.</p>\n<p>Nobody spoke. Frank stood against the counter, arms folded, watching. His jaw was set, but his eyes were doing something his mouth wouldn't \u2014 they were seeing.</p>\n<p>---</p>\n<p>The next evening, Ada set the bench out again and put three ramekins on the counter. She turned off the overhead light and put a lamp on the sideboard. Ren opened the window before they sat down. The stove fan stayed off.</p>\n<p>Theo came in, sat on the bench, ate some rice and a strawberry. He said, \"Can I have the seal?\"</p>\n<p>\"Bathtime's after,\" Ren said.</p>\n<p>\"Okay,\" Theo said.</p>\n<p>Frank was on the couch in the living room, within earshot. He said nothing.</p>\n<p>The following night, Ada reduced the choices further \u2014 no more \"what do you want to drink?\" Just water, already poured, in a small cup that fit his hand. No questions about the bath. Ren simply filled it, shallow and warm, and left the door open, and Theo drifted in when he drifted in. They read one book, not three. They turned off the hallway light so the path to his room was lit only by the nightlight, a low orange glow on the baseboard.</p>\n<p>He went to bed without a meltdown. Not without fuss \u2014 he called out twice, asked for water, asked for the dog \u2014 but without the shattering. Without the sound that had become, over months, the weather of their evenings.</p>\n<p>By Thursday, there were two evenings in a row with no meltdown at all. Theo ate a full ramekin of chicken at the bench. He got in the bath and stayed in for ten minutes, floating the seal on the still water. He went to bed and called out once, then slept.</p>\n<p>Frank watched. He watched from the couch, from the doorway, from the kitchen. He watched his daughter dim the lights and his son-in-law open the window and his grandson settle, slowly, like something had been taken off him that he couldn't name.</p>\n<p>On Friday morning, Frank was leaving. He stood in the front hall with his bag, and Ada walked him out.</p>\n<p>\"Ad,\" he said. He had his hand on the door. He looked at her and then looked at the door and then at her again. \"It's not how I would have done it.\"</p>\n<p>\"I know.\"</p>\n<p>\"He's going to have to learn to sit at a table eventually.\"</p>\n<p>\"Maybe,\" Ada said. \"Or maybe he'll learn at his own table, the way he needs to.\"</p>\n<p>Frank opened his mouth, then closed it. He picked up his bag and walked to the car. At the driver's window, he turned back. \"The bench was a good idea,\" he said. Then he got in and pulled away before she could answer.</p>\n<p>---</p>\n<p>That night, Theo came to the kitchen. The bench was by the table, the ramekins were on the counter, the lamp was on the sideboard, the window was open. The evening air came through the screen, carrying the smell of the neighbor's jasmine. The dog was on his rug. Ren was slicing an apple. Ada was at the stove, not cooking much \u2014 just warming something, the burner on low.</p>\n<p>Theo sat on his bench. He picked up a piece of apple from the cutting board and ate it. He held the seal under his arm. The kitchen was dim and warm and quiet, and the window let in the dark, and the boy sat where he could sit and ate what he could eat, and nobody asked him to be anything else.</p>"}, {"id": "UC2", "title": "Weather He Could Live In", "html": "<p>The fork hit the floor for the third time. Theo's face was already going \u2014 that particular dissolution that started at the mouth and climbed, the chin crumpling, the eyes flooding, the breath catching in his chest like something had snagged on a nail inside him.</p>\n<p>\"It's the wrong fork,\" he said.</p>\n<p>It was not the wrong fork. It was the same fork he'd used every night this week, a small metal fork with blue plastic handles, but Ada could see that in this moment it was the wrong fork, that it had become cosmically, irrevocably wrong, and that no amount of pointing at the calendar on the refrigerator where Theo had earned three stickers for \"using my utensils without complaining\" was going to change that.</p>\n<p>\"Sweetheart,\" Ren said, in the voice he used for these moments, low and steady, the therapist's voice, the voice that said <em>I am not escalated and therefore you should not be escalated either.</em> \"We talked about this. If you throw your fork, dinner is over.\"</p>\n<p>Theo threw his fork.</p>\n<p>It was the fourth meltdown that week. It was Tuesday.</p>\n<p>---</p>\n<p>Frank came on Saturdays. He drove up from Delaware with a bag of apples from the farm stand and the newspaper he'd already read, which he liked to do the crossword from with Theo \u2014 the easy one, the one Theo couldn't actually do, but liked to watch Frank's pencil move, liked to call out letters that were almost always wrong and sometimes, thrillingly, right.</p>\n<p>Frank had raised four children. Two of them were Ada. He had firm ideas about children, which he delivered without heat, the way he delivered everything \u2014 as fact, the way you'd say the turn signal is broken or the tomatoes need staking.</p>\n<p>\"He's six,\" Frank said, standing in the kitchen while Ada loaded the dishwasher and Ren sat on the back porch with his head in his hands. \"Six-year-olds don't like dinner. Six-year-olds don't like baths. You make them do it anyway and they learn that's how the world is. The world doesn't rearrange itself because you're upset.\"</p>\n<p>\"He's not just upset, Dad. He's \u2014\"</p>\n<p>\"He's bright and he's stubborn and he's figured out that the louder he gets, the more you rearrange.\" Frank set the bag of apples on the counter. \"You're good parents. You're too good. You're so busy being good that you forgot you're the ones in charge.\"</p>\n<p>It was not a cruel thing, the way he said it. It was the thing he believed, and Ada could feel the weight of it \u2014 the weight of a man who had raised four children who ate what was put in front of them and went to bed when told and turned into adults who called him on Sundays. There was a whole lived architecture behind it. She could not dismiss it with the word <em>neurodivergent</em> that the occupational therapist had given them like a key that didn't quite fit the lock.</p>\n<p>\"Maybe,\" she said.</p>\n<p>Frank squeezed her shoulder. \"The apples are Honeycrisp. He'll eat those.\"</p>\n<p>---</p>\n<p>The fight happened on a Thursday, not about Theo exactly, but about everything that had become Theo.</p>\n<p>\"I can't do it anymore,\" Ada said. She was sitting on the edge of their bed and she was not crying, which was worse than crying. \"I can't sit across from him at dinner one more time and watch his face do that thing and know it's coming and not be able to stop it.\"</p>\n<p>\"So we keep the routine. We hold the line.\"</p>\n<p>\"Holding the line is making it worse, Ren.\"</p>\n<p>\"You don't know that.\"</p>\n<p>\"I know he threw up last night. From crying. He threw up, and then he cried because he threw up, and I held him on the bathroom floor and he said <em>I'm bad I'm bad I'm bad</em> and he's six, Ren, he's six years old and he thinks he's bad.\"</p>\n<p>Ren sat next to her on the bed. He put his hands on his knees. He was a man who believed in structure the way Frank believed in firmness, as a moral good, as the thing that kept the world from sliding sideways, and she could see the structure leaving him, the way a building settles \u2014 slowly, then all at once.</p>\n<p>\"What do we do?\" he said.</p>\n<p>\"I don't know. Something else. Anything else.\"</p>\n<p>---</p>\n<p>They started small, not because they were cautious but because they were exhausted.</p>\n<p>They turned off the radio. This was not a decision they made together; it was a Wednesday and Ren reached over and turned it off in the middle of the All Things Considered segment about coastal erosion, and the kitchen went quiet, and Theo looked up from his plate with an expression Ada had never seen \u2014 not peace exactly, but the absence of that vigilance, the scanning-for-threat that lived in his eyebrows every evening.</p>\n<p>He ate four bites of chicken. He did not cry.</p>\n<p>It was not a miracle. Thursday he cried because the chicken was touching the rice. But the quiet \u2014 the actual quiet, the house without voices coming from the corner \u2014 stayed.</p>\n<p>---</p>\n<p>They changed the table. Not the table itself, but what was on it. They took the sticker chart down. They took the schedule down \u2014 the laminated schedule with the velcro pictures: plate, bath, pajamas, teeth, book, bed. They had made it together, Ren with the laminator at the office, Ada with the clip art. It had taken an entire Saturday. It had felt like doing something.</p>\n<p>They put a plain blue tablecloth on the table instead. Nothing on it. No visual instructions, no progress tracked in stars.</p>\n<p>\"What's that for?\" Theo said.</p>\n<p>\"Nothing,\" Ada said. \"I just like blue.\"</p>\n<p>He ran his hand across it. Back and forth. He ate his pasta with his hands and they did not correct him and he did not cry.</p>\n<p>Ren said afterward, in their bedroom, quietly, \"He ate with his hands.\"</p>\n<p>\"I know.\"</p>\n<p>\"That's \u2014\"</p>\n<p>\"I know.\"</p>\n<p>---</p>\n<p>They stopped asking questions.</p>\n<p>This was Ada's, this discovery. She realized, standing in the kitchen doorway one evening watching Theo line up his shoes by the wall \u2014 not the pair he was going to wear, just shoes, lined up, eight of them in a row \u2014 that she asked him questions all night long. <em>Do you want the blue plate or the red plate? Do you want the bath first or the story first? What did you do at school today? Which book? Which pajamas?</em></p>\n<p>Each question was a door he had to walk through. Each question was a demand that he know himself, right now, in the moment, and produce the knowing as language.</p>\n<p>She stopped. She put the blue plate down without asking. She ran the bath without announcing it. She chose the book \u2014 the one about the owl, always the one about the owl \u2014 and set it on his bed.</p>\n<p>He came to the table. He got in the bath. He lay in his bed while she read about the owl, and he did not ask for a different book, and his body was loose on the mattress, his feet against her thigh, warm through the blanket.</p>\n<p>There were nights that didn't work. The night Ren tried to give him chicken again, the night the neighbor's dog barked for forty minutes and Theo came apart so completely that Ada sat in the hallway outside his room and pressed her forehead to the wall and breathed the way the therapist had told her to breathe, in through the nose, out through the mouth, and it did not help. The night Theo hit Ren \u2014 open-handed, hard, across the chest \u2014 and Ren caught his wrist and held it and both of them froze, father and son, in the terrible knowledge of what had just happened.</p>\n<p>Backslides. The occupational therapist had said the word like weather. <em>Expect backslides.</em></p>\n<p>---</p>\n<p>Frank came on a Saturday. The house was different and he noticed.</p>\n<p>\"No chart,\" he said, not as a question.</p>\n<p>\"We took it down,\" Ada said.</p>\n<p>Frank looked at the table. The blue tablecloth. The single plate already set, no choices arrayed. Theo was on the living room floor with his animals, arranging them in a line \u2014 the lion, the tiger, the bear, the horse, the horse, the horse, three horses in a row, then the lion again.</p>\n<p>\"He always did that with the animals?\" Frank said.</p>\n<p>\"Since he was three.\"</p>\n<p>Frank watched. He set the bag of apples on the counter and took off his jacket and he did not say anything for a while, which was not like Frank, who usually had something to say about most things.</p>\n<p>At dinner, Theo ate five bites of the apples, sliced, and two pieces of bread with butter and nothing else. He did not cry. He put his hand on the tablecloth and smoothed it, and Frank watched him do that, and Ada watched Frank watching.</p>\n<p>\"Grandpa,\" Theo said.</p>\n<p>\"Yeah, buddy.\"</p>\n<p>\"Do the crosswart.\"</p>\n<p>\"Crossword,\" Frank said. \"It's crossword.\"</p>\n<p>\"Crosswart.\"</p>\n<p>Frank got the newspaper from his jacket. He sat next to Theo and opened it to the easy puzzle and his pencil moved across the squares. Theo called out letters. <em>G. F. B. Q.</em> Frank wrote down the ones that were right and ignored the ones that weren't, and Theo leaned against his arm, the whole weight of him, and Frank did not move his arm, held it steady as a shelf, and Theo rested there.</p>\n<p>\"You know,\" Frank said to Ada later, at the door, his jacket on, the apples half gone. \"He's not different, you know. He's the same kid.\"</p>\n<p>\"I know, Dad.\"</p>\n<p>\"I mean \u2014 he's still going to have to deal with things. The world isn't a blue tablecloth.\"</p>\n<p>\"I know.\"</p>\n<p>Frank nodded. He looked like he wanted to say more, or like he had said everything already, years ago, with his own children, and was watching someone else arrive at a different place by a different road and could not follow and did not begrudge. He kissed her forehead. He said, \"Call me about Thanksgiving.\"</p>\n<p>---</p>\n<p>Some evenings were still bad. The night Theo dropped his cup of milk and the milk spread across the blue tablecloth and he looked at it and his face began its dissolution and Ada got a towel and put it over the milk and said, \"Done,\" and he looked at the towel, not the milk, and the dissolution paused, held, and then released \u2014 not into calm but into something less than catastrophe, and he ate a piece of bread and went to his room and lay on the floor with his animals and did not come out for an hour and that was all right.</p>\n<p>The night Ren said, \"Bath time,\" and Theo said \"No,\" and Ren said, \"Okay,\" and waited, and twenty minutes later Theo appeared in the bathroom doorway and stood there and Ren turned on the water without speaking and it was all right.</p>\n<p>Not all right like solved. All right like tonight.</p>\n<p>---</p>\n<p>It was a Tuesday. Ren was at the stove. Ada was slicing apples. The house was quiet \u2014 no radio, no television, no schedule on the wall, just the kitchen sounds, the pan and the knife and the clock in the other room that ticked in a way neither of them heard anymore because it had become the sound of the house itself.</p>\n<p>Theo came in from the living room. He was carrying the three horses. He set them on the counter, carefully, in a row, and climbed into his chair. The blue tablecloth was there. The plate was there \u2014 one plate, no alternatives. The apples were there, sliced, and the bread with butter, and a small portion of what Ren was making, set aside, not insisted upon.</p>\n<p>Theo put his hand on the tablecloth. He smoothed it, the way he always did, palm flat, fingers spread, pressing the fabric toward the table's edge. Back and forth. He picked up a piece of apple. He ate it. He picked up another.</p>\n<p>Ren sat down across from him. Ada sat down. No one spoke. The clock ticked. The pan cooled on the stove. Theo ate four pieces of apple and one piece of bread and touched the tablecloth again and looked at the window where the last light was going, the ordinary blue light of an ordinary evening, and outside, a dog barked once and then was quiet.</p>"}, {"id": "UT2", "title": "The House at Half-Light", "html": "<p>At six-fifteen, Theo saw the parsley.</p>\n<p>It was chopped over the potatoes, green and wet-looking under the pendant light. He stopped in the kitchen doorway with one sock half off his heel.</p>\n<p>\u201cWhat\u2019s that?\u201d</p>\n<p>\u201cParsley,\u201d Ren said. \u201cJust parsley.\u201d</p>\n<p>\u201cI don\u2019t want it.\u201d</p>\n<p>\u201cYou don\u2019t have to eat the parsley,\u201d Ada said. She was cutting chicken into small pieces, the way Theo liked, while steam furred the window over the sink.</p>\n<p>\u201cIt\u2019s on the potatoes.\u201d</p>\n<p>\u201cWe can scrape it off.\u201d</p>\n<p>Theo\u2019s hands rose to his ears. \u201cIt\u2019s on them.\u201d</p>\n<p>Ren reached for the serving spoon. \u201cBuddy, look. I\u2019ll get you some from underneath.\u201d</p>\n<p>\u201cNo!\u201d</p>\n<p>The word struck the cabinets. Theo kicked off the dragging sock and threw himself against the doorframe. The dog fled beneath the table. Ada lowered the knife.</p>\n<p>\u201cYou\u2019re all right,\u201d she said. \u201cDinner\u2019s ready. Let\u2019s sit.\u201d</p>\n<p>\u201cI\u2019m not sitting!\u201d</p>\n<p>\u201cYou can sit now or lose your show after bath,\u201d Ren said, and hated, at once, the official sound of his own voice.</p>\n<p>Theo swept his arm across the counter. A glass hit the floor. Ada caught Theo under the arms before he could step into the pieces. He shrieked and bucked against her, his head clipping her chin. Ren moved the chair, the dog, the plate. For twenty-three minutes the kitchen became a place in which every object had to be considered for its capacity to break.</p>\n<p>Later, Theo slept diagonally across his bed, one fist closed around the collar of his pajama shirt. Ada sat on the floor beside him with a bag of frozen peas against her chin.</p>\n<p>Ren stood in the doorway.</p>\n<p>\u201cThe chart lasted three days,\u201d he whispered.</p>\n<p>\u201cHe liked the stickers.\u201d</p>\n<p>\u201cHe liked peeling the stickers off.\u201d</p>\n<p>Ada shifted the peas. \u201cMy father says we stop following through.\u201d</p>\n<p>\u201cYour father thinks childhood is basic training with applesauce.\u201d</p>\n<p>\u201cHe raised four children.\u201d</p>\n<p>\u201cSo did wolves.\u201d</p>\n<p>Ada almost laughed. The sound caught in her throat, and she looked down at Theo.</p>\n<p>On Saturday, Frank arrived with a toolbox and a pound cake. He repaired the loose stair rail before lunch, tightening every screw until the old wood complained. Frank believed most trouble could be traced to looseness.</p>\n<p>Theo followed him from room to room, asking what each tool did. Frank let him hold the level and showed him the green bubble floating between two black lines.</p>\n<p>\u201cSee that?\u201d Frank said. \u201cThere\u2019s correct, and there\u2019s not correct.\u201d</p>\n<p>At dinner, Frank sat at the head of the table by habit. Ada had made meat loaf, carrots glazed with honey, and rice. Theo climbed onto his chair, saw the carrots touching the rice, and climbed down again.</p>\n<p>\u201cI need a different plate.\u201d</p>\n<p>\u201cThat plate is clean,\u201d Frank said.</p>\n<p>\u201cThe carrots touched.\u201d</p>\n<p>\u201cThey\u2019re all going to the same place.\u201d</p>\n<p>\u201cDad,\u201d Ada said.</p>\n<p>Frank held up one square hand. \u201cLet me.\u201d</p>\n<p>Ren looked at Ada. She pressed her lips together.</p>\n<p>Frank turned to Theo. \u201cYou\u2019re six years old. You sit at the table with your family, and you eat what\u2019s served.\u201d</p>\n<p>Theo backed toward the refrigerator.</p>\n<p>\u201cIf you leave this room,\u201d Frank continued, \u201cthere will be no television, no stories, and no dessert.\u201d</p>\n<p>Theo\u2019s eyes darted from Frank to the plate to the humming refrigerator. The pendant light buzzed faintly. Ren had never noticed it before.</p>\n<p>\u201cThe carrots touched,\u201d Theo whispered.</p>\n<p>\u201cYes, they did. Sit down.\u201d</p>\n<p>Theo crawled under the table.</p>\n<p>Frank pulled out his chair. \u201cEnough.\u201d</p>\n<p>\u201cDad, don\u2019t touch him,\u201d Ada said.</p>\n<p>But Frank was already bending, reaching beneath the tablecloth. Theo screamed before Frank\u2019s hand reached his ankle. He shot out the other side, struck his shoulder against a chair, and ran blind into the kitchen. Frank followed.</p>\n<p>\u201cNo running away from me.\u201d</p>\n<p>Theo grabbed the rice bowl and hurled it.</p>\n<p>It missed Frank and shattered against the refrigerator. White grains burst across the floor. Theo made a sound Ren had never heard from him, high and torn, without breath between it and the next. He struck his own temples with both fists.</p>\n<p>Ada caught his wrists. Theo bit her forearm.</p>\n<p>Ren stepped between them and Frank. \u201cGo outside.\u201d</p>\n<p>\u201cI\u2019m not\u2014\u201d</p>\n<p>\u201cGo outside, Frank.\u201d</p>\n<p>Frank stared at him. Rice clung to one trouser cuff.</p>\n<p>\u201cThis is exactly what I\u2019m talking about,\u201d he said, but he went.</p>\n<p>The meltdown lasted nearly an hour. Theo vomited on the bathmat, then sobbed because the bathmat was dirty. When he finally slept, Ada found Frank on the porch, eating pound cake from a paper towel.</p>\n<p>\u201cYou let him run the house,\u201d he said.</p>\n<p>Ada\u2019s sleeve was pulled over the bite mark. \u201cYou frightened him.\u201d</p>\n<p>\u201cI told him to eat dinner.\u201d</p>\n<p>\u201cYou chased him.\u201d</p>\n<p>\u201cI followed him. There\u2019s a difference.\u201d</p>\n<p>\u201cNot if you\u2019re six.\u201d</p>\n<p>Frank brushed crumbs from his shirt. \u201cThe world won\u2019t rearrange itself every time his carrots touch.\u201d</p>\n<p>Ada opened the screen door. \u201cYou don\u2019t get to take charge again.\u201d</p>\n<p>\u201cAda.\u201d</p>\n<p>\u201cYou don\u2019t.\u201d</p>\n<p>For three evenings, they changed nothing. The parsley incident repeated itself as a bath incident, then as a blue-cup incident. On Wednesday, Ren came home early and found Ada standing beneath the pendant light, staring up at it.</p>\n<p>\u201cListen,\u201d she said.</p>\n<p>He listened. The bulb produced a thin electrical whine.</p>\n<p>They turned it off.</p>\n<p>The kitchen became dim except for the lamp above the stove and the last gray light at the window. Theo came in dragging his backpack.</p>\n<p>\u201cWhy\u2019s it dark?\u201d</p>\n<p>\u201cThe big light\u2019s resting,\u201d Ren said.</p>\n<p>Theo considered this. \u201cIt\u2019s loud when it\u2019s on.\u201d</p>\n<p>Ada and Ren looked at each other.</p>\n<p>Before dinner the next night, Ada put crackers and apple slices on the coffee table. Theo ate without being asked. At six, instead of calling him from his blocks, Ren sat on the rug.</p>\n<p>\u201cFive minutes,\u201d he said, placing five wooden tiles in a row. Each minute, Theo put one into a bowl. When the last tile dropped, he carried the bowl to the kitchen.</p>\n<p>On Friday, dinner arrived on three small plates: chicken, rice, cucumber. Nothing touched. Theo ate the rice and one cucumber. Nobody mentioned the chicken.</p>\n<p>On Saturday, Ada wrote four things on a piece of cardboard and drew a crude picture beside each: plate, bath, pajamas, book. Theo laughed at her bathtub.</p>\n<p>\u201cIt looks like a shoe.\u201d</p>\n<p>\u201cThen it\u2019s a shoe bath.\u201d</p>\n<p>He took the marker and added bubbles. After dinner, he moved a clothespin from the plate to the shoe bath.</p>\n<p>When he began to whine because the water was too hot, Ada did not tell him it was the same temperature as always. She ran cold water. She sat on the closed toilet lid and softened her face, letting her eyebrows fall, loosening her mouth.</p>\n<p>Theo watched her.</p>\n<p>\u201cToo many splashes,\u201d he said.</p>\n<p>\u201cWashcloth tonight?\u201d</p>\n<p>He nodded. She drained the tub, and he stood on a towel while she wiped his knees, his armpits, the back of his neck. It took four minutes.</p>\n<p>Frank called during pajamas.</p>\n<p>\u201cYou can\u2019t let a six-year-old opt out of bathing,\u201d he said when Ada told him.</p>\n<p>\u201cHe\u2019s clean.\u201d</p>\n<p>\u201cThat\u2019s not the point.\u201d</p>\n<p>\u201cWhat is the point?\u201d</p>\n<p>Frank was silent long enough for her to hear a television crowd cheering at his house.</p>\n<p>\u201cStandards,\u201d he said.</p>\n<p>The following Tuesday, the supermarket was out of Theo\u2019s round rolls. Ren brought home square ones and braced himself.</p>\n<p>Theo held one in both hands. \u201cThis is wrong.\u201d</p>\n<p>\u201cI know.\u201d</p>\n<p>\u201cWhy did you buy it?\u201d</p>\n<p>\u201cThe round ones were gone.\u201d</p>\n<p>Theo\u2019s breathing quickened. Ren glanced toward the cardboard strip. \u201cCrackers are still here. The square roll can stay on the counter.\u201d</p>\n<p>Theo set it down carefully, as if it were alive. He ate crackers with his soup. Ten minutes later, while Ren loaded the dishwasher, Theo tore a corner from the square roll.</p>\n<p>\u201cIt tastes the same,\u201d he said, offended.</p>\n<p>At school, his teacher sent a note: Theo had raised his hand during music and asked to sit in the hallway because the drums hurt. He returned for the last song wearing headphones borrowed from the office.</p>\n<p>Frank read the note on Sunday.</p>\n<p>\u201cWhen I was his age, we didn\u2019t have special headphones.\u201d</p>\n<p>\u201cWhen you were his age, doctors recommended cigarettes,\u201d Ren said.</p>\n<p>Frank pointed his fork at him. \u201cJokes won\u2019t prepare him for a hard world.\u201d</p>\n<p>Theo entered carrying the divided plate Ada had bought at a yard sale. He set it on the table himself. Frank watched as Theo spooned peas into one section, mashed potatoes into another, and meat loaf into the largest.</p>\n<p>\u201cHe\u2019s serving himself now?\u201d Frank asked.</p>\n<p>\u201cYes,\u201d Ada said.</p>\n<p>Theo took three peas.</p>\n<p>\u201cYou don\u2019t like peas,\u201d Frank said.</p>\n<p>\u201cI like three.\u201d</p>\n<p>He ate the first, swallowed with effort, and drank milk. He ate the second. The third rolled beneath the meat loaf, and his body went still.</p>\n<p>Frank drew breath.</p>\n<p>Ada looked down at her own plate. Ren asked Frank whether the Browns had any hope this year. For several seconds Theo did not move.</p>\n<p>Then he lifted the meat loaf with his fork, retrieved the pea, and returned it to its section.</p>\n<p>\u201cNot under there,\u201d he said.</p>\n<p>\u201cNo,\u201d Ada said. \u201cNot under there.\u201d</p>\n<p>He ate it.</p>\n<p>The worst evenings grew farther apart. There were still nights when the seam of a pajama leg became unbearable, when the dog\u2019s nails on the hallway floor sent Theo under a blanket, when a broken banana seemed to him an injury no one else respected. But now the scissors lived in the bathroom drawer for cutting out tags. A folded blanket waited beneath the kitchen bench. The dog wore soft caps on her nails after five o\u2019clock and walked like a suspicious ballerina.</p>\n<p>Ren and Ada learned to speak less. They stopped offering six solutions while Theo was drowning in the first problem. They said, \u201cI\u2019m here.\u201d They said, \u201cShow me.\u201d Sometimes Theo showed them. Sometimes he could not.</p>\n<p>In November, Frank came for dinner during a thunderstorm. The power failed as Ada took a casserole from the oven.</p>\n<p>The refrigerator stopped humming. The house went black.</p>\n<p>Theo cried out.</p>\n<p>Ren found the camping lantern, but before he switched it on, lightning filled the kitchen white. Thunder cracked immediately overhead. Theo dropped to the floor with his hands over his ears.</p>\n<p>Frank rose.</p>\n<p>Ada said, \u201cWait.\u201d</p>\n<p>Rain battered the windows. In the dark, Theo\u2019s breath came fast and shallow.</p>\n<p>Then Frank took something from his coat pocket. The green level, small enough for a shirt pocket. He crouched and placed it on the floor in front of Theo.</p>\n<p>\u201cCan\u2019t see the bubble,\u201d Theo said.</p>\n<p>Frank turned on the lantern at its lowest setting and set it behind the level. The vial glowed pale green.</p>\n<p>\u201cThere,\u201d Frank said.</p>\n<p>Theo leaned closer. His hands came down from his ears. Frank stayed crouched, knees cracking, while Theo watched the bubble tremble and settle between the lines.</p>\n<p>When the power returned, the pendant light blazed and whined.</p>\n<p>Frank stood and switched it off.</p>\n<p>\u201cTerrible fixture,\u201d he said. \u201cI\u2019ll replace it Tuesday.\u201d</p>\n<p>He did not apologize. Ada did not ask him to.</p>\n<p>On Tuesday he installed three small lights beneath the cabinets, each with its own switch. Theo lay on the kitchen floor and handed him screws.</p>\n<p>At six-fifteen, rain slid down the dark window. One small light shone above the stove. Theo moved the clothespin from plate to bath, then paused.</p>\n<p>\u201cCan I have the shoe bath?\u201d</p>\n<p>Ada handed him the washcloth.</p>\n<p>At the table, three peas sat in their own white compartment. Theo ate one. Frank tightened the last screw beneath the cabinet. Ren cut a square roll in half, and the dog, in her blue nail caps, waited silently for crumbs.</p>"}, {"id": "SW9", "title": "Evening Weather", "html": "<p>The three pendant lamps over the kitchen island had four-thousand-lumen bulbs that Ren had installed when they moved in, wanting what the home-improvement blogs called clean task lighting. When all three were switched on, the white flecks in the quartz counter glittered like salt, and the blue veins in Ada\u2019s forearms stood out sharp as ink lines while she chopped carrots.</p>\n<p>Every evening at five-forty, the microwave timer went off. That was the five-minute warning.</p>\n<p>\"Five minutes to the table, Theo,\" Ada called down the hall. Her voice was level, pitched exactly to the neutral register recommended by the three paperbacks stacked on Ren\u2019s nightstand.</p>\n<p>At five-forty-five, the digital beep chimed again.</p>\n<p>On the refrigerator door, held by four black magnets, was the chart. It was laminated cardstock divided into thirty-five squares with dry-erase borders: <em>Shoes on rug</em>, <em>Hands washed</em>, <em>Sitting at table</em>, <em>Two bites of green</em>, <em>Pajamas before story</em>. A small plastic dish on the counter held sixteen yellow star magnets. When Theo earned four stars in an evening, he placed a green turtle token into a glass jar by the toaster; ten turtles bought a Saturday trip to the garden center to look at the goldfish pond.</p>\n<p>Theo came into the kitchen on his socks, dragging his knuckles along the baseboard. He was six, with narrow shoulders that rose almost to his earlobes whenever he entered a room with more than two people in it.</p>\n<p>\"Pajamas first, or hands washed first?\" Ren asked. He was sitting on the wooden stool, smiling, trying to make his chest look broad and relaxed. \"You pick the order, bud.\"</p>\n<p>Theo stopped at the edge of the linoleum. He didn't look at Ren. He looked at the bottom edge of the refrigerator where the black gasket was split.</p>\n<p>\"Hands,\" Ada said gently, helping. \"Let's do hands. It\u2019s warm water tonight. I got the apple soap.\"</p>\n<p>Theo reached out, took the corner of the magnetic chart, and pulled. The magnets screeched against the brushed steel. The plastic tray tipped, and the yellow stars scattered across the floor like dropped coins.</p>\n<p>\"Theo,\" Ren said. He stood up. His voice stayed low, but the stool legs gave a sharp bark against the oak floor. \"No. That\u2019s a pause. Pick those up, please.\"</p>\n<p>\"I don't want the apple,\" Theo said. His throat made a clicking sound.</p>\n<p>\"You don't have to use the apple soap,\" Ada said, stepping between him and the stove. \"We have the blue one. Or just water. Just warm water.\"</p>\n<p>\"You said apple.\"</p>\n<p>\"I did, but I can change it\u2014\"</p>\n<p>\"You said it.\" His face didn't go red; it went white, the skin around his nostrils pinching tight. He dropped to his knees on the dropped magnets, not gathering them, just pressing his forehead against the cool kickplate of the lower cabinet. When Ren reached down to put a hand on his back\u2014the slow, firm, grounding touch from chapter four\u2014Theo\u2019s spine arched so violently his heels drummed the oak. The scream that came out of him was not words; it was the dry, tearing sound of a dry branch snapping under a boot.</p>\n<p>By six-thirty, the carrots were cold in the skillet, the timer was flashing triple zeros, and Theo was asleep on the floor of the coat closet with his knees pulled into his fleece vest, his breath shuddering every fourth count while Ren and Ada sat at the island under the three white lights, not eating, listening to the hum of the refrigerator coil.</p>\n<p><em>*</em></p>\n<p>Frank came down from Duluth on the second Saturday of November, his red pickup carrying two cords of split birch under a canvas tarp and a metal toolbox that had belonged to his own father.</p>\n<p>Frank was sixty-eight, with broad, blunt thumbs that had lost their hair to decades of cold wind and table saws. He had raised Ada and her three brothers in a three-bedroom tract house where the front door stayed unlocked until nine at night and dinner was whatever was in the pot at five-thirty, take it or go to bed empty.</p>\n<p>At two in the afternoon, the front door stuck in its jamb because the autumn damp had swollen the fir frame. Frank was on the threshold with a block plane, curls of shaved wood piling like butter ribbons at his boots.</p>\n<p>Theo stood two paces away, holding his left boot by the loop. His sock was bunched at the toe, and he was whining\u2014a thin, jagged frequency that had been going on for twenty minutes while Ren tried to coax him onto the hall bench.</p>\n<p>\"Come on, pal,\" Ren had said three times. \"Let\u2019s pull the heel straight, then the foot slides right in. Smell the flower, blow out the candle. Remember the breath?\"</p>\n<p>Theo had thrown the boot against the wainscoting.</p>\n<p>Frank stopped planing. He set the brass tool on the stoop, wiped his palms on the thighs of his canvas trousers, and turned around. He did not crouch. He stood at his full height, his flannel jacket smelling of bar oil and dry wood.</p>\n<p>\"Theo,\" Frank said. The voice was not loud, but it had the density of a railroad tie. \"Bring the boot.\"</p>\n<p>Theo stayed on the floor, his chin tucked into his collar.</p>\n<p>\"Bring it here,\" Frank said again. He didn't repeat the reason. He didn't offer a choice between the left foot or the right foot. He just held out one wide palm and waited, motionless as an anvil.</p>\n<p>Theo looked at Frank\u2019s boots\u2014greased leather, steel-toed, planted four inches apart. Slowly, his breath hitching, the boy crawled across the oak, picked up the boot, and laid it in Frank\u2019s hand.</p>\n<p>Frank took the boy\u2019s ankle in his left hand. The grip was large enough to circle the thin bone entirely. With his right, he smoothed the sock with one hard pull, lined up the tongue, and shoved the heel home with a single, heavy push.</p>\n<p>\"Stamp,\" Frank said.</p>\n<p>Theo looked up at him, his eyelashes wet.</p>\n<p>\"Stamp the heel down,\" Frank repeated.</p>\n<p>Theo stamped. The leather settled with a solid <em>thwack</em>.</p>\n<p>\"Other one,\" Frank said.</p>\n<p>Two minutes later, the boy was out in the yard with a plastic rake, dragging dry maple leaves into ragged piles along the fence line, his boots crunching steadily in the frost.</p>\n<p>That evening, after Theo had refused his pork chop and been sent to his room without dessert\u2014where he had dismantled his Lego crane and thrown forty-eight yellow bricks against the baseboard until Ada went in and sat on the floor with him in the dark\u2014Frank stood on the back porch with Ada, watching the vapor of their breath rise into the cold screen.</p>\n<p>\"You\u2019re negotiating with a rowboat, Ada,\" Frank said. He held a mug of black coffee with both hands, not shivering. \"A child wants to know where the bank is. If the bank keeps moving every time he pushes against it, he\u2019s going to keep pushing until he falls out.\"</p>\n<p>\"He doesn't push because he wants to, Dad,\" Ada said. Her throat ached from the hour in the dark bedroom. \"He pushes because he\u2019s drowning.\"</p>\n<p>\"I had four of you,\" Frank said, without anger. His voice was level, reasonable, backed by forty years of living proof. \"None of you died of a missed dinner. None of you wrecked a room because your sock had a seam in it. The world isn't going to turn the lights down when he gets a job, Ade. The world is full of loud machines, bad bosses, and cold soup. If you don't teach him how to take a hard corner now, who\u2019s going to do it when he\u2019s twenty?\"</p>\n<p>Ada looked at her father\u2019s hands on the mug. They were steady. He had built the porch they were standing on; the joists were plumb to a sixteenth of an inch. When she was seven and broke her collarbone falling out of the mulberry tree, Frank had carried her four blocks to the clinic without running, his heartbeat regular against her ear the whole way.</p>\n<p>\"He isn't you, Dad,\" she said.</p>\n<p>\"He's a boy,\" Frank said gently. \"He's built of the same timber.\"</p>\n<p><em>*</em></p>\n<p>The turn began on a Tuesday in December with a headache.</p>\n<p>Ren had come home from the regional transit office after six hours of budget hearings. His neck was locked tight. In the kitchen, the range hood fan was running on high over a pot of boiling pasta, roaring like a twin-engine plane idling on a runway. Ada was at the sink, rinsing lettuce under a hard jet of tap water, while the radio on the shelf played the evening news through a small, tinny speaker.</p>\n<p>Theo was sitting under the kitchen table, his knees drawn up, humming one single, monotone pitch over and over: <em>mm-mm-mm-mm-mm-mm</em>.</p>\n<p>Ren reached up to rub his temples and hit the switch on the range hood. The roar died.</p>\n<p>The kitchen suddenly felt ten feet wider. Through the silence, the humming under the table didn't stop, but the pitch dropped half an octave.</p>\n<p>Ren looked at the three overhead pendants. Then he walked to the wall and clicked them off. The kitchen fell into gray dusk, lit only by the low amber square of the window and the small, 15-watt bulb inside the stove hood.</p>\n<p>Ada turned off the water. She looked at Ren, her wet hands dripping onto the silicone mat.</p>\n<p>Neither of them spoke.</p>\n<p>Ren didn't say, <em>Theo, come out now.</em> He didn't ask what he wanted on his noodles. He took a heavy white stoneware plate from the cupboard, put three pieces of cold roast chicken on it\u2014plain, dry, unseasoned\u2014and laid four cucumber slices next to them, separated by two inches of white ceramic so they didn't touch. He set the plate on the bottom rung of the kitchen stool, six inches from the floor, pulled a fork from the drawer, and laid it beside the plate.</p>\n<p>Then Ren sat on the floor with his back against the dishwasher, closed his eyes, and let his hands rest loose in his lap.</p>\n<p>Ada stood by the counter. She didn't move the chart. She didn't announce dinner. She picked up a paring knife and began slicing an apple for herself, slowly, the blade making a soft, rhythmic <em>snick</em> against the wooden board.</p>\n<p>For four minutes, the only sound in the house was the refrigerator\u2019s low cycle and the tick of the wall clock.</p>\n<p>Under the table, the humming tapered off. A small hand came out, the sleeve of his gray sweater frayed at the cuff. The fingers found the fork, dropped it, and took a slice of cucumber with bare fingers. The sound of Theo chewing was small and wet in the corner.</p>\n<p>He ate all four cucumber slices. He ate two pieces of the chicken. He didn't touch the third.</p>\n<p>When he was done, he pushed the plate three inches away with his toe and crawled back under the table, curling his body around the pedestal base. He didn't scream. He didn't throw the fork.</p>\n<p>Ren stayed on the floor until seven o'clock, his eyes closed, his breathing matching the boy\u2019s.</p>\n<p><em>*</em></p>\n<p>They took the pendant bulbs out the next morning while Theo was at half-day kindergarten. Ren replaced them with low-output amber globes meant for porch lanterns. In the living room, they took the overhead fixture off its circuit entirely, relying on an old gooseneck floor lamp with a green glass shade that sat behind the armchair, throwing a circle of yellow light no bigger than a card table.</p>\n<p>The magnetic chart went into the drawer under the oven with the spare broiler pans.</p>\n<p>They stopped giving warnings. At five-thirty, Ada simply turned off the radio, shut the hall door to cut the draft from the laundry room, and put a single wooden bowl on the low table in the den. If it was rice, it was only rice. If it was bread and ham, the ham was rolled into two cylinders and the crust was removed before he saw it, so there was no conversation about what was coming off.</p>\n<p>They stopped asking him how his day was. When Ren picked him up from the classroom door, he didn't say, <em>Did you paint the snowman?</em> or <em>Who was your helper today?</em> He took Theo\u2019s backpack, handed him his wool mitten, and they walked the four blocks home in silence, listening to the slush give under their heels.</p>\n<p>Progress was not a straight line.</p>\n<p>On the third Thursday, Theo came through the front door, caught his sleeve on the doorknob, and shrieked for forty minutes on the rug, kicking the mail into the hallway until the envelopes were shredded into wet pulp. Ada sat on the fourth step of the staircase, her elbows on her knees, her hands open, saying nothing at all. She didn't offer a hug; she didn't offer a consequence. She sat like a stone in a creek until the water ran out around her.</p>\n<p>On Friday, he ate his dinner on the floor, put his boots neatly on the rubber tray without being told, and fell asleep with his head on Ren\u2019s thigh while Ren read an article about culvert repairs in the newspaper.</p>\n<p><em>*</em></p>\n<p>Frank came back in January with a half-bushel of winter apples from the cold cellar.</p>\n<p>The afternoon sun was already blue and thin behind the birch trees when he came through the kitchen door. The house was quiet. The small lamp behind the bread box threw a round pool of light across the cutting board. There was no radio.</p>\n<p>Theo was on the rug in the living room, building a corral out of cedar shingles Frank had left on his last trip.</p>\n<p>Frank hung his heavy mackinaw on the peg by the door. He looked at the dim kitchen, at the empty refrigerator door where the clean brushed steel caught the gray light of the window, and then at Ada, who was stirring a pot of navy beans with a wooden spoon.</p>\n<p>\"Dark in here,\" Frank said. His voice was low, out of habit, but his brow was furrowed.</p>\n<p>\"It\u2019s light enough,\" Ada said.</p>\n<p>Frank walked into the living room. His boots made the floorboards creak. He stood over Theo for a long moment, his thumbs hooked in his belt loops.</p>\n<p>Theo didn't look up, but his shoulder blades drew together.</p>\n<p>\"You got the corners overlapped wrong on that corner,\" Frank said, pointing a blunt finger at the cedar shingles. \"A horse\u2019ll push right through a butt-joint. You have to lap them three inches, like siding.\"</p>\n<p>Theo\u2019s hand hovered over the wood. For two seconds, the old tension corded in his neck.</p>\n<p>Frank didn't wait for him to melt. He knelt down\u2014his knees popping with a sound like dry kindling\u2014took two shingles in his calloused hands, and slotted them together with a firm, sliding motion.</p>\n<p>\"See that?\" Frank said. \"Now push it.\"</p>\n<p>Theo reached out and pressed his palm against the joint. The wood held.</p>\n<p>\"Cedar\u2019s light,\" Frank said, sitting back on his heels, his bulk filling the space between the sofa and the low table. \"It splits easy if you drive a nail without a pilot hole. But if you frame it square, it\u2019ll outlast the man who cut it.\"</p>\n<p>Theo picked up another shingle, lined it up with the joint, and looked at Frank.</p>\n<p>\"Two inches back,\" Frank said, his voice hard as iron and completely calm. \"There. Now set the next one.\"</p>\n<p>They worked for twenty minutes on the rug, the old man and the boy, without another word spoken between them.</p>\n<p>In the kitchen, Ren set three bowls on the counter. He didn't call down the hall. He didn't set a timer. He carried one bowl into the living room, set it on the low stool near the shingles, and walked back to the stove.</p>\n<p>Frank looked at the bowl\u2014beans, a square of buttered cornbread, no garnish, no fork. Then he looked across the room at Ren, who was leaning against the counter in the half-dark, his arms folded loosely, watching the steam rise toward the dark ceiling.</p>\n<p>Frank shook his head once\u2014a tiny, private motion of his chin that conceded nothing about the world, nothing about the hardness of the road ahead, nothing about the necessity of calluses on a man\u2019s hands. But he reached out, took the bowl, set it between his knees on the carpet, and broke the cornbread in half, handing the larger piece to the boy without looking down.</p>\n<p>Theo took it. His fingers were dusty with cedar shavings. He took a bite, chewed, and laid the shingle straight against the pine.</p>"}, {"id": "PC8", "title": "Five O'Clock", "html": "<p>The heel mark was still on the drywall by the bathroom door, a gray crescent at the height of a six-year-old's kick, and Ren had stopped painting over it because he'd painted over it twice.</p>\n<p>Tuesday, 6:40. Theo was on the bathmat with his shirt half off, one arm still in the sleeve, screaming in the register that made the dog leave the room. Ada knelt at the tub with her hand in the water, keeping it warm, because the water going cold was a whole second thing.</p>\n<p>\"Buddy. Shirt off, then in. Two steps.\"</p>\n<p>\"I HATE the water I HATE it it's TOO MUCH WATER\u2014\"</p>\n<p>\"It's the same water as last night.\"</p>\n<p>That was true and it was the wrong thing to say and she knew it before the sentence finished. He went from red to something past red. Ren came up the stairs two at a time with the calm face on, the one they'd agreed to keep, and got his hands under Theo's arms and held him, not restraining, just there, while Theo bucked and shrieked and eventually went slack and sobbed into Ren's collarbone for eleven minutes.</p>\n<p>Downstairs, on the refrigerator, the chart had forty-one stickers on it. They'd been consistent. They'd been so consistent. They had read the books with the sensible covers and done what the books said and done it the same way on Wednesdays as on Sundays, and here was the forty-first sticker and here was the heel mark.</p>\n<p>Ren came down at 8:15 and stood in the kitchen with his shirt wet down the front.</p>\n<p>\"He's out.\"</p>\n<p>\"Okay.\"</p>\n<p>\"He said sorry. Twice.\"</p>\n<p>\"He always says sorry,\" Ada said. \"That's the part that kills me.\"</p>\n<p>---</p>\n<p>Sunday, Frank came for dinner and brought a bag of apples nobody had asked for, which was his way, and sat in the chair he always sat in.</p>\n<p>\"He's a good kid,\" Frank said, meaning it. \"That's not the question. The question is what he's allowed to learn about what happens when he does that.\"</p>\n<p>\"He's not doing it,\" Ada said. \"It happens to him.\"</p>\n<p>\"Sure. And the first few times, it happens to him.\" Frank buttered his bread the way he'd buttered bread for fifty years, corner to corner. \"Then he finds out what it gets him. That's not a moral failing, Ada, that's just a kid being a kid. Danny used to do the same thing, and Danny is a fine man with a mortgage.\"</p>\n<p>\"Danny was different.\"</p>\n<p>\"Danny was wound so tight he chewed through the strap on his own backpack. I made him sit at that table until the peas were gone and I sat there with him and it took two hours and it never took two hours again.\" He said it without heat. He wasn't scoring points. \"I'm not saying be cruel. I never laid a hand on any of you and I never yelled where you could hear it. I'm saying the world is not going to turn its lights down for him. His teacher won't. His boss won't. His wife won't. Every year you carry him is a year he doesn't build the muscle, and the load doesn't get lighter, it gets heavier. Teaching him to bend a little now, when it's cheap \u2014 that's the kindest thing you'll ever do for him. It doesn't feel kind. It is.\"</p>\n<p>Ren looked at his father-in-law and thought, not for the first time, that the man had never once made an argument in bad faith, which was the whole trouble with him.</p>\n<p>\"And if he can't,\" Ren said.</p>\n<p>\"Can't is a big word for six,\" Frank said. \"You'd be amazed what people can do when somebody expects it of them. That's not me being hard. That's the nicest thing I know about people.\"</p>\n<p>---</p>\n<p>The scene that broke it open happened in the parking lot of a trampoline place on a Saturday, at a birthday party for a boy named Callum whom Theo did not particularly like.</p>\n<p>Ninety minutes of noise like weather. Foam pit, air horn, eleven kids, pizza under a heat lamp, and a song about a shark playing twice. Theo held it. He held it through cake. He held it through the goodie bag. He got to the door and a woman held it open for him and said, brightly, \"What do you say?\" and he lay down on the rubber mat between the two sets of doors and screamed until the veins stood up in his forehead, and did not stop for twenty-five minutes, in front of every parent in Franklin County.</p>\n<p>Ada carried him to the car like a rolled rug. She was strong and he was fifty-one pounds and she did not cry until Powell Road.</p>\n<p>At home, with him asleep at four in the afternoon, they had the fight.</p>\n<p>\"He held it together for an hour and a half,\" Ren said. \"That's not a kid who won't. That's a kid who ran out.\"</p>\n<p>\"So what, we skip the parties? We skip everything? He's six, Ren, he has a whole life of trampoline places.\"</p>\n<p>\"I'm saying maybe we stop asking him to do the hardest thing at the hardest hour of the day and then punishing him for the part where he can't.\"</p>\n<p>\"Say it in English.\"</p>\n<p>\"Fine. I think what we're doing isn't working and I think it's been not working for a year.\"</p>\n<p>\"What we're doing,\" Ada said. \"You mean me. I'm the one at the tub. I'm the one who made the chart.\"</p>\n<p>\"That's not\u2014\"</p>\n<p>\"I made the chart because you were traveling and somebody had to do something and it was me at seven o'clock every single night for a year.\" Her voice went to a place it didn't go. \"So say what you mean. Say I've been hurting him.\"</p>\n<p>The refrigerator hummed. Ren didn't say it. Ada sat down on the floor of her own kitchen with her back against the dishwasher, which was still warm, and said it herself, which was worse.</p>\n<p>\"I've been walking him into a wall every night at seven and calling it teaching him.\"</p>\n<p>---</p>\n<p>They didn't announce anything. There was no plan on paper. They just started moving furniture.</p>\n<p>Dinner went to 5:10, which meant Ren left work at 4:30 twice a week and ate cold leftovers himself at nine. The overhead light in the kitchen \u2014 a four-bulb fixture that Ada had loved \u2014 stayed off, and a lamp from the guest room came downstairs and lived on the counter, and the whole room turned the color of a gas station at dusk, and Ada hated how it looked and left it.</p>\n<p>The plate came already made. No <em>do you want</em>. Chicken, apple slices, the crackers he liked, the three things not touching, put down in front of him without ceremony, and nobody watched him eat it. Ren stopped narrating. Ada stopped crouching to eye level and taking him by the shoulders, which every book had told her to do and which she now understood he experienced roughly the way you'd experience a stranger gripping your arms and putting their face six inches from yours.</p>\n<p>Bath moved to morning. Just \u2014 moved. Some nights there was no bath and he went to bed with playground on his hands and the world did not end.</p>\n<p>They cut the eight-minute warning to two, because eight minutes turned out to be eight minutes of dread and the countdown was doing the damage, not the transition.</p>\n<p>They took the TV off before he came downstairs, so the house was already quiet instead of going quiet.</p>\n<p>Nothing happened for nine days. Nine days of the lamp and the early dinner and the shrieking anyway, and Ada thought, in the honest part of the night, that they had traded a system that didn't work for no system at all.</p>\n<p>On the tenth day Theo ate his dinner, got down, and went to get his own pajamas. Neither of them said a word about it. Ren stood at the sink with a plate in his hand and did not turn around.</p>\n<p>It wasn't a switch. Three good nights, then a Thursday where he threw a fork hard enough to chip the trim and screamed for forty minutes about a sock. Then a stomach bug in February that put them back to two meltdowns a night for two solid weeks, and Ada, at the end of it, said, <em>it's gone, whatever it was, we lost it,</em> and it came back the following Tuesday, slowly, like a tide.</p>\n<p>---</p>\n<p>In March, Frank came over to help move a cord of firewood off the driveway before the rain.</p>\n<p>He didn't ask Theo to help. He put a pair of his own work gloves on the step, way too big, and said, \"Two at a time. Split side up. Stack's over there,\" and turned his back and got to work.</p>\n<p>Theo hauled wood for forty minutes.</p>\n<p>Ada watched from the kitchen window with a dish towel she wasn't using. Her father did not praise him. He did not check in on his feelings. Twice he said, \"Not like that. Like this,\" and showed him once, and Theo did it like that. When Theo dropped a log on his own foot and his face went to the place that preceded everything, Frank said, \"Yep. That happens,\" and kept stacking, and Theo stood there for four or five seconds with his whole body deciding, and then picked the log up.</p>\n<p>At the end Frank said, \"That's a stack,\" and Theo said, \"That's a stack,\" and they both looked at it.</p>\n<p>\"He just needed a job,\" Frank said in the kitchen after, running his hands under the tap. \"Kid's got a motor. You give a motor nothing to do, it shakes the car apart.\"</p>\n<p>He was right. He was so obviously right that Ada felt something turn over in her chest, because they had spent a year managing Theo and had somehow never once simply handed him something heavy and walked away.</p>\n<p>Frank dried his hands and looked at the lamp on the counter, and at the clock, which said 4:55, and at the table already set.</p>\n<p>\"You're doing it different,\" he said.</p>\n<p>\"We are.\"</p>\n<p>\"He seems all right.\" Frank folded the towel. \"I still think you're building him a room he'll have to leave someday.\"</p>\n<p>\"Maybe,\" Ada said.</p>\n<p>\"I hope I'm wrong.\" He said it plainly, no edge on it. \"I've been wrong about plenty. Ask your mother.\" He put the towel on the oven handle, crooked, the way he always did. \"You want me to stay for dinner or is that a lot for him?\"</p>\n<p>Ada thought about it honestly, which he'd taught her to do.</p>\n<p>\"Stay,\" she said. \"But sit on that side. He doesn't like being between people.\"</p>\n<p>Frank moved his chair one seat over, and that was the entire negotiation, and it took two seconds, and neither of them ever mentioned it again.</p>\n<p>---</p>\n<p>Five-ten. The lamp on, the big light off, the window over the sink gone blue.</p>\n<p>Theo is at the table with the plate in front of him, chicken and apple slices and crackers, none of it touching. Frank is beside him working a splinter out of his own thumb with a pocketknife and not talking. Ren carries over the water glasses, two hands, and sets one down by Theo's left elbow where it goes.</p>\n<p>Theo picks up a cracker, breaks it in half, and eats the half.</p>\n<p>Outside, the wood stack darkens against the fence. Somebody's dog barks twice and stops. Ada sits down last, in the quiet, and pulls her chair in.</p>"}, {"id": "PH0", "title": "The Blue Bowl", "html": "<p>The first thing to go was the peas.</p>\n<p>Theo had eaten them the week before, lifting each one from the tines of his fork with solemn concentration. Tonight they touched the rice.</p>\n<p>\u201cThey\u2019re just beside it,\u201d Ren said.</p>\n<p>\u201cThey touched.\u201d</p>\n<p>\u201cYou don\u2019t have to eat the rice they touched,\u201d Ada said. \u201cYou can eat the other side.\u201d</p>\n<p>Theo pressed his hands over his ears. The kitchen fan hummed above the stove. A truck labored up the wet street, gears grinding. On the counter, Ada\u2019s phone buzzed against the fruit bowl.</p>\n<p>\u201cHands down, please,\u201d Ren said. \u201cWe\u2019re at the table.\u201d</p>\n<p>\u201cI can\u2019t.\u201d</p>\n<p>\u201cYou can,\u201d said Frank.</p>\n<p>He sat across from Theo with his napkin folded beside his plate. Ada\u2019s father was a broad, white-haired man who still polished his shoes on Sundays. He had raised four children in a house with one bathroom and no discussion about whether carrots were acceptable in rounds but not sticks.</p>\n<p>\u201cThe peas haven\u2019t changed,\u201d Frank said. His voice was level, not loud. \u201cYou ate them before. Take one bite, then leave the rest if you don\u2019t care for them.\u201d</p>\n<p>Theo made a sound like a hinge tearing loose.</p>\n<p>Ada reached for his plate. Ren caught her eye. They had agreed not to remove rejected food. Dr. Levin\u2019s handout was held to the refrigerator by a magnet shaped like a lemon: parents decide what and when; children decide whether and how much.</p>\n<p>\u201cTheo,\u201d Ada said, \u201cyou may eat what\u2019s on your plate, or you may wait until breakfast.\u201d</p>\n<p>The screaming began.</p>\n<p>He kicked the table leg. Water jumped from the glasses. Frank lifted his own glass before it tipped.</p>\n<p>\u201cWe don\u2019t kick furniture,\u201d Ren said. \u201cIf you kick again, you\u2019ll lose your story.\u201d</p>\n<p>Theo kicked again, harder.</p>\n<p>\u201cAll right. No story tonight.\u201d</p>\n<p>Theo swept his plate to the floor.</p>\n<p>The blue bowl broke under it. One white fracture ran through the painted rabbit at the bottom.</p>\n<p>For several seconds, the only sound was Theo dragging air into himself. His face had gone dark red except around his mouth.</p>\n<p>Ada stood. \u201cDad, could you\u2014\u201d</p>\n<p>\u201cI\u2019ll sweep,\u201d Frank said.</p>\n<p>\u201cNo.\u201d She had not meant it sharply, but it came out sharp. \u201cPlease just leave it.\u201d</p>\n<p>Frank put both palms on the table and rose. \u201cI\u2019ll call tomorrow.\u201d</p>\n<p>At the door, he crouched to Theo, who had folded himself beneath the coat hooks.</p>\n<p>\u201cGood night, Theodore.\u201d</p>\n<p>Theo did not look up.</p>\n<p>Frank waited.</p>\n<p>\u201cGood night, Grandpa,\u201d Theo whispered.</p>\n<p>After he left, Ren carried Theo upstairs sideways, one arm under his knees, the other around his ribs. Theo struck Ren\u2019s shoulder with the back of his head all the way up.</p>\n<p>Later, when the house was quiet, Ada set the two halves of the rabbit bowl on the counter.</p>\n<p>\u201cWe did exactly what we said we\u2019d do,\u201d Ren said.</p>\n<p>\u201cI know.\u201d</p>\n<p>\u201cWe stayed calm.\u201d</p>\n<p>\u201cI know.\u201d</p>\n<p>\u201cWe gave one warning.\u201d</p>\n<p>\u201cI was there.\u201d</p>\n<p>Ren picked up a shard no bigger than a fingernail. \u201cWhat do you want me to say?\u201d</p>\n<p>Ada looked toward the ceiling. \u201cI want you to stop sounding like the evening went well.\u201d</p>\n<p>By the next Thursday, they had bought another chart. Theo chose silver stars. Three stars earned a cartoon after school; ten earned a trip to the train museum. He got two the first night. On the second, he tore the chart from the refrigerator because Ada put toothpaste on his brush before he was ready.</p>\n<p>They tried earlier baths. Later baths. A sand timer. A digital timer with a red wedge that vanished minute by minute. They gave choices: bath or shower, pajamas before teeth or teeth before pajamas, two books or three short ones. Theo answered every choice with another question until Ren\u2019s voice acquired an edge he could hear and could not file off.</p>\n<p>One Saturday, the three of them went to buy winter boots.</p>\n<p>The store was hot and smelled of rubber. A radio played over the ceiling speakers. Ren knelt with a boot in each hand.</p>\n<p>\u201cBlue or gray?\u201d</p>\n<p>Theo stared.</p>\n<p>\u201cThe blue ones light up,\u201d Ada said.</p>\n<p>\u201cBut the gray ones feel softer,\u201d Ren said.</p>\n<p>A clerk rolled a ladder past them. Metal rattled against metal.</p>\n<p>\u201cBlue or gray, bud?\u201d</p>\n<p>Theo backed into a display of slippers.</p>\n<p>\u201cWe need an answer.\u201d</p>\n<p>\u201cI don\u2019t know.\u201d</p>\n<p>\u201cYou can try both.\u201d</p>\n<p>\u201cNo.\u201d</p>\n<p>\u201cTheo, your old boots leak.\u201d</p>\n<p>\u201cI DON\u2019T KNOW.\u201d</p>\n<p>People turned. Theo yanked off one shoe and threw it. It struck a cardboard snowman, which rocked on its base and fell flat in the aisle.</p>\n<p>Ada carried him to the car in one sock. He bit through the shoulder of her sweater.</p>\n<p>They sat in the parking lot while rain grayed the windshield. Theo sobbed against the back seat, exhausted now, his bare foot tucked under him.</p>\n<p>Ren held up the blue boot they had somehow paid for. \u201cAt least we got them.\u201d</p>\n<p>Ada turned so fast the seat belt locked across her chest.</p>\n<p>\u201cThat is not funny.\u201d</p>\n<p>\u201cI didn\u2019t say it was.\u201d</p>\n<p>\u201cYou always do this. You turn everything into something we survived.\u201d</p>\n<p>\u201cWhat would you like me to turn it into?\u201d</p>\n<p>She pulled the collar of her sweater aside. The skin beneath showed two wet crescents and a purple center.</p>\n<p>\u201cThis,\u201d she said. \u201cI\u2019d like you to look at this.\u201d</p>\n<p>Ren did.</p>\n<p>From the back seat came Theo\u2019s small, hoarse voice. \u201cToo many boots.\u201d</p>\n<p>That night, they did not ask him whether he wanted a bath. Ada filled it halfway and left the bathroom light off. The hall light made a pale road across the water. Ren put out the green pajamas, not the green and the striped.</p>\n<p>Theo stood in the doorway.</p>\n<p>\u201cBath,\u201d Ada said.</p>\n<p>\u201cNo hair?\u201d</p>\n<p>\u201cNo hair tonight.\u201d</p>\n<p>He stepped in.</p>\n<p>They began making alterations so small they felt, at first, like superstition.</p>\n<p>Ren removed the bulb above Theo\u2019s place at the table. Ada switched off the stove fan before calling him to dinner. They fed him half a banana at five, though Frank said snacks ruined appetites. At five-thirty, Ren wrote the meal on a card and propped it by Theo\u2019s plate: CHICKEN. BREAD. CUCUMBER. There was always bread.</p>\n<p>They stopped asking what he wanted to do first. A card on the stairs showed three pictures Ada had drawn badly: bathtub, pajamas, book. Theo moved a wooden clothespin down the card.</p>\n<p>For twenty minutes after school, nobody asked him anything. His backpack stayed on the floor. He lay under the dining table with a blanket and pushed a red truck along the underside of the chairs.</p>\n<p>The first week, he still screamed three nights.</p>\n<p>The second week, he screamed because the bathwater was running when he entered the room. He screamed when Ren, forgetting, turned on the blender. He screamed on Friday because Friday had held itself together too long.</p>\n<p>But on Tuesday he ate chicken. On Wednesday he left the table without eating and sat on the bottom stair, breathing hard, but did not throw anything. On Sunday, when cucumber juice reached his bread, he carried the plate to the counter.</p>\n<p>\u201cI\u2019m done,\u201d he said.</p>\n<p>Ren and Ada waited until he had gone upstairs before looking at each other.</p>\n<p>Frank came for dinner the following week. He brought pot roast in a covered red dish and a bag of carrots from his garden, scrubbed but still smelling faintly of soil.</p>\n<p>The kitchen was dim.</p>\n<p>\u201cSaving electricity?\u201d he asked.</p>\n<p>\u201cThe bulb\u2019s out,\u201d Ada said.</p>\n<p>Frank looked up at the empty socket, then at her. \u201cI see.\u201d</p>\n<p>At the table, Theo ate bread and one piece of meat. Frank did not comment. He told them about a man at the hardware store who had tried to return a snow shovel after using it for nine winters.</p>\n<p>When Theo knocked over his milk, Ren rose at once.</p>\n<p>Frank said, \u201cStay there.\u201d</p>\n<p>Theo went rigid. Milk traveled toward the edge of the table.</p>\n<p>\u201cThe towel is behind you,\u201d Frank said. \u201cGet it.\u201d</p>\n<p>Ada opened her mouth.</p>\n<p>Theo slid down from his chair.</p>\n<p>\u201cStart at the edge,\u201d Frank said. \u201cOtherwise you\u2019ll chase it onto the floor.\u201d</p>\n<p>Theo pressed the towel against the table\u2019s edge and pushed inward. His breathing was quick. Frank moved the pot roast out of his way but did not touch the towel.</p>\n<p>\u201cThat\u2019s it,\u201d he said. \u201cFold the wet part under.\u201d</p>\n<p>Theo folded it.</p>\n<p>\u201cNow the rest.\u201d</p>\n<p>When the table was dry, Theo carried the towel to the sink.</p>\n<p>\u201cI did the whole milk.\u201d</p>\n<p>\u201cYou did,\u201d Frank said.</p>\n<p>After dinner, while Theo moved the clothespin from pajamas to book, Frank stood beside Ada at the sink.</p>\n<p>\u201cYou\u2019re making that house mighty narrow around him,\u201d he said.</p>\n<p>\u201cWe\u2019re getting through supper.\u201d</p>\n<p>\u201cI can see that.\u201d</p>\n<p>She waited.</p>\n<p>Frank dried a plate. \u201cI\u2019m not asking you to torment the boy. I\u2019m saying his classroom won\u2019t turn off the lights because he\u2019s had a hard Friday. Other children won\u2019t keep their food from touching his. A boss won\u2019t draw him a picture o
