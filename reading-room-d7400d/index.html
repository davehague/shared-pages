s the water. Ren put out the green pajamas, not the green and the striped.</p>\n<p>Theo stood in the doorway.</p>\n<p>\u201cBath,\u201d Ada said.</p>\n<p>\u201cNo hair?\u201d</p>\n<p>\u201cNo hair tonight.\u201d</p>\n<p>He stepped in.</p>\n<p>They began making alterations so small they felt, at first, like superstition.</p>\n<p>Ren removed the bulb above Theo\u2019s place at the table. Ada switched off the stove fan before calling him to dinner. They fed him half a banana at five, though Frank said snacks ruined appetites. At five-thirty, Ren wrote the meal on a card and propped it by Theo\u2019s plate: CHICKEN. BREAD. CUCUMBER. There was always bread.</p>\n<p>They stopped asking what he wanted to do first. A card on the stairs showed three pictures Ada had drawn badly: bathtub, pajamas, book. Theo moved a wooden clothespin down the card.</p>\n<p>For twenty minutes after school, nobody asked him anything. His backpack stayed on the floor. He lay under the dining table with a blanket and pushed a red truck along the underside of the chairs.</p>\n<p>The first week, he still screamed three nights.</p>\n<p>The second week, he screamed because the bathwater was running when he entered the room. He screamed when Ren, forgetting, turned on the blender. He screamed on Friday because Friday had held itself together too long.</p>\n<p>But on Tuesday he ate chicken. On Wednesday he left the table without eating and sat on the bottom stair, breathing hard, but did not throw anything. On Sunday, when cucumber juice reached his bread, he carried the plate to the counter.</p>\n<p>\u201cI\u2019m done,\u201d he said.</p>\n<p>Ren and Ada waited until he had gone upstairs before looking at each other.</p>\n<p>Frank came for dinner the following week. He brought pot roast in a covered red dish and a bag of carrots from his garden, scrubbed but still smelling faintly of soil.</p>\n<p>The kitchen was dim.</p>\n<p>\u201cSaving electricity?\u201d he asked.</p>\n<p>\u201cThe bulb\u2019s out,\u201d Ada said.</p>\n<p>Frank looked up at the empty socket, then at her. \u201cI see.\u201d</p>\n<p>At the table, Theo ate bread and one piece of meat. Frank did not comment. He told them about a man at the hardware store who had tried to return a snow shovel after using it for nine winters.</p>\n<p>When Theo knocked over his milk, Ren rose at once.</p>\n<p>Frank said, \u201cStay there.\u201d</p>\n<p>Theo went rigid. Milk traveled toward the edge of the table.</p>\n<p>\u201cThe towel is behind you,\u201d Frank said. \u201cGet it.\u201d</p>\n<p>Ada opened her mouth.</p>\n<p>Theo slid down from his chair.</p>\n<p>\u201cStart at the edge,\u201d Frank said. \u201cOtherwise you\u2019ll chase it onto the floor.\u201d</p>\n<p>Theo pressed the towel against the table\u2019s edge and pushed inward. His breathing was quick. Frank moved the pot roast out of his way but did not touch the towel.</p>\n<p>\u201cThat\u2019s it,\u201d he said. \u201cFold the wet part under.\u201d</p>\n<p>Theo folded it.</p>\n<p>\u201cNow the rest.\u201d</p>\n<p>When the table was dry, Theo carried the towel to the sink.</p>\n<p>\u201cI did the whole milk.\u201d</p>\n<p>\u201cYou did,\u201d Frank said.</p>\n<p>After dinner, while Theo moved the clothespin from pajamas to book, Frank stood beside Ada at the sink.</p>\n<p>\u201cYou\u2019re making that house mighty narrow around him,\u201d he said.</p>\n<p>\u201cWe\u2019re getting through supper.\u201d</p>\n<p>\u201cI can see that.\u201d</p>\n<p>She waited.</p>\n<p>Frank dried a plate. \u201cI\u2019m not asking you to torment the boy. I\u2019m saying his classroom won\u2019t turn off the lights because he\u2019s had a hard Friday. Other children won\u2019t keep their food from touching his. A boss won\u2019t draw him a picture of what comes next.\u201d</p>\n<p>\u201cHe\u2019s six.\u201d</p>\n<p>\u201cHe won\u2019t be six long.\u201d</p>\n<p>Ada set a glass in the rack harder than necessary.</p>\n<p>Frank placed the dry plate on the stack. \u201cYou think I don\u2019t know he\u2019s struggling. I know. But there are two kinds of mercy. There\u2019s taking the weight away, and there\u2019s showing somebody he can carry it. Don\u2019t get so good at the first that you forget the second.\u201d</p>\n<p>Upstairs, Theo called, \u201cGrandpa, are you reading?\u201d</p>\n<p>Frank hung the towel over the oven door.</p>\n<p>\u201cIf I\u2019m invited.\u201d</p>\n<p>\u201cYou\u2019re invited,\u201d Theo shouted.</p>\n<p>Frank read all of <em>The Little Island</em>, without skipping the pages Ren usually shortened. When Theo interrupted, Frank tapped the line with one square fingernail and said, \u201cLet me finish this sentence.\u201d Theo waited.</p>\n<p>In December, Ada\u2019s sister held a birthday dinner at an Italian restaurant. They nearly declined. Then Ada said they could not live forever between the kitchen and the bathtub.</p>\n<p>The restaurant had hanging copper pans and a waiter who sang for birthdays. Ren packed crackers, headphones, and the picture card. Ada showed Theo the menu online. Frank promised to sit beside him.</p>\n<p>For forty minutes, it worked.</p>\n<p>Then the dining room dimmed. Eight waiters appeared clapping, bearing a cake armored with sparklers. Everyone began singing.</p>\n<p>Theo went under the table.</p>\n<p>Ada reached for him. He kicked backward, striking Frank\u2019s shin.</p>\n<p>\u201cDon\u2019t grab me!\u201d</p>\n<p>A sparkler spit white light. Someone laughed\u2014not at Theo, but the sound found him anyway. He crawled between chairs, overturned a water glass, and ran.</p>\n<p>Ren caught him in the vestibule. Theo struck the glass door with both hands while diners entering stepped around them.</p>\n<p>In the car, Ada held the headphones over Theo\u2019s ears. Ren drove. Neither spoke.</p>\n<p>At home, Theo vomited on the front mat.</p>\n<p>After they had cleaned him and changed him and put him to bed without a bath, Ren found Ada sitting on the kitchen floor.</p>\n<p>\u201cWe knew,\u201d she said.</p>\n<p>\u201cWe thought he could manage.\u201d</p>\n<p>\u201cWe wanted him to manage because we wanted dinner.\u201d</p>\n<p>\u201cThat\u2019s allowed.\u201d</p>\n<p>\u201cIs it?\u201d</p>\n<p>Ren sat across from her, knees touching hers.</p>\n<p>\u201cI miss going places,\u201d Ada said. \u201cI miss not studying every room before we enter it.\u201d</p>\n<p>\u201cI know.\u201d</p>\n<p>\u201cI hate that my father thinks we\u2019re making him weak.\u201d</p>\n<p>\u201cHe doesn\u2019t think we\u2019re bad parents.\u201d</p>\n<p>\u201cHe thinks we\u2019re afraid.\u201d</p>\n<p>Ren looked at the dark stove hood. \u201cI am afraid.\u201d</p>\n<p>Ada rubbed the heel of her hand over her eyes.</p>\n<p>In January, Theo began carrying his own card. Ada laminated a smaller copy, and he kept it in his pocket. At school pickup, he sometimes asked what dinner was before saying hello.</p>\n<p>They added one hard thing to certain evenings. Hair washing on Wednesdays. A food not touching anything else. Five minutes at the table after he finished eating. Frank approved of the five minutes and disapproved of the separate saucer. Nobody changed anyone\u2019s mind.</p>\n<p>On hair-washing nights, Theo cried. Ren poured from a cup instead of using the spray nozzle. Ada held a folded washcloth over his eyes. The first Wednesday he climbed out dripping and ran naked into the hall. The next week he stayed in but screamed. The week after that he said, \u201cTell me before.\u201d</p>\n<p>\u201cThree pours,\u201d Ren said. \u201cHere\u2019s one.\u201d</p>\n<p>Theo clutched the washcloth.</p>\n<p>\u201cOne.\u201d</p>\n<p>Water streamed down his neck.</p>\n<p>\u201cTwo.\u201d</p>\n<p>\u201cWait.\u201d</p>\n<p>Ren waited.</p>\n<p>\u201cOkay.\u201d</p>\n<p>At Frank\u2019s house, there were no picture cards. The lights were bright, and the clock in the hall chimed every quarter hour. But Frank served meatloaf at six exactly and never asked Theo what he wanted. Theo knew where the napkins were. He knew he must carry his plate to the sink.</p>\n<p>Once, he refused.</p>\n<p>Frank sat at the table, peeling an orange in one long spiral.</p>\n<p>\u201cWe\u2019re not leaving it for your grandmother,\u201d he said.</p>\n<p>Theo lay on the floor.</p>\n<p>Frank ate one section of orange.</p>\n<p>Theo kicked the table leg, once.</p>\n<p>Frank looked down. \u201cThe plate.\u201d</p>\n<p>For five minutes neither moved. Then Theo rose, cheeks wet, and carried the plate with both hands.</p>\n<p>\u201cThank you,\u201d Frank said.</p>\n<p>Theo returned and leaned against his grandfather\u2019s arm. Frank separated an orange section and placed it in his palm.</p>\n<p>By spring, some evenings were almost plain.</p>\n<p>Not all. A substitute teacher, a fire drill, wet socks\u2014any one of them could follow Theo home like a storm front. There were still nights when the bath card went untouched and Ren ate cold chicken standing over the sink. Once Theo threw the new blue bowl, but it struck the rug and rolled in a circle without breaking.</p>\n<p>On a rainy Thursday, Frank came through the back door carrying carrots. Theo was beneath the table, his blanket roofed over two chairs.</p>\n<p>\u201cBad one?\u201d Frank asked.</p>\n<p>Ada nodded.</p>\n<p>Frank removed his shoes. \u201cNeed anything?\u201d</p>\n<p>\u201cCut those into sticks. Not rounds.\u201d</p>\n<p>Frank gave her a look.</p>\n<p>\u201cPlease.\u201d</p>\n<p>He took up the knife.</p>\n<p>At dinner the empty socket remained above Theo\u2019s chair. The carrots sat on their own white saucer. Frank\u2019s pot roast touched his potatoes, as he preferred. Theo moved the clothespin from dinner to bath, then climbed back into his chair for one more piece of bread.</p>\n<p>His milk tipped when his elbow caught the cup.</p>\n<p>He froze.</p>\n<p>Frank reached behind him and held out the towel. Theo took it. Ada moved the serving dish aside. Ren kept his hands in his lap.</p>\n<p>Theo pressed the towel to the edge of the table and pushed the small white lake inward.</p>"}, {"id": "BG1", "title": "The Weather in the House", "html": "<p>The trouble started, most nights, at 5:40.</p>\n<p>Ren could feel it coming the way you feel a train through your shoes. Theo would be fine \u2014 genuinely fine, lying on the rug narrating a battle between a plastic triceratops and a wooden spoon \u2014 and then the oven timer would go, and Ada would call <em>hands</em>, and the light over the table would come on, and somewhere in that half minute the boy would stop being a boy and become a siren.</p>\n<p>Tonight it was the chicken. It had touched the rice.</p>\n<p>\"It's just the sauce,\" Ada said. \"The rice is fine, look, I can scrape\u2014\"</p>\n<p>\"IT'S NOT FINE.\" Theo was already off the chair, already on the floor, already at the volume where the neighbors upstairs would start moving furniture out of politeness. \"IT'S WET, IT'S WET, IT'S WET\u2014\"</p>\n<p>They had a system. They'd read the books. Ren crouched at a friendly distance and said, in the calm voice, \"I hear you. The rice got wet. That's disappointing.\" Ada cleared the plate without comment, because rewarding the volume was how you got more volume. They waited it out. It took forty minutes. At 7:15, Theo fell asleep on the hallway floor two feet from his bed, one sock off, breathing like something that had run a long way.</p>\n<p>Ada sat on the edge of the tub afterward with her shoes still on.</p>\n<p>\"Sticker chart,\" she said. \"Week three.\"</p>\n<p>\"Week three of the sticker chart,\" Ren agreed.</p>\n<p>\"He wants the stickers.\"</p>\n<p>\"He does want the stickers.\"</p>\n<p>\"He wants them so much.\" She pressed the heels of her hands against her eyes. \"That's the part I can't \u2014 he <em>wants</em> to do it. He isn't beating us.\"</p>\n<p>---</p>\n<p>Frank came for the weekend in October, filling the doorway with his overcoat and a bag of oranges nobody had asked for.</p>\n<p>\"There he is,\" he said to Theo, who was under the coffee table. \"There's the man.\"</p>\n<p>By Saturday afternoon Frank had assembled his position, which he delivered in the kitchen while Ada chopped.</p>\n<p>\"Four kids,\" he said. \"Four. And I'll tell you the whole trick. They knew what was expected. There was a table, and there was a time, and you sat at it, and if you didn't, you were hungry and you learned something. Nobody negotiated with me about <em>rice</em>.\"</p>\n<p>\"Different kid,\" Ada said.</p>\n<p>\"Every kid is a different kid. That's what every generation figures out and it's never true.\" He took an orange. \"The world isn't going to lower the lights for him, sweetheart. Somebody's going to hand him a job and a boss and a wet plate of rice, and what then?\"</p>\n<p>\"Dad.\"</p>\n<p>\"I'm not being cruel. I'm being <em>kind</em> on a longer timeline.\"</p>\n<p>Ren, from the doorway, said, \"Would you like to run dinner?\"</p>\n<p>Ada shot him a look. Frank didn't notice; he was already rolling his sleeves.</p>\n<p>It went like this. Frank turned on the big overhead light because a family should be able to see each other. He set the table properly, all four places, and put the food out in serving dishes so the boy could learn to serve himself. He announced dinner at 5:30, which was fifteen minutes earlier than usual, because a firm time is a firm time. The kitchen radio stayed on. Frank asked Theo three questions in a row about school, and offered him a choice \u2014 chicken or fish sticks, peas or carrots, milk or water \u2014 because he wasn't a tyrant, he believed in choices.</p>\n<p>Theo stood by his chair with his hands over his ears.</p>\n<p>\"Sit down, please,\" Frank said pleasantly.</p>\n<p>\"Turn it <em>off</em>\u2014\"</p>\n<p>\"After you sit down.\"</p>\n<p>The boy's face did the thing Ren had learned to read: the eyes going flat and far away, the mouth going square. Ada moved and Frank held up one hand, and she stopped, and Ren would think about that raised hand for a long time.</p>\n<p>\"He needs to know we mean it,\" Frank said.</p>\n<p>What happened next lasted an hour and ten minutes. Theo went through the chair \u2014 not around it, through it, taking it over sideways \u2014 and the serving bowl of peas went off the table in a green arc, and he got a fistful of tablecloth and hauled, and then he was in the corner by the radiator screaming in a register Ren had never heard from him, a sound with no words in it at all, hitting the back of his own head against the wall with a rhythm that made Ada shout. Ren got there first and got his hand between the head and the plaster and just held it there, taking the knocks in his palm, saying nothing, for a very long time.</p>\n<p>Frank stood by the table with a serving spoon in his hand.</p>\n<p>\"He's testing you,\" he said, but there was less in it than before.</p>\n<p>At 9:40 Theo woke and threw up, the way he did after the very bad ones, and Ada changed the sheets while Ren held a cup of water and Frank stood in the hallway not coming in.</p>\n<p>In the morning Frank said, \"He's a bright boy.\" He left after lunch, a day early. He said it was the traffic.</p>\n<p>---</p>\n<p>Ada started writing things down. Not feelings \u2014 times.</p>\n<p>She kept it on the back of an envelope on the fridge, and in three weeks it stopped being an envelope and became a page in a notebook, and it said things like <em>5:40 lights on, 5:52 blowup</em> and <em>bath ok when tub filled before he came in</em> and <em>Tues: no blowup \u2014 why? \u2014 snack at 4:30, no homework folder, Ren home early, quiet.</em></p>\n<p>\"Look at Tuesday,\" she said.</p>\n<p>Ren looked at Tuesday. They looked at Tuesday for a long time.</p>\n<p>They didn't make a plan so much as start subtracting.</p>\n<p>The overhead light went first. Ren bought a floor lamp with a warm bulb and they ate under it, the kitchen half in shadow, which felt strange for about four days and then felt like the only civilized way anyone had ever eaten.</p>\n<p>Then the choices. They had been so proud of the choices \u2014 <em>would you like the blue cup or the green cup, do you want peas or carrots</em> \u2014 because that was what you did, you gave a child agency. Ada put out one cup. The green one, always. She stopped asking what he wanted for dinner and just put the plate down, and the plate had a rim, and the food didn't touch, because on the envelope it said <em>touching = 4 of 5 blowups.</em></p>\n<p>They moved dinner to 5:15 and made it smaller, and put a real snack at 4:15 \u2014 cheese, apple, the same every day \u2014 because a child who has been holding himself together at school since eight in the morning is not a child with a discipline problem at six, he is a child running on nothing.</p>\n<p>They stopped talking to him for the first twenty minutes after school. Not coldly. Ren just handed him the snack and put on the same record, the one with the piano, and read his own book at the other end of the couch, and let the boy come back into himself in his own time. Theo started talking at about 4:35, every day, unprompted, in a flood \u2014 about a kid named Marcus, about a bird that got into the gym.</p>\n<p>They filled the bath before he was in the room, so the roar of the taps happened without him.</p>\n<p>They put a hook on the wall at his height so the coat had one place.</p>\n<p>They stopped saying <em>hurry.</em></p>\n<p>None of it was dramatic. Each single change was so small it was almost embarrassing to say out loud. But by the first week of December the notebook had a run of clean days in it, and Ada looked at the run for a while and then quietly stopped keeping the notebook, which was its own kind of announcement.</p>\n<p>---</p>\n<p>Frank came at Christmas, prepared to be gentle about it.</p>\n<p>He watched Ren dim the lamp at five o'clock and said nothing. He watched the single green cup go down and said nothing, in a way that took visible effort. Over the pie he said, \"You know what worries me. He's six. You've built him a very nice little world in here. What happens in the big one?\"</p>\n<p>\"Ask him about the concert,\" Ada said.</p>\n<p>\"What concert?\"</p>\n<p>Theo, who had been listening the way children always are, said, \"I sang in the front row.\"</p>\n<p>Frank turned. \"You did?\"</p>\n<p>\"There were two hundred people,\" Theo said. \"Mom said I could stand by the door if it got loud. I didn't need to.\" He considered. \"It was quite loud.\"</p>\n<p>\"He asked to be in the front,\" Ren said. \"We didn't ask him.\"</p>\n<p>Frank chewed. \"One concert.\"</p>\n<p>\"He sleeps over at Marcus's,\" Ada said. \"He handled the fire drill. He got a filling done at the dentist in October and didn't cry, and I'll remind you that in June he screamed for twenty minutes in the parking lot because we couldn't find the car.\"</p>\n<p>\"So he grew up.\"</p>\n<p>\"Sure,\" Ada said. \"Let's say that.\"</p>\n<p>Frank set down his fork with the air of a man conceding a hand of cards and pretending it's a small pot. \"In my day we'd have called it spoiling him.\"</p>\n<p>\"You did call it that,\" Ada said. \"In October. You said he'd get worse.\"</p>\n<p>There was a pause that went on slightly too long for comfort, and Frank looked over at the boy, who was building something out of pie crust, humming, entirely unbothered, in the low warm light.</p>\n<p>\"Well,\" Frank said. \"He's a bright boy.\"</p>\n<p>Later, drying dishes, he asked Ren where he'd got the lamp. He said the light in his own kitchen was murder on his eyes. He said it in the tone of a man who had thought of it himself.</p>\n<p>---</p>\n<p>February, a Thursday, nothing special about it.</p>\n<p>The lamp is on. The rice is on one side of the plate and the chicken is on the other and there is a clean inch of white between them. The radio is off. Theo has his feet hooked around the chair legs and is telling a long story about Marcus that has no ending in sight, and Ada is listening with her chin in her hand, and Ren gets up to refill the green cup at the sink. Outside the window it's sleeting, going sideways under the streetlight. It's 5:20. Nobody looks at the clock.</p>"}]}];
const FLAT=DATA.flatMap(g=>g.stories.map(s=>({...s,premise:g.premise})));
const KEY='c2s-judge-v1';
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
let cur=Math.min(+localStorage.getItem(KEY+'-pos')||0,FLAT.length-1);
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(KEY+'-pos',cur);refreshToc()};
const scored=s=>{const a=state[s.id];return a&&a.teach&&a.grade};

const grades=['A','A-','B+','B','B-','C+','C','D','F'];
document.getElementById('grades').innerHTML=grades.map(g=>
  `<label><input type="radio" name="grade" value="${g}" data-k="grade">${g}</label>`).join('');

function refreshToc(){
  const t=document.getElementById('toc');t.innerHTML='';
  DATA.forEach(g=>{
    const h=document.createElement('div');h.className='grp';h.textContent=g.premise;t.appendChild(h);
    g.stories.forEach(s=>{
      const i=FLAT.findIndex(f=>f.id===s.id);
      const b=document.createElement('button');
      b.innerHTML=`<span class="dot${scored(s)?' done':''}"></span> story-${s.id}`;
      if(i===cur)b.classList.add('active');
      b.onclick=()=>{cur=i;render()};t.appendChild(b);
    });
  });
  const n=FLAT.filter(scored).length;
  document.getElementById('ptext').textContent=`${n} of ${FLAT.length} judged`;
  document.querySelector('#bar i').style.width=(100*n/FLAT.length)+'%';
}

function render(){
  const s=FLAT[cur];
  document.getElementById('premise').textContent=s.premise;
  document.getElementById('title').textContent=s.title;
  document.getElementById('ident').textContent='story-'+s.id;
  document.getElementById('prose').innerHTML=s.html;
  const a=state[s.id]||{};
  document.querySelectorAll('#judge [data-k]').forEach(el=>{
    const k=el.dataset.k;
    if(el.type==='radio'){el.checked=a[k]===el.value}
    else if(el.type==='range'){el.value=a[k]||el.getAttribute('value');el.nextElementSibling.textContent=el.value}
    else{el.value=a[k]||''}
  });
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===FLAT.length-1;
  save();window.scrollTo({top:0,behavior:'instant'});
}

document.getElementById('judge').addEventListener('input',e=>{
  const el=e.target,k=el.dataset.k;if(!k)return;
  const s=FLAT[cur];state[s.id]=state[s.id]||{};
  state[s.id][k]=el.type==='radio'?(el.checked?el.value:state[s.id][k]):el.value;
  if(el.type==='range')el.nextElementSibling.textContent=el.value;
  save();
});
document.getElementById('prev').onclick=()=>{if(cur>0){cur--;render()}};
document.getElementById('next').onclick=()=>{if(cur<FLAT.length-1){cur++;render()}};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type==='text')return;
  if(e.key===']')document.getElementById('next').click();
  if(e.key==='[')document.getElementById('prev').click();
});
document.getElementById('export').onclick=()=>{
  let md='# Judge answers\n\n';
  FLAT.forEach(s=>{const a=state[s.id]||{};
    md+=`## story-${s.id} (${s.premise})\n`;
    md+=`1 TEACH: ${a.teach||''}\n2 CONFIDENCE: ${a.conf||''}\n`;
    md+=`3 PREACHINESS: ${a.preach||''} — ${a.preachwhere||''}\n`;
    md+=`4 ENDING: ${a.ending||''}\n5 NOVEL: ${a.novel||''}\n6 GRADE: ${a.grade||''}\n\n`;});
  const b=new Blob([md],{type:'text/markdown'});
  const u=URL.createObjectURL(b),el=document.createElement('a');
  el.href=u;el.download='judge-answers.md';el.click();URL.revokeObjectURL(u);
};
refreshToc();render();
</script>
