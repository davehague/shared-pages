 for were in houses built in 1926, and the people who owned those houses had inherited furniture. The people who wanted new furniture lived in apartments with fifty-two inches of wall and moved every three years and were not going to hire a truck for eight hundred pounds of walnut.</p>\n<p>He had never once asked. He had gone straight to the wood.</p>\n<p>---</p>\n<p>It sat in the shop that summer under a bedsheet. He'd priced it down to eleven, then nine, and at nine he had to stop, because at nine he was paying for the privilege.</p>\n<p>In August the transmission on the truck went, and the credit line on the wood was still there, and he sold the sideboard to a hotel in Nashville for six thousand dollars because a designer saw a photo of it and needed something with presence for a lobby nook. They put a bud vase on it. They cut a hole in the back for a lamp cord \u2014 he found out from an Instagram photo, the round hole raw and unbanded through his bookmatched panel, and he had to put the phone face-down on the bench and stand there breathing for a while.</p>\n<p>Nell came by in September with two coffees. The bedsheet was still hanging on a nail where he hadn't taken it down.</p>\n<p>\"Sixty-eight hundred,\" she said, when he told her. \"For a year.\"</p>\n<p>\"Six.\" He drank his coffee. \"Six thousand.\"</p>\n<p>She sat on the sawhorse. She'd hired a kid part-time by then, and had a cart at the market, and a small waitlist, and was still, as far as Micah could see, making cutting boards that a good eye would call fine but not remarkable.</p>\n<p>\"You want to know what the difference was?\" he said. \"Genuinely. Not being a prick. I want you to say it.\"</p>\n<p>\"You already know.\"</p>\n<p>\"Say it anyway.\"</p>\n<p>Nell blew on her coffee. \"You built the best thing in the room and then went looking for somebody who wanted it. I found people who wanted a thing and then built it.\" She shrugged. \"Mine's uglier. Mine sells. That's not a talent gap, Micah, you're twice the woodworker I am. It's just the order of operations.\"</p>\n<p>\"Ask first.\"</p>\n<p>\"Ask first,\" she said. \"Then build.\"</p>\n<p>---</p>\n<p>He started carrying a composition notebook. It felt stupid for about six weeks.</p>\n<p>At the market, at job walks, at the counter of the hardware store, he asked people what they didn't have room for. He heard the same sentence maybe forty times in two months \u2014 <em>there's nowhere to put anything, and I can't have something huge</em> \u2014 and by November he had a design for a wall-hung cabinet, thirty-six inches, a foot deep, that hung on a French cleat one person could install with a level and a drill. Rental-safe. Movable. Two doors, a drawer, one shelf.</p>\n<p>The first one was rough. He knew it was rough \u2014 the door gap was a hair uneven, and he'd used shop-grade cherry because he wasn't going to put claro walnut into a prototype. He hung it at Nell's cart on a piece of plywood wall with a price on it and a card that said <em>tell me what's wrong with this.</em></p>\n<p>People told him. A lot of them. It needed to be deeper for plates. Could the drawer be lockable, for meds. Somebody wanted it in white. Somebody wanted two.</p>\n<p>He built eleven of them that winter, none of them as good as the sideboard, all of them sold before they were finished, and he wrote it on the inside of the notebook cover so he'd stop having to relearn it, in a hand almost as bad as Nell's:</p>\n<p><em>Find out if they want it. Then pour yourself into it. Not the other way around.</em></p>"}, {"id": "UM6", "title": "The Cabinet", "html": "<p>Ruth came by the workshop on a Tuesday in March, the kind of gray afternoon that made the shop lights look like the only warm place in the county. She stood in the doorway watching Micah sand the inside of a drawer, and she didn't speak for a long time, which was how Ruth said hello.</p>\n<p>She'd been his teacher at the craft school in Penland, then his landlord for two years, then something closer to a friend \u2014 though Ruth didn't use that word for anyone who still owed her money. She was seventy-one and still built a chair or two a year, chairs that looked like they'd grown that way, like the wood had decided to become a chair and Ruth had simply helped. She had hands like knotted rope.</p>\n<p>Micah set down the sandpaper. \"You want coffee?\"</p>\n<p>\"I want to see what you've been doing in here for six months.\"</p>\n<p>He led her past the lathe and the bench to the back corner where the cabinet stood under a drop cloth. He pulled the cloth off with the care of someone revealing a child, and Ruth looked at it for a full minute without moving. It was a credenza in black walnut, the doors inlaid with a marquetry landscape \u2014 a river valley, the grain of the wood following the actual contours of the hills, each piece of veneer cut and fitted so the seams disappeared unless you pressed your face to the surface. The joinery was hand-cut dovetails, so tight they looked poured into place. The finish was seventeen coats of hand-rubbed shellac. It was, by any honest measure, the best thing Micah had ever made, and probably the best thing anyone in the county had made in a decade.</p>\n<p>Ruth touched one of the doors with a single fingertip. Then she pulled her hand back.</p>\n<p>\"Who's it for?\" she said.</p>\n<p>\"Nobody yet. I'm going to show it at the spring show.\"</p>\n<p>\"Micah.\"</p>\n<p>\"What?\"</p>\n<p>She sat down on a sawbuck \u2014 something she'd taught him never to do, because sawbucks were for wood, not for sitting \u2014 and she looked at him with the expression he remembered from the semester he'd spent six weeks carving a spoon when the assignment was a stool.</p>\n<p>\"Find out whether anyone wants the thing before you pour yourself into building it,\" Ruth said. \"That's not a critique of your work. Your work is extraordinary. It's a critique of your method. You've spent half a year on a piece that has no buyer, no commission, no request. You're building a cathedral and you haven't checked if anyone goes to church.\"</p>\n<p>\"I don't build to order,\" Micah said. \"The work speaks for itself.\"</p>\n<p>\"The work always speaks for itself,\" Ruth said. \"The question is whether anyone's listening.\"</p>\n<p>She left without coffee. Micah put the drop cloth back on the cabinet and went back to sanding the drawer.</p>\n<p>---</p>\n<p>His sister Nell worked out of a converted garage two miles down the road. They'd gone to the same craft school, a year apart, and had come back to the same county and set up separate shops, which people found either charming or strange depending on how well they knew the family. Nell made small things: benches from reclaimed oak, side tables from slabs of ash with the bark still on, shelves from construction-site scrap. She finished them quick and rough \u2014 tung oil, a single pass with the sander, visible tool marks left in \u2014 and she posted photos of each one on her phone the day she finished, sometimes the same day she started.</p>\n<p>Micah had watched this with something he was not proud to call contempt. The work was fine. It was honestly fine. Nell had good hands and a decent eye. But the benches wobbled if you didn't shim the legs. The tables had splits she'd filled with colored epoxy, which Micah considered a confession of failure dressed up as a design choice. And she showed everything early \u2014 before the finish cured, before the wood had settled, before she could possibly know if the piece would still be square in a month. She showed the world her rough drafts.</p>\n<p>And the world kept buying them.</p>\n<p>She sold the benches at the farmers' market for a hundred and twenty dollars. People put them on their porches. She posted a photo of a side table on a Tuesday and by Friday it was in someone's living room in Asheville. A restaurant in Boone commissioned six benches for their waiting area after one of the owners saw a photo Nell had posted of a bench she'd made from a barn beam. The benches weren't perfect. One of them had a leg that was a quarter inch short, which Nell had fixed by gluing a felt pad to the bottom and calling it a day. The restaurant owner didn't notice or didn't care.</p>\n<p>Micah visited Nell's shop in October. She was working on a stool \u2014 the third version of a design she'd started in August. The first version had been too tall, so she'd cut it down and sold it to a woman who wanted a plant stand. The second had a seat that was too narrow, so she'd widened the design and the original went to her neighbor as a gift. The third one was just right. She knew this because the woman who'd bought the first one as a plant stand had asked if Nell could make her a matching one for sitting.</p>\n<p>\"You're just making the same thing over and over,\" Micah said, not unkindly. He was trying not to be unkind.</p>\n<p>\"I'm making the thing people keep asking for,\" Nell said. She was sanding the seat with a block, standing in a circle of pine shavings. \"That's different.\"</p>\n<p>\"Where's the craft in it?\"</p>\n<p>Nell looked up. There was sawdust in her hair. She was thirty, two years younger than Micah, and she looked genuinely puzzled. \"The craft is in making it better each time. The first one was okay. This one's good. The next one might be great.\"</p>\n<p>\"The first one should be great.\"</p>\n<p>\"Why?\"</p>\n<p>This stopped him. He didn't have an answer that didn't sound like a manifesto, so he said nothing, and Nell went back to sanding.</p>\n<p>---</p>\n<p>He finished the cabinet in February, eleven months after he'd started. The last coat of shellac had cured for two weeks. He rubbed it down with 0000 steel wool and wax, and the surface was so deep it looked like you could put your hand through it. He loaded it into the bed of his truck with moving blankets and drove it to the spring craft show in Asheville, where he'd been given a corner booth because he'd shown there three years running and the organizers knew his work.</p>\n<p>He set the cabinet against the back wall of the booth and stood back. People walked by. They slowed. Several stopped and touched the surface. A woman leaned in close to study the marquetry and said, \"Oh my God,\" to whoever was with her on the other end of the phone she was holding. A man in a sport coat examined the dovetails for five minutes and asked Micah what kind of saw he'd used for the pins.</p>\n<p>Nobody bought it.</p>\n<p>The price was nine thousand dollars, which Micah knew was less than the work was worth and more than most people at a craft show were prepared to spend. But the issue wasn't just the price. The issue was that the cabinet was large \u2014 six feet long, three feet deep \u2014 and nobody had come to the show looking for a six-foot walnut credenza with marquetry doors. They'd come looking for cutting boards, jewelry boxes, maybe a chair. Several people asked if he made anything smaller. One woman asked if he did commission work, and he said yes, but she described a dining table and he could see that what she wanted was not what he made. What she wanted was a table, not a statement. He felt himself wanting to explain the difference and then felt ashamed of the impulse.</p>\n<p>On the second day of the show, Nell appeared. She was supposed to be at her own booth \u2014 she'd gotten a spot for the first time this year, selling benches and side tables and a set of shelves \u2014 but she'd sold everything by noon on Saturday and come to check on Micah.</p>\n<p>She stood in front of the cabinet for a long time. She didn't touch it. Finally she said, \"It's the most beautiful thing I've ever seen.\"</p>\n<p>\"Thanks.\"</p>\n<p>\"Has anyone \u2014\"</p>\n<p>\"No.\"</p>\n<p>She was quiet. She didn't say I told you so because she'd never told him anything. She'd just made her rough benches and asked people what they thought and made better benches. She looked at him and her face was so open and sorry that he had to look away.</p>\n<p>\"I have to go back to my booth,\" she said. \"I have nothing to sell but I'm supposed to be there.\"</p>\n<p>\"Nell.\"</p>\n<p>She stopped.</p>\n<p>\"It's not about the work,\" he said. \"I know that now. The work is good.\"</p>\n<p>\"I know it is,\" she said.</p>\n<p>\"It's that nobody asked for it.\"</p>\n<p>She nodded. She didn't say anything else. She left and he stood alone in the booth with the cabinet, which was the most beautiful thing anyone in that building had made, and which was going home in the back of his truck.</p>\n<p>---</p>\n<p>He lost the workshop in May. Not because of the cabinet specifically, but because of the cabinet as a method \u2014 eleven months of overhead, wood, finish, and time that produced one unsold object. The lease on the shop was eight hundred a month. He'd been paying it with commissions that had dried up because he'd stopped taking commissions to focus on the cabinet. His savings had gone to walnut and shellac. The landlord, who was not Ruth but a man named Dale who owned the building, gave him until the end of the month.</p>\n<p>He moved the cabinet and his tools into Nell's garage. She cleared space without being asked, pushing her bench blanks and her sander and her jar of tung oil to one side. They worked in silence for an afternoon, and when the tools were arranged and the cabinet was covered again, Micah sat on an upturned bucket and put his face in his hands.</p>\n<p>Nell sat beside him. She didn't touch him. She'd always been someone who gave you the exact amount of space you needed, which Micah had once interpreted as distance and now understood as attention.</p>\n<p>\"Ruth told me something once,\" he said. \"I didn't listen.\"</p>\n<p>\"I know. She told me too.\"</p>\n<p>He looked at her. \"When?\"</p>\n<p>\"Two years ago. When I started posting photos of the benches and you told me I was cheapening the craft. She called me and said, 'Don't let your brother's perfectionism become your standard. Find out if anyone wants the thing first. Then make it better.'\"</p>\n<p>Micah almost laughed. It came out wrong, more like a sound of pain. \"So you were \u2014 what \u2014 doing what she said.\"</p>\n<p>\"I was doing what made sense. People told me what they wanted. I made it. I made it better. That's all.\"</p>\n<p>\"That's all,\" he repeated.</p>\n<p>\"She was right, Micah. She was right about you and she was right about me. The difference is I listened because I didn't think I had anything to lose.\"</p>\n<p>He thought about that. The cabinet sat under its cloth, ten months of his life, the best work he would do for years, maybe ever, and no one had asked for it and no one would. It was a masterpiece without a home. He could feel its weight in the room like a stone.</p>\n<p>\"What do I do now?\" he said.</p>\n<p>Nell stood up. She pulled a piece of paper off the workbench \u2014 a sketch, rough, a dining table with simple legs and a breadboard end. \"The woman from the show. The one who wanted a dining table. She called me. I told her you made tables. She wants to talk.\"</p>\n<p>He stared at the sketch. It was basic. It was unambitious. It was the kind of thing he would have turned down a year ago.</p>\n<p>\"She wants a table,\" he said.</p>\n<p>\"She wants a table,\" Nell said. \"She doesn't know she wants a masterpiece. She might want one if you make it. But she's asking for a table first.\"</p>\n<p>He picked up the sketch. The lines were wobbly. Nell had drawn it in two minutes, probably while talking on the phone. It was the rough draft of a rough draft.</p>\n<p>\"Find out whether anyone wants the thing,\" he said.</p>\n<p>\"Before you pour yourself into building it,\" Nell finished. \"Then pour yourself in. All the way. But pour it into something someone's holding out their hands for.\"</p>\n<p>He folded the sketch and put it in his pocket. The cabinet stood in the corner under its cloth, perfect and silent, the thing nobody had asked for. He left it there. He picked up a pencil and a piece of clean paper, and he started drawing the table, beginning not with what he wanted to make but with what someone wanted to have.</p>"}, {"id": "AE6", "title": "The Thousand-Hour Chair", "html": "<p>Micah Ostrander had been sanding the same curve for eleven days.</p>\n<p>It was the transition where the crest rail met the rear leg \u2014 one continuous run of white oak, no joint, the grain bending through the corner the way water bends around a stone. He'd steam-bent it. He'd broken nine before the tenth held. Now he worked it with a cabinet scraper he'd sharpened that morning, taking off shavings so thin they curled up and hung in the light like something exhaled.</p>\n<p>The shop smelled of oak dust and hide glue. Through the window over the bench, February in Ohio: gray field, gray fence, a hawk on a post that had been there since Christmas.</p>\n<p>His phone lit up on the windowsill. <em>Nessa</em>. He let it go.</p>\n<p>He was forty-one. He had eleven thousand dollars left, which was what remained of the money from selling his father's tractor, and he had until roughly May before that stopped being an amount of money and started being a countdown. He'd told himself in April of last year: one chair. Not a line, not a collection. One chair so good that when people saw it they would understand, immediately and without argument, what he could do.</p>\n<p>He turned the chair on the bench and started on the other side.</p>\n<p>---</p>\n<p>Nessa's garage was heated by a kerosene salamander that made everything smell faintly like an airport. She had a band saw with a wandering blade, a chop saw missing its guard, and a folding table covered in what she called inventory.</p>\n<p>\"Sit,\" she said. \"Not on that one, it's still wet.\"</p>\n<p>Micah sat on a milk crate. He'd driven over because she'd texted six times.</p>\n<p>\"Okay.\" She held up a small wooden object. \"Spoon.\"</p>\n<p>It was a spoon. The bowl was a little lopsided. There was a tool mark on the underside she hadn't chased out.</p>\n<p>\"It's cherry,\" he said.</p>\n<p>\"It's whatever was in the scrap bin.\" She turned it over in her hands, pleased with it in a way he found almost physically difficult to watch. \"I made forty. I put them on the table at the winter market next to Deb's honey. Eighteen dollars. They went in ninety minutes.\"</p>\n<p>\"Eighteen dollars.\"</p>\n<p>\"I know. I should have said twenty-two.\" She set it down and picked up another. \"This one's maple. A woman bought the cherry one and came back and asked if I made left-handed ones, because she's left-handed and the bowl was canted wrong for her. So.\" She showed him: the same spoon, mirrored. \"Now I make left-handed ones. Twelve of them last month.\"</p>\n<p>Micah picked up the maple spoon. The handle was too thick where it met the bowl. It would fatigue the hand over a long stir. He put it down without saying so.</p>\n<p>\"How's the chair,\" Nessa said.</p>\n<p>\"Close.\"</p>\n<p>\"You said close in October.\"</p>\n<p>\"It was close in October.\" He stood up. \"It's closer now.\"</p>\n<p>She walked him out. At the door she said, \"There's a table at the spring market if you want one. Fifty bucks, first weekend in April.\"</p>\n<p>\"I'm not making spoons, Ness.\"</p>\n<p>\"I didn't say make spoons.\"</p>\n<p>He drove home through the salt haze with the heater roaring and did not think about the table.</p>\n<p>---</p>\n<p>He finished the chair on the ninth of April.</p>\n<p>The last thing was the seat \u2014 a saddle he'd hollowed with an adze and then a travisher, working from a plaster cast he'd made of his own body sitting in wet sand at Alum Creek in September. The dish of it fit a person the way a good hand fits another hand. Eight coats of oil, wet-sanded between four and five. When he was done he stood in the shop with the lights off except the one over the bench, and the chair sat there in the cone of light, and Micah Ostrander cried a little, quietly, standing up, the way you do when a thing you doubted for a year turns out to be true.</p>\n<p>It was the best object he had ever made. He knew it the way you know your own name.</p>\n<p>He photographed it against a canvas drop. He wrote to the gallery in Columbus that had shown his father's work once, in 1994, and to the design fair in Chicago, and to a woman in Brooklyn whose shop sold four-thousand-dollar stools to people who owned two apartments. He priced it at eleven thousand dollars, which was one year, which was what it was.</p>\n<p>The gallery didn't answer for six weeks and then did: <em>lovely work, we're programmed through 2027.</em></p>\n<p>Chicago wanted a booth fee of $6,200 plus travel, plus a second piece minimum.</p>\n<p>Brooklyn answered in four days. <em>Stunning craftsmanship. Honestly though \u2014 our buyers are looking for pieces around $900\u2013$1,500 that photograph well in small apartments. Do you make anything smaller?</em></p>\n<p>He read it standing at the window over the bench. The hawk was gone. The field had gone green without his noticing.</p>\n<p>He wrote back: <em>I don't. Thank you.</em></p>\n<p>---</p>\n<p>He sold it in August, in the parking lot of a Cracker Barrel outside Dayton, to a man named Ron who had found the listing on Facebook Marketplace after it had been up for eleven weeks and Micah had dropped the price four times.</p>\n<p>Ron was decent about it. He was maybe sixty, in a Bengals windbreaker, and he walked around the chair twice with his hands in his pockets and said, \"That's real nice. My wife saw the picture.\"</p>\n<p>\"It's white oak. That corner's one piece \u2014 it's bent, not joined.\"</p>\n<p>\"Huh.\" Ron crouched, looked, stood back up. \"For the back porch, mostly. She wanted something for by the door where you take your boots off.\"</p>\n<p>Fourteen hundred dollars. Cash, in a bank envelope, counted out on the tailgate in the heat with the smell of pancake syrup coming off the building. Micah helped him lift it into the bed of the truck and watched Ron throw a moving blanket over it and cinch a ratchet strap across the crest rail \u2014 across the curve, the one that broke nine times \u2014 and pull it tight.</p>\n<p>He didn't say anything about the strap. He said, \"Keep it out of standing water and it'll outlive us both.\"</p>\n<p>\"Will do, chief.\"</p>\n<p>He sat in his truck in the parking lot for a while after Ron pulled out. Then he drove to the storage place on 42 and paid two months for a ten-by-ten unit and went home and started moving the shop into it, because the house was going to the bank in October and there was no version of the arithmetic where it didn't.</p>\n<p>---</p>\n<p>Nessa came on a Saturday with her brother's trailer.</p>\n<p>They loaded the bench first, then the lathe, then the tool chest his grandfather had built and his father had ruined the till of. It was ninety-one degrees. They drank warm Gatorade sitting on the trailer gate with their legs hanging down.</p>\n<p>\"Do you want to know what I sold this year,\" she said.</p>\n<p>\"Not really.\"</p>\n<p>\"Nineteen thousand and change. Spoons, cutting boards, and those little stools.\" She wiped her face with the hem of her shirt. \"The stools came from a guy at the market in June who asked if I made anything for a kid to stand on at the sink. I'd never thought about it. I made him one out of pine in an afternoon. It's ugly. He came back with two friends.\"</p>\n<p>Micah looked at the field.</p>\n<p>\"I made a coffee table in 2019,\" Nessa said. \"Walnut. Book-matched top, breadboard ends, seven months. It's in my mom's basement. Nobody's ever going to buy it.\" She drank. \"I stopped guessing what people want. I just make a rough one and put it in front of somebody and let them tell me. Turns out you can find that out for about six dollars and a weekend, and I was spending years to learn the same thing.\"</p>\n<p>She said it and then she stopped, and knocked the ice down in her cup, and that was all.</p>\n<p>The cicadas went up in the hedgerow and wound back down.</p>\n<p>\"The strap,\" Micah said. \"He put a ratchet strap right across the bend.\"</p>\n<p>\"Yeah.\"</p>\n<p>\"It'll be fine. It's oak.\"</p>\n<p>\"It'll be fine.\"</p>\n<p>They loaded the rest of it as the light went orange, and when the trailer was full Micah went back into the empty shop for the last of it and came out with the drop-leaf of scrap \u2014 offcuts, mostly, white oak in short lengths, the failed bends, curved and useless for anything flat.</p>\n<p>He stood there holding an armful of it in the doorway.</p>\n<p>\"Ness.\"</p>\n<p>\"Yeah.\"</p>\n<p>\"That table in April. Is there one in October too?\"</p>\n<p>She was tying down the lathe. She didn't look up. \"First Saturday. Thirty-five bucks in the fall.\"</p>\n<p>Micah set the scrap down on the gravel and squatted over it and started sorting \u2014 this curve, that curve \u2014 pulling out six pieces where the grain ran the long way through the bend. They'd make backrests. Small ones. Rough ones, three or four hours apiece, the tool marks left where they fell.</p>\n<p>\"Put my name down,\" he said. \"I'll bring six. I want to see which ones they pick up.\"</p>"}]}, {"premise": "The Evenings", "stories": [{"id": "KO9", "title": "The Weather Inside", "html": "<p>The Tuesday meltdown began with a spoon.</p>\n<p>Theo had eaten three bites of the pasta when the spoon hit the floor. Ada picked it up, wiped it, set it back beside his bowl. He pushed it away with the back of his hand. She offered a different spoon \u2014 the blue one, his favorite from last week. He shoved the bowl itself, pasta slopping over the rim onto the placemat, and the sound he made was not a word. It was the sound of a building coming down.</p>\n<p>Ren came in from the kitchen with a dish towel. \"Hey, bud. Let's just \u2014\"</p>\n<p>\"I don't WANT it!\" Theo's face was the color of a bruise. He kicked the table leg hard enough to rattle the water glasses.</p>\n<p>Ada reached for him and he hit her hand. She pulled back, steadied her face, tried the calm voice she'd been practicing since the parenting book. \"I see you're frustrated. When you're ready to use your words \u2014\"</p>\n<p>The screaming that followed was operatic. Theo slid off the chair, lay on the hardwood, and thrashed. His socks made sliding streaks on the floor. The dog retreated under the dining room credenza.</p>\n<p>Ren sat down across from him and waited. Ada sat down. They waited together. The pasta cooled. The clock over the stove ticked through four minutes of sustained wailing before Theo's body began to tire of it and the sound thinned into hitching sobs.</p>\n<p>This was, by their count, the fourth evening that week.</p>\n<p>They had taken things. They had used the sticker chart, the time-out chair, the gentle-scripted language. They had held the line and held it and held it. Theo was not improving. He was, if anything, getting worse \u2014 the meltdowns longer, the triggers smaller, the recovery slower.</p>\n<p>That night, after they'd carried his limp, tear-smeared body to bed, Ada sat on the kitchen floor with her back against the cabinet and said, \"We have to stop.\"</p>\n<p>\"Stop what?\"</p>\n<p>\"All of it. The fixing. The \u2014\" She gestured at the fridge, where the sticker chart hung, half its squares empty, its columns a record of failure. \"We keep trying to change him. What if we can't?\"</p>\n<p>Ren slid down beside her. \"So what, we just let him \u2014\"</p>\n<p>\"What if we changed the things around him instead? Not him. The things.\"</p>\n<p>---</p>\n<p>They started with the table.</p>\n<p>Wednesday, Ada set out plates but no food. She put a low bench where Theo's chair had been \u2014 a bench with no back, close to the floor, where his feet could rest flat. She put small portions on a tray on the counter: pasta in one ramekin, green beans in another, a few strawberries. No big plate. No arrangement. No expectation.</p>\n<p>Theo came in, looked at the bench, looked at the counter. He sat on the bench. He ate two strawberries and a piece of pasta. He left the rest. Nobody said anything. Ren and Ada ate at the table, and Theo sat beside them at his low perch, and the dog came out from under the credenza and lay against the wall.</p>\n<p>It wasn't peace, exactly. But it was quieter than any dinner in a month.</p>\n<p>Thursday, Ren changed the bath. He'd been running it full and hot, the way his mother had \u2014 a deep tub, bubbles, toys. Theo fought it every night, fought the water, fought the soap, fought the towel. Ren ran it shallow, warm, and still. No bubbles. One toy \u2014 the seal, not the whole bin. He didn't announce bathtime. He just went in and started the water, and when Theo wandered in, the tub was already there, quiet, and Ren was sitting on the bathmat reading his phone.</p>\n<p>Theo got in on his own. He sat in the shallow water and held the seal. Ren washed his back with one hand while pretending to scroll. It took four minutes.</p>\n<p>Ada watched from the hallway. She didn't say anything. She pressed her hand to her mouth and watched.</p>\n<p>---</p>\n<p>Frank arrived Saturday for his monthly visit \u2014 a large man, loud in a way that filled rooms, with opinions that arrived before his luggage. He had raised four children in a three-bedroom house in Queens and all four of them had turned out fine, which he mentioned with the regularity of a man checking a watch.</p>\n<p>He watched the Saturday dinner \u2014 the bench, the tray, the small portions \u2014 and said nothing until Theo left the table. Then: \"He barely ate.\"</p>\n<p>\"He ate,\" Ada said.</p>\n<p>\"He ate a strawberry.\"</p>\n<p>\"He'll eat more when he's hungry.\"</p>\n<p>Frank looked at the tray, the ramekins, the bench. \"What is all this?\"</p>\n<p>\"We're trying something.\"</p>\n<p>\"You're catering to him.\" Frank said it the way he said most things \u2014 as a verdict already rendered. \"The world isn't going to arrange itself in ramekins for this kid. He's six. He sits at a table, he eats what's in front of him, he says thank you. That's the deal.\"</p>\n<p>\"Dad.\"</p>\n<p>\"I'm telling you what I know. You give a child an inch of accommodation, he takes a mile of it. You think he won't notice that you've turned dinner into a buffet? He notices. They all notice.\"</p>\n<p>Ada set down the sponge she'd been using to wipe the counter. \"We're not arguing about this tonight.\"</p>\n<p>\"Good,\" Frank said. \"Because I'm right.\"</p>\n<p>---</p>\n<p>Sunday, Frank offered to handle the evening.</p>\n<p>\"Let me do dinner,\" he said, already pulling pans from the cabinet. \"The way it's done. A meal at a table, with a chair, and he eats what we eat. He's not going to starve.\"</p>\n<p>Ada and Ren looked at each other. Something passed between them \u2014 not agreement exactly, but the exhaustion of two people who knew this argument would keep coming until it was settled.</p>\n<p>\"Fine,\" Ada said. \"Do it your way.\"</p>\n<p>Frank made chicken. He made rice. He put out a green salad. He set Theo's place at the table with a full plate and a glass of milk and a napkin folded into a square. He pulled out the chair.</p>\n<p>\"Come on, Theo. Dinner.\"</p>\n<p>Theo came in and saw the table. His face did something Ren recognized \u2014 a tightening around the eyes, the first tremor of a system overloading.</p>\n<p>\"Sit down,\" Frank said. He pointed to the chair. \"We eat together. That's how it works.\"</p>\n<p>Theo sat. He looked at the plate. He looked at the full glass of milk, which he had never been given at dinner because he always knocked it over. He looked at the napkin, which he didn't know what to do with.</p>\n<p>\"Eat your chicken,\" Frank said.</p>\n<p>\"I don't want chicken.\"</p>\n<p>\"Chicken's what's for dinner. There's nothing else.\"</p>\n<p>Theo's hands found the table edge. His knuckles went white. Ren could see it starting \u2014 the pressure building in the boy's chest like steam in a pipe.</p>\n<p>\"Take a bite,\" Frank said. \"One bite. Then you can have a strawberry.\"</p>\n<p>\"I don't \u2014\"</p>\n<p>\"One bite, Theo.\"</p>\n<p>The glass went first. Theo's elbow caught it \u2014 accidentally, then deliberately \u2014 and milk spread across the table in a white sheet that reached the napkins, the salad, the rice. Frank pushed his chair back. \"Hey \u2014\"</p>\n<p>Theo was already gone. He was on the floor, under the table, and the sound came out of him like something ripped \u2014 not crying, not screaming, but a raw, airless keening that went on and on. His body jackknifed against the hardwood. His head hit the table leg.</p>\n<p>Frank reached for him. \"Theo. Theo, stop it. That's enough.\"</p>\n<p>The touch made it worse. Theo shrieked and clawed at Frank's hand, and Frank pulled back with a scratch welling on his wrist, and for a moment the large man stood in his daughter's kitchen with milk pooling at his feet and a six-year-old writhing under the table and nothing in his forty years of child-rearing that could reach this.</p>\n<p>Ada knelt by the table. She didn't reach for Theo. She reached for the tablecloth and pulled it slowly off the table, taking the plates and the soaked napkins with it, clearing the surface. She reached over and turned off the overhead light so only the stove light remained. She opened the window above the sink. The evening air came in \u2014 cool, smelling of cut grass \u2014 and the kitchen went quiet and dim.</p>\n<p>She sat on the floor near Theo, not touching him. Just near him. Ren turned off the stove fan. The hum died. The room got still.</p>\n<p>Under the table, Theo's breathing changed. Not right away. But the keening thinned, and the thrashing slowed, and after a while he was just lying there, breathing, his face on the cool wood.</p>\n<p>Nobody spoke. Frank stood against the counter, arms folded, watching. His jaw was set, but his eyes were doing something his mouth wouldn't \u2014 they were seeing.</p>\n<p>---</p>\n<p>The next evening, Ada set the bench out again and put three ramekins on the counter. She turned off the overhead light and put a lamp on the sideboard. Ren opened the window before they sat down. The stove fan stayed off.</p>\n<p>Theo came in, sat on the bench, ate some rice and a strawberry. He said, \"Can I have the seal?\"</p>\n<p>\"Bathtime's after,\" Ren said.</p>\n<p>\"Okay,\" Theo said.</p>\n<p>Frank was on the couch in the living room, within earshot. He said nothing.</p>\n<p>The following night, Ada reduced the choices further \u2014 no more \"what do you want to drink?\" Just water, already poured, in a small cup that fit his hand. No questions about the bath. Ren simply filled it, shallow and warm, and left the door open, and Theo drifted in when he drifted in. They read one book, not three. They turned off the hallway light so the path to his room was lit only by the nightlight, a low orange glow on the baseboard.</p>\n<p>He went to bed without a meltdown. Not without fuss \u2014 he called out twice, asked for water, asked for the dog \u2014 but without the shattering. Without the sound that had become, over months, the weather of their evenings.</p>\n<p>By Thursday, there were two evenings in a row with no meltdown at all. Theo ate a full ramekin of chicken at the bench. He got in the bath and stayed in for ten minutes, floating the seal on the still water. He went to bed and called out once, then slept.</p>\n<p>Frank watched. He watched from the couch, from the doorway, from the kitchen. He watched his daughter dim the lights and his son-in-law open the window and his grandson settle, slowly, like something had been taken off him that he couldn't name.</p>\n<p>On Friday morning, Frank was leaving. He stood in the front hall with his bag, and Ada walked him out.</p>\n<p>\"Ad,\" he said. He had his hand on the door. He looked at her and then looked at the door and then at her again. \"It's not how I would have done it.\"</p>\n<p>\"I know.\"</p>\n<p>\"He's going to have to learn to sit at a table eventually.\"</p>\n<p>\"Maybe,\" Ada said. \"Or maybe he'll learn at his own table, the way he needs to.\"</p>\n<p>Frank opened his mouth, then closed it. He picked up his bag and walked to the car. At the driver's window, he turned back. \"The bench was a good idea,\" he said. Then he got in and pulled away before she could answer.</p>\n<p>---</p>\n<p>That night, Theo came to the kitchen. The bench was by the table, the ramekins were on the counter, the lamp was on the sideboard, the window was open. The evening air came through the screen, carrying the smell of the neighbor's jasmine. The dog was on his rug. Ren was slicing an apple. Ada was at the stove, not cooking much \u2014 just warming something, the burner on low.</p>\n<p>Theo sat on his bench. He picked up a piece of apple from the cutting board and ate it. He held the seal under his arm. The kitchen was dim and warm and quiet, and the window let in the dark, and the boy sat where he could sit and ate what he could eat, and nobody asked him to be anything else.</p>"}, {"id": "UC2", "title": "Weather He Could Live In", "html": "<p>The fork hit the floor for the third time. Theo's face was already going \u2014 that particular dissolution that started at the mouth and climbed, the chin crumpling, the eyes flooding, the breath catching in his chest like something had snagged on a nail inside him.</p>\n<p>\"It's the wrong fork,\" he said.</p>\n<p>It was not the wrong fork. It was the same fork he'd used every night this week, a small metal fork with blue plastic handles, but Ada could see that in this moment it was the wrong fork, that it had become cosmically, irrevocably wrong, and that no amount of pointing at the calendar on the refrigerator where Theo had earned three stickers for \"using my utensils without complaining\" was going to change that.</p>\n<p>\"Sweetheart,\" Ren said, in the voice he used for these moments, low and steady, the therapist's voice, the voice that said <em>I am not escalated and therefore you should not be escalated either.</em> \"We talked about this. If you throw your fork, dinner is over.\"</p>\n<p>Theo threw his fork.</p>\n<p>It was the fourth meltdown that week. It was Tuesday.</p>\n<p>---</p>\n<p>Frank came on Saturdays. He drove up from Delaware with a bag of apples from the farm stand and the newspaper he'd already read, which he liked to do the crossword from with Theo \u2014 the easy one, the one Theo couldn't actually do, but liked to watch Frank's pencil move, liked to call out letters that were almost always wrong and sometimes, thrillingly, right.</p>\n<p>Frank had raised four children. Two of them were Ada. He had firm ideas about children, which he delivered without heat, the way he delivered everything \u2014 as fact, the way you'd say the turn signal is broken or the tomatoes need staking.</p>\n<p>\"He's six,\" Frank said, standing in the kitchen while Ada loaded the dishwasher and Ren sat on the back porch with his head in his hands. \"Six-year-olds don't like dinner. Six-year-olds don't like baths. You make them do it anyway and they learn that's how the world is. The world doesn't rearrange itself because you're upset.\"</p>\n<p>\"He's not just upset, Dad. He's \u2014\"</p>\n<p>\"He's bright and he's stubborn and he's figured out that the louder he gets, the more you rearrange.\" Frank set the bag of apples on the counter. \"You're good parents. You're too good. You're so busy being good that you forgot you're the ones in charge.\"</p>\n<p>It was not a cruel thing, the way he said it. It was the thing he believed, and Ada could feel the weight of it \u2014 the weight of a man who had raised four children who ate what was put in front of them and went to bed when told and turned into adults who called him on Sundays. There was a whole lived architecture behind it. She could not dismiss it with the word <em>neurodivergent</em> that the occupational therapist had given them like a key that didn't quite fit the lock.</p>\n<p>\"Maybe,\" she said.</p>\n<p>Frank squeezed her shoulder. \"The apples are Honeycrisp. He'll eat those.\"</p>\n<p>---</p>\n<p>The fight happened on a Thursday, not about Theo exactly, but about everything that had become Theo.</p>\n<p>\"I can't do it anymore,\" Ada said. She was sitting on the edge of their bed and she was not crying, which was worse than crying. \"I can't sit across from him at dinner one more time and watch his face do that thing and know it's coming and not be able to stop it.\"</p>\n<p>\"So we keep the routine. We hold the line.\"</p>\n<p>\"Holding the line is making it worse, Ren.\"</p>\n<p>\"You don't know that.\"</p>\n<p>\"I know he threw up last night. From crying. He threw up, and then he cried because he threw up, and I held him on the bathroom floor and he said <em>I'm bad I'm bad I'm bad</em> and he's six, Ren, he's six years old and he thinks he's bad.\"</p>\n<p>Ren sat next to her on the bed. He put his hands on his knees. He was a man who believed in structure the way Frank believed in firmness, as a moral good, as the thing that kept the world from sliding sideways, and she could see the structure leaving him, the way a building settles \u2014 slowly, then all at once.</p>\n<p>\"What do we do?\" he said.</p>\n<p>\"I don't know. Something else. Anything else.\"</p>\n<p>---</p>\n<p>They started small, not because they were cautious but because they were exhausted.</p>\n<p>They turned off the radio. This was not a decision they made together; it was a Wednesday and Ren reached over and turned it off in the middle of the All Things Considered segment about coastal erosion, and the kitchen went quiet, and Theo looked up from his plate with an expression Ada had never seen \u2014 not peace exactly, but the absence of that vigilance, the scanning-for-threat that lived in his eyebrows every evening.</p>\n<p>He ate four bites of chicken. He did not cry.</p>\n<p>It was not a miracle. Thursday he cried because the chicken was touching the rice. But the quiet \u2014 the actual quiet, the house without voices coming from the corner \u2014 stayed.</p>\n<p>---</p>\n<p>They changed the table. Not the table itself, but what was on it. They took the sticker chart down. They took the schedule down \u2014 the laminated schedule with the velcro pictures: plate, bath, pajamas, teeth, book, bed. They had made it together, Ren with the laminator at the office, Ada with the clip art. It had taken an entire Saturday. It had felt like doing something.</p>\n<p>They put a plain blue tablecloth on the table instead. Nothing on it. No visual instructions, no progress tracked in stars.</p>\n<p>\"What's that for?\" Theo said.</p>\n<p>\"Nothing,\" Ada said. \"I just like blue.\"</p>\n<p>He ran his hand across it. Back and forth. He ate his pasta with his hands and they did not correct him and he did not cry.</p>\n<p>Ren said afterward, in their bedroom, quietly, \"He ate with his hands.\"</p>\n<p>\"I know.\"</p>\n<p>\"That's \u2014\"</p>\n<p>\"I know.\"</p>\n<p>---</p>\n<p>They stopped asking questions.</p>\n<p>This was Ada's, this discovery. She realized, standing in the kitchen doorway one evening watching Theo line up his shoes by the wall \u2014 not the pair he was going to wear, just shoes, lined up, eight of them in a row \u2014 that she asked him questions all night long. <em>Do you want the blue plate or the red plate? Do you want the bath first or the story first? What did you do at school today? Which book? Which pajamas?</em></p>\n<p>Each question was a door he had to walk through. Each question was a demand that he know himself, right now, in the moment, and produce the knowing as language.</p>\n<p>She stopped. She put the blue plate down without asking. She ran the bath without announcing it. She chose the book \u2014 the one about the owl, always the one about the owl \u2014 and set it on his bed.</p>\n<p>He came to the table. He got in the bath. He lay in his bed while she read about the owl, and he did not ask for a different book, and his body was loose on the mattress, his feet against her thigh, warm through the blanket.</p>\n<p>There were nights that didn't work. The night Ren tried to give him chicken again, the night the neighbor's dog barked for forty minutes and Theo came apart so completely that Ada sat in the hallway outside his room and pressed her forehead to the wall and breathed the way the therapist had told her to breathe, in through the nose, out through the mouth, and it did not help. The night Theo hit Ren \u2014 open-handed, hard, across the chest \u2014 and Ren caught his wrist and held it and both of them froze, father and son, in the terrible knowledge of what had just happened.</p>\n<p>Backslides. The occupational therapist had said the word like weather. <em>Expect backslides.</em></p>\n<p>---</p>\n<p>Frank came on a Saturday. The house was different and he noticed.</p>\n<p>\"No chart,\" he said, not as a question.</p>\n<p>\"We took it down,\" Ada said.</p>\n<p>Frank looked at the table. The blue tablecloth. The single plate already set, no choices arrayed. Theo was on the living room floor with his animals, arranging them in a line \u2014 the lion, the tiger, the bear, the horse, the horse, the horse, three horses in a row, then the lion again.</p>\n<p>\"He always did that with the animals?\" Frank said.</p>\n<p>\"Since he was three.\"</p>\n<p>Frank watched. He set the bag of apples on the counter and took off his jacket and he did not say anything for a while, which was not like Frank, who usually had something to say about most things.</p>\n<p>At dinner, Theo ate five bites of the apples, sliced, and two pieces of bread with butter and nothing else. He did not cry. He put his hand on the tablecloth and smoothed it, and Frank watched him do that, and Ada watched Frank watching.</p>\n<p>\"Grandpa,\" Theo said.</p>\n<p>\"Yeah, buddy.\"</p>\n<p>\"Do the crosswart.\"</p>\n<p>\"Crossword,\" Frank said. \"It's crossword.\"</p>\n<p>\"Crosswart.\"</p>\n<p>Frank got the newspaper from his jacket. He sat next to Theo and opened it to the easy puzzle and his pencil moved across the squares. Theo called out letters. <em>G. F. B. Q.</em> Frank wrote down the ones that were right and ignored the ones that weren't, and Theo leaned against his arm, the whole weight of him, and Frank did not move his arm, held it steady as a shelf, and Theo rested there.</p>\n<p>\"You know,\" Frank said to Ada later, at the door, his jacket on, the apples half gone. \"He's not different, you know. He's the same kid.\"</p>\n<p>\"I know, Dad.\"</p>\n<p>\"I mean \u2014 he's still going to have to deal with things. The world isn't a blue tablecloth.\"</p>\n<p>\"I know.\"</p>\n<p>Frank nodded. He looked like he wanted to say more, or like he had said everything already, years ago, with his own children, and was watching someone else arrive at a different place by a different road and could not follow and did not begrudge. He kissed her forehead. He said, \"Call me about Thanksgiving.\"</p>\n<p>---</p>\n<p>Some evenings were still bad. The night Theo dropped his cup of milk and the milk spread across the blue tablecloth and he looked at it and his face began its dissolution and Ada got a towel and put it over the milk and said, \"Done,\" and he looked at the towel, not the milk, and the dissolution paused, held, and then released \u2014 not into calm but into something less than catastrophe, and he ate a piece of bread and went to his room and lay on the floor with his animals and did not come out for an hour and that was all right.</p>\n<p>The night Ren said, \"Bath time,\" and Theo said \"No,\" and Ren said, \"Okay,\" and waited, and twenty minutes later Theo appeared in the bathroom doorway and stood there and Ren turned on the water without speaking and it was all right.</p>\n<p>Not all right like solved. All right like tonight.</p>\n<p>---</p>\n<p>It was a Tuesday. Ren was at the stove. Ada was slicing apples. The house was quiet \u2014 no radio, no television, no schedule on the wall, just the kitchen sounds, the pan and the knife and the clock in the other room that ticked in a way neither of them heard anymore because it had become the sound of the house itself.</p>\n<p>Theo came in from the living room. He was carrying the three horses. He set them on the counter, carefully, in a row, and climbed into his chair. The blue tablecloth was there. The plate was there \u2014 one plate, no alternatives. The apples were there, sliced, and the bread with butter, and a small portion of what Ren was making, set aside, not insisted upon.</p>\n<p>Theo put his hand on the tablecloth. He smoothed it, the way he always did, palm flat, fingers spread, pressing the fabric toward the table's edge. Back and forth. He picked up a piece of apple. He ate it. He picked up another.</p>\n<p>Ren sat down across from him. Ada sat down. No one spoke. The clock ticked. The pan cooled on the stove. Theo ate four pieces of apple and one piece of bread and touched the tablecloth again and looked at the window where the last light was going, the ordinary blue light of an ordinary evening, and outside, a dog barked once and then was quiet.</p>"}, {"id": "UT2", "title": "The House at Half-Light", "html": "<p>At six-fifteen, Theo saw the parsley.</p>\n<p>It was chopped over the potatoes, green and wet-looking under the pendant light. He stopped in the kitchen doorway with one sock half off his heel.</p>\n<p>\u201cWhat\u2019s that?\u201d</p>\n<p>\u201cParsley,\u201d Ren said. \u201cJust parsley.\u201d</p>\n<p>\u201cI don\u2019t want it.\u201d</p>\n<p>\u201cYou don\u2019t have to eat the parsley,\u201d Ada said. She was cutting chicken into small pieces, the way Theo liked, while steam furred the window over the sink.</p>\n<p>\u201cIt\u2019s on the potatoes.\u201d</p>\n<p>\u201cWe can scrape it off.\u201d</p>\n<p>Theo\u2019s hands rose to his ears. \u201cIt\u2019s on them.\u201d</p>\n<p>Ren reached for the serving spoon. \u201cBuddy, look. I\u2019ll get you some from underneath.\u201d</p>\n<p>\u201cNo!\u201d</p>\n<p>The word struck the cabinets. Theo kicked off the dragging sock and threw himself against the doorframe. The dog fled beneath the table. Ada lowered the knife.</p>\n<p>\u201cYou\u2019re all right,\u201d she said. \u201cDinner\u2019s ready. Let\u2019s sit.\u201d</p>\n<p>\u201cI\u2019m not sitting!\u201d</p>\n<p>\u201cYou can sit now or lose your show after bath,\u201d Ren said, and hated, at once, the official sound of his own voice.</p>\n<p>Theo swept his arm across the counter. A glass hit the floor. Ada caught Theo under the arms before he could step into the pieces. He shrieked and bucked against her, his head clipping her chin. Ren moved the chair, the dog, the plate. For twenty-three minutes the kitchen became a place in which every object had to be considered for its capacity to break.</p>\n<p>Later, Theo slept diagonally across his bed, one fist closed around the collar of his pajama shirt. Ada sat on the floor beside him with a bag of frozen peas against her chin.</p>\n<p>Ren stood in the doorway.</p>\n<p>\u201cThe chart lasted three days,\u201d he whispered.</p>\n<p>\u201cHe liked the stickers.\u201d</p>\n<p>\u201cHe liked peeling the stickers off.\u201d</p>\n<p>Ada shifted the peas. \u201cMy father says we stop following through.\u201d</p>\n<p>\u201cYour father thinks childhood is basic training with applesauce.\u201d</p>\n<p>\u201cHe raised four children.\u201d</p>\n<p>\u201cSo did wolves.\u201d</p>\n<p>Ada almost laughed. The sound caught in her throat, and she looked down at Theo.</p>\n<p>On Saturday, Frank arrived with a toolbox and a pound cake. He repaired the loose stair rail before lunch, tightening every screw until the old wood complained. Frank believed most trouble could be traced to looseness.</p>\n<p>Theo followed him from room to room, asking what each tool did. Frank let him hold the level and showed him the green bubble floating between two black lines.</p>\n<p>\u201cSee that?\u201d Frank said. \u201cThere\u2019s correct, and there\u2019s not correct.\u201d</p>\n<p>At dinner, Frank sat at the head of the table by habit. Ada had made meat loaf, carrots glazed with honey, and rice. Theo climbed onto his chair, saw the carrots touching the rice, and climbed down again.</p>\n<p>\u201cI need a different plate.\u201d</p>\n<p>\u201cThat plate is clean,\u201d Frank said.</p>\n<p>\u201cThe carrots touched.\u201d</p>\n<p>\u201cThey\u2019re all going to the same place.\u201d</p>\n<p>\u201cDad,\u201d Ada said.</p>\n<p>Frank held up one square hand. \u201cLet me.\u201d</p>\n<p>Ren looked at Ada. She pressed her lips together.</p>\n<p>Frank turned to Theo. \u201cYou\u2019re six years old. You sit at the table with your family, and you eat what\u2019s served.\u201d</p>\n<p>Theo backed toward the refrigerator.</p>\n<p>\u201cIf you leave this room,\u201d Frank continued, \u201cthere will be no television, no stories, and no dessert.\u201d</p>\n<p>Theo\u2019s eyes darted from Frank to the plate to the humming refrigerator. The pendant light buzzed faintly. Ren had never noticed it before.</p>\n<p>\u201cThe carrots touched,\u201d Theo whispered.</p>\n<p>\u201cYes, they did. Sit down.\u201d</p>\n<p>Theo crawled under the table.</p>\n<p>Frank pulled out his chair. \u201cEnough.\u201d</p>\n<p>\u201cDad, don\u2019t touch him,\u201d Ada said.</p>\n<p>But Frank was already bending, reaching beneath the tablecloth. Theo screamed before Frank\u2019s hand reached his ankle. He shot out the other side, struck his shoulder against a chair, and ran blind into the kitchen. Frank followed.</p>\n<p>\u201cNo running away from me.\u201d</p>\n<p>Theo grabbed the rice bowl and hurled it.</p>\n<p>It missed Frank and shattered against the refrigerator. White grains burst across the floor. Theo made a sound Ren had never heard from him, high and torn, without breath between it and the next. He struck his own temples with both fists.</p>\n<p>Ada caught his wrists. Theo bit her forearm.</p>\n<p>Ren stepped between them and Frank. \u201cGo outside.\u201d</p>\n<p>\u201cI\u2019m not\u2014\u201d</p>\n<p>\u201cGo outside, Frank.\u201d</p>\n<p>Frank stared at him. Rice clung to one trouser cuff.</p>\n<p>\u201cThis is exactly what I\u2019m talking about,\u201d he said, but he went.</p>\n<p>The meltdown lasted nearly an hour. Theo vomited on the bathmat, then sobbed because the bathmat was dirty. When he finally slept, Ada found Frank on the porch, eating pound cake from a paper towel.</p>\n<p>\u201cYou let him run the house,\u201d he said.</p>\n<p>Ada\u2019s sleeve was pulled over the bite mark. \u201cYou frightened him.\u201d</p>\n<p>\u201cI told him to eat dinner.\u201d</p>\n<p>\u201cYou chased him.\u201d</p>\n<p>\u201cI followed him. There\u2019s a difference.\u201d</p>\n<p>\u201cNot if you\u2019re six.\u201d</p>\n<p>Frank brushed crumbs from his shirt. \u201cThe world won\u2019t rearrange itself every time his carrots touch.\u201d</p>\n<p>Ada opened the screen door. \u201cYou don\u2019t get to take charge again.\u201d</p>\n<p>\u201cAda.\u201d</p>\n<p>\u201cYou don\u2019t.\u201d</p>\n<p>For three evenings, they changed nothing. The parsley incident repeated itself as a bath incident, then as a blue-cup incident. On Wednesday, Ren came home early and found Ada standing beneath the pendant light, staring up at it.</p>\n<p>\u201cListen,\u201d she said.</p>\n<p>He listened. The bulb produced a thin electrical whine.</p>\n<p>They turned it off.</p>\n<p>The kitchen became dim except for the lamp above the stove and the last gray light at the window. Theo came in dragging his backpack.</p>\n<p>\u201cWhy\u2019s it dark?\u201d</p>\n<p>\u201cThe big light\u2019s resting,\u201d Ren said.</p>\n<p>Theo considered this. \u201cIt\u2019s loud when it\u2019s on.\u201d</p>\n<p>Ada and Ren looked at each other.</p>\n<p>Before dinner the next night, Ada put crackers and apple slices on the coffee table. Theo ate without being asked. At six, instead of calling him from his blocks, Ren sat on the rug.</p>\n<p>\u201cFive minutes,\u201d he said, placing five wooden tiles in a row. Each minute, Theo put one into a bowl. When the last tile dropped, he carried the bowl to the kitchen.</p>\n<p>On Friday, dinner arrived on three small plates: chicken, rice, cucumber. Nothing touched. Theo ate the rice and one cucumber. Nobody mentioned the chicken.</p>\n<p>On Saturday, Ada wrote four things on a piece of cardboard and drew a crude picture beside each: plate, bath, pajamas, book. Theo laughed at her bathtub.</p>\n<p>\u201cIt looks like a shoe.\u201d</p>\n<p>\u201cThen it\u2019s a shoe bath.\u201d</p>\n<p>He took the marker and added bubbles. After dinner, he moved a clothespin from the plate to the shoe bath.</p>\n<p>When he began to whine because the water was too hot, Ada did not tell him it was the same temperature as always. She ran cold water. She sat on the closed toilet lid and softened her face, letting her eyebrows fall, loosening her mouth.</p>\n<p>Theo watched her.</p>\n<p>\u201cToo many splashes,\u201d he said.</p>\n<p>\u201cWashcloth tonight?\u201d</p>\n<p>He nodded. She drained the tub, and he stood on a towel while she wiped his knees, his armpits, the back of his neck. It took four minutes.</p>\n<p>Frank called during pajamas.</p>\n<p>\u201cYou can\u2019t let a six-year-old opt out of bathing,\u201d he said when Ada told him.</p>\n<p>\u201cHe\u2019s clean.\u201d</p>\n<p>\u201cThat\u2019s not the point.\u201d</p>\n<p>\u201cWhat is the point?\u201d</p>\n<p>Frank was silent long enough for her to hear a television crowd cheering at his house.</p>\n<p>\u201cStandards,\u201d he said.</p>\n<p>The following Tuesday, the supermarket was out of Theo\u2019s round rolls. Ren brought home square ones and braced himself.</p>\n<p>Theo held one in both hands. \u201cThis is wrong.\u201d</p>\n<p>\u201cI know.\u201d</p>\n<p>\u201cWhy did you buy it?\u201d</p>\n<p>\u201cThe round ones were gone.\u201d</p>\n<p>Theo\u2019s breathing quickened. Ren glanced toward the cardboard strip. \u201cCrackers are still here. The square roll can stay on the counter.\u201d</p>\n<p>Theo set it down carefully, as if it were alive. He ate crackers with his soup. Ten minutes later, while Ren loaded the dishwasher, Theo tore a corner from the square roll.</p>\n<p>\u201cIt tastes the same,\u201d he said, offended.</p>\n<p>At school, his teacher sent a note: Theo had raised his hand during music and asked to sit in the hallway because the drums hurt. He returned for the last song wearing headphones borrowed from the office.</p>\n<p>Frank read the note on Sunday.</p>\n<p>\u201cWhen I was his age, we didn\u2019t have special headphones.\u201d</p>\n<p>\u201cWhen you were his age, doctors recommended cigarettes,\u201d Ren said.</p>\n<p>Frank pointed his fork at him. \u201cJokes won\u2019t prepare him for a hard world.\u201d</p>\n<p>Theo entered carrying the divided plate Ada had bought at a yard sale. He set it on the table himself. Frank watched as Theo spooned peas into one section, mashed potatoes into another, and meat loaf into the largest.</p>\n<p>\u201cHe\u2019s serving himself now?\u201d Frank asked.</p>\n<p>\u201cYes,\u201d Ada said.</p>\n<p>Theo took three peas.</p>\n<p>\u201cYou don\u2019t like peas,\u201d Frank said.</p>\n<p>\u201cI like three.\u201d</p>\n<p>He ate the first, swallowed with effort, and drank milk. He ate the second. The third rolled beneath the meat loaf, and his body went still.</p>\n<p>Frank drew breath.</p>\n<p>Ada looked down at her own plate. Ren asked Frank whether the Browns had any hope this year. For several seconds Theo did not move.</p>\n<p>Then he lifted the meat loaf with his fork, retrieved the pea, and returned it to its section.</p>\n<p>\u201cNot under there,\u201d he said.</p>\n<p>\u201cNo,\u201d Ada said. \u201cNot under there.\u201d</p>\n<p>He ate it.</p>\n<p>The worst evenings grew farther apart. There were still nights when the seam of a pajama leg became unbearable, when the dog\u2019s nails on the hallway floor sent Theo under a blanket, when a broken banana seemed to him an injury no one else respected. But now the scissors lived in the bathroom drawer for cutting out tags. A folded blanket waited beneath the kitchen bench. The dog wore soft caps on her nails after five o\u2019clock and walked like a suspicious ballerina.</p>\n<p>Ren and Ada learned to speak less. They stopped offering six solutions while Theo was drowning in the first problem. They said, \u201cI\u2019m here.\u201d They said, \u201cShow me.\u201d Sometimes Theo showed them. Sometimes he could not.</p>\n<p>In November, Frank came for dinner during a thunderstorm. The power failed as Ada took a casserole from the oven.</p>\n<p>The refrigerator stopped humming. The house went black.</p>\n<p>Theo cried out.</p>\n<p>Ren found the camping lantern, but before he switched it on, lightning filled the kitchen white. Thunder cracked immediately overhead. Theo dropped to the floor with his hands over his ears.</p>\n<p>Frank rose.</p>\n<p>Ada said, \u201cWait.\u201d</p>\n<p>Rain battered the windows. In the dark, Theo\u2019s breath came fast and shallow.</p>\n<p>Then Frank took something from his coat pocket. The green level, small enough for a shirt pocket. He crouched and placed it on the floor in front of Theo.</p>\n<p>\u201cCan\u2019t see the bubble,\u201d Theo said.</p>\n<p>Frank turned on the lantern at its lowest setting and set it behind the level. The vial glowed pale green.</p>\n<p>\u201cThere,\u201d Frank said.</p>\n<p>Theo leaned closer. His hands came down from his ears. Frank stayed crouched, knees cracking, while Theo watched the bubble tremble and settle between the lines.</p>\n<p>When the power returned, the pendant light blazed and whined.</p>\n<p>Frank stood and switched it off.</p>\n<p>\u201cTerrible fixture,\u201d he said. \u201cI\u2019ll replace it Tuesday.\u201d</p>\n<p>He did not apologize. Ada did not ask him to.</p>\n<p>On Tuesday he installed three small lights beneath the cabinets, each with its own switch. Theo lay on the kitchen floor and handed him screws.</p>\n<p>At six-fifteen, rain slid down the dark window. One small light shone above the stove. Theo moved the clothespin from plate to bath, then paused.</p>\n<p>\u201cCan I have the shoe bath?\u201d</p>\n<p>Ada handed him the washcloth.</p>\n<p>At the table, three peas sat in their own white compartment. Theo ate one. Frank tightened the last screw beneath the cabinet. Ren cut a square roll in half, and the dog, in her blue nail caps, waited silently for crumbs.</p>"}, {"id": "PC8", "title": "Five O'Clock", "html": "<p>The heel mark was still on the drywall by the bathroom door, a gray crescent at the height of a six-year-old's kick, and Ren had stopped painting over it because he'd painted over it twice.</p>\n<p>Tuesday, 6:40. Theo was on the bathmat with his shirt half off, one arm still in the sleeve, screaming in the register that made the dog leave the room. Ada knelt at the tub with her hand in the water, keeping it warm, because the water going cold was a whole second thing.</p>\n<p>\"Buddy. Shirt off, then in. Two steps.\"</p>\n<p>\"I HATE the water I HATE it it's TOO MUCH WATER\u2014\"</p>\n<p>\"It's the same water as last night.\"</p>\n<p>That was true and it was the wrong thing to say and she knew it before the sentence finished. He went from red to something past red. Ren came up the stairs two at a time with the calm face on, the one they'd agreed to keep, and got his hands under Theo's arms and held him, not restraining, just there, while Theo bucked and shrieked and eventually went slack and sobbed into Ren's collarbone for eleven minutes.</p>\n<p>Downstairs, on the refrigerator, the chart had forty-one stickers on it. They'd been consistent. They'd been so consistent. They had read the books with the sensible covers and done what the books said and done it the same way on Wednesdays as on Sundays, and here was the forty-first sticker and here was the heel mark.</p>\n<p>Ren came down at 8:15 and stood in the kitchen with his shirt wet down the front.</p>\n<p>\"He's out.\"</p>\n<p>\"Okay.\"</p>\n<p>\"He said sorry. Twice.\"</p>\n<p>\"He always says sorry,\" Ada said. \"That's the part that kills me.\"</p>\n<p>---</p>\n<p>Sunday, Frank came for dinner and brought a bag of apples nobody had asked for, which was his way, and sat in the chair he always sat in.</p>\n<p>\"He's a good kid,\" Frank said, meaning it. \"That's not the question. The question is what he's allowed to learn about what happens when he does that.\"</p>\n<p>\"He's not doing it,\" Ada said. \"It happens to him.\"</p>\n<p>\"Sure. And the first few times, it happens to him.\" Frank buttered his bread the way he'd buttered bread for fifty years, corner to corner. \"Then he finds out what it gets him. That's not a moral failing, Ada, that's just a kid being a kid. Danny used to do the same thing, and Danny is a fine man with a mortgage.\"</p>\n<p>\"Danny was different.\"</p>\n<p>\"Danny was wound so tight he chewed through the strap on his own backpack. I made him sit at that table until the peas were gone and I sat there with him and it took two hours and it never took two hours again.\" He said it without heat. He wasn't scoring points. \"I'm not saying be cruel. I never laid a hand on any of you and I never yelled where you could hear it. I'm saying the world is not going to turn its lights down for him. His teacher won't. His boss won't. His wife won't. Every year you carry him is a year he doesn't build the muscle, and the load doesn't get lighter, it gets heavier. Teaching him to bend a little now, when it's cheap \u2014 that's the kindest thing you'll ever do for him. It doesn't feel kind. It is.\"</p>\n<p>Ren looked at his father-in-law and thought, not for the first time, that the man had never once made an argument in bad faith, which was the whole trouble with him.</p>\n<p>\"And if he can't,\" Ren said.</p>\n<p>\"Can't is a big word for six,\" Frank said. \"You'd be amazed what people can do when somebody expects it of them. That's not me being hard. That's the nicest thing I know about people.\"</p>\n<p>---</p>\n<p>The scene that broke it open happened in the parking lot of a trampoline place on a Saturday, at a birthday party for a boy named Callum whom Theo did not particularly like.</p>\n<p>Ninety minutes of noise like weather. Foam pit, air horn, eleven kids, pizza under a heat lamp, and a song about a shark playing twice. Theo held it. He held it through cake. He held it through the goodie bag. He got to the door and a woman held it open for him and said, brightly, \"What do you say?\" and he lay down on the rubber mat between the two sets of doors and screamed until the veins stood up in his forehead, and did not stop for twenty-five minutes, in front of every parent in Franklin County.</p>\n<p>Ada carried him to the car like a rolled rug. She was strong and he was fifty-one pounds and she did not cry until Powell Road.</p>\n<p>At home, with him asleep at four in the afternoon, they had the fight.</p>\n<p>\"He held it together for an hour and a half,\" Ren said. \"That's not a kid who won't. That's a kid who ran out.\"</p>\n<p>\"So what, we skip the parties? We skip everything? He's six, Ren, he has a whole life of trampoline places.\"</p>\n<p>\"I'm saying maybe we stop asking him to do the hardest thing at the hardest hour of the day and then punishing him for the part where he can't.\"</p>\n<p>\"Say it in English.\"</p>\n<p>\"Fine. I think what we're doing isn't working and I think it's been not working for a year.\"</p>\n<p>\"What we're doing,\" Ada said. \"You mean me. I'm the one at the tub. I'm the one who made the chart.\"</p>\n<p>\"That's not\u2014\"</p>\n<p>\"I made the chart because you were traveling and somebody had to do something and it was me at seven o'clock every single night for a year.\" Her voice went to a place it didn't go. \"So say what you mean. Say I've been hurting him.\"</p>\n<p>The refrigerator hummed. Ren didn't say it. Ada sat down on the floor of her own kitchen with her back against the dishwasher, which was still warm, and said it herself, which was worse.</p>\n<p>\"I've been walking him into a wall every night at seven and calling it teaching him.\"</p>\n<p>---</p>\n<p>They didn't announce anything. There was no plan on paper. They just started moving furniture.</p>\n<p>Dinner went to 5:10, which meant Ren left work at 4:30 twice a week and ate cold leftovers himself at nine. The overhead light in the kitchen \u2014 a four-bulb fixture that Ada had loved \u2014 stayed off, and a lamp from the guest room came downstairs and lived on the counter, and the whole room turned the color of a gas station at dusk, and Ada hated how it looked and left it.</p>\n<p>The plate came already made. No <em>do you want</em>. Chicken, apple slices, the crackers he liked, the three things not touching, put down in front of him without ceremony, and nobody watched him eat it. Ren stopped narrating. Ada stopped crouching to eye level and taking him by the shoulders, which every book had told her to do and which she now understood he experienced roughly the way you'd experience a stranger gripping your arms and putting their face six inches from yours.</p>\n<p>Bath moved to morning. Just \u2014 moved. Some nights there was no bath and he went to bed with playground on his hands and the world did not end.</p>\n<p>They cut the eight-minute warning to two, because eight minutes turned out to be eight minutes of dread and the countdown was doing the damage, not the transition.</p>\n<p>They took the TV off before he came downstairs, so the house was already quiet instead of going quiet.</p>\n<p>Nothing happened for nine days. Nine days of the lamp and the early dinner and the shrieking anyway, and Ada thought, in the honest part of the night, that they had traded a system that didn't work for no system at all.</p>\n<p>On the tenth day Theo ate his dinner, got down, and went to get his own pajamas. Neither of them said a word about it. Ren stood at the sink with a plate in his hand and did not turn around.</p>\n<p>It wasn't a switch. Three good nights, then a Thursday where he threw a fork hard enough to chip the trim and screamed for forty minutes about a sock. Then a stomach bug in February that put them back to two meltdowns a night for two solid weeks, and Ada, at the end of it, said, <em>it's gone, whatever it was, we lost it,</em> and it came back the following Tuesday, slowly, like a tide.</p>\n<p>---</p>\n<p>In March, Frank came over to help move a cord of firewood off the driveway before the rain.</p>\n<p>He didn't ask Theo to help. He put a pair of his own work gloves on the step, way too big, and said, \"Two at a time. Split side up. Stack's over there,\" and turned his back and got to work.</p>\n<p>Theo hauled wood for forty minutes.</p>\n<p>Ada watched from the kitchen window with a dish towel she wasn't using. Her father did not praise him. He did not check in on his feelings. Twice he said, \"Not like that. Like this,\" and showed him once, and Theo did it like that. When Theo dropped a log on his own foot and his face went to the place that preceded everything, Frank said, \"Yep. That happens,\" and kept stacking, and Theo stood there for four or five seconds with his whole body deciding, and then picked the log up.</p>\n<p>At the end Frank said, \"That's a stack,\" and Theo said, \"That's a stack,\" and they both looked at it.</p>\n<p>\"He just needed a job,\" Frank said in the kitchen after, running his hands under the tap. \"Kid's got a motor. You give a motor nothing to do, it shakes the car apart.\"</p>\n<p>He was right. He was so obviously right that Ada felt something turn over in her chest, because they had spent a year managing Theo and had somehow never once simply handed him something heavy and walked away.</p>\n<p>Frank dried his hands and looked at the lamp on the counter, and at the clock, which said 4:55, and at the table already set.</p>\n<p>\"You're doing it different,\" he said.</p>\n<p>\"We are.\"</p>\n<p>\"He seems all right.\" Frank folded the towel. \"I still think you're building him a room he'll have to leave someday.\"</p>\n<p>\"Maybe,\" Ada said.</p>\n<p>\"I hope I'm wrong.\" He said it plainly, no edge on it. \"I've been wrong about plenty. Ask your mother.\" He put the towel on the oven handle, crooked, the way he always did. \"You want me to stay for dinner or is that a lot for him?\"</p>\n<p>Ada thought about it honestly, which he'd taught her to do.</p>\n<p>\"Stay,\" she said. \"But sit on that side. He doesn't like being between people.\"</p>\n<p>Frank moved his chair one seat over, and that was the entire negotiation, and it took two seconds, and neither of them ever mentioned it again.</p>\n<p>---</p>\n<p>Five-ten. The lamp on, the big light off, the window over the sink gone blue.</p>\n<p>Theo is at the table with the plate in front of him, chicken and apple slices and crackers, none of it touching. Frank is beside him working a splinter out of his own thumb with a pocketknife and not talking. Ren carries over the water glasses, two hands, and sets one down by Theo's left elbow where it goes.</p>\n<p>Theo picks up a cracker, breaks it in half, and eats the half.</p>\n<p>Outside, the wood stack darkens against the fence. Somebody's dog barks twice and stops. Ada sits down last, in the quiet, and pulls her chair in.</p>"}, {"id": "PH0", "title": "The Blue Bowl", "html": "<p>The first thing to go was the peas.</p>\n<p>Theo had eaten them the week before, lifting each one from the tines of his fork with solemn concentration. Tonight they touched the rice.</p>\n<p>\u201cThey\u2019re just beside it,\u201d Ren said.</p>\n<p>\u201cThey touched.\u201d</p>\n<p>\u201cYou don\u2019t have to eat the rice they touched,\u201d Ada said. \u201cYou can eat the other side.\u201d</p>\n<p>Theo pressed his hands over his ears. The kitchen fan hummed above the stove. A truck labored up the wet street, gears grinding. On the counter, Ada\u2019s phone buzzed against the fruit bowl.</p>\n<p>\u201cHands down, please,\u201d Ren said. \u201cWe\u2019re at the table.\u201d</p>\n<p>\u201cI can\u2019t.\u201d</p>\n<p>\u201cYou can,\u201d said Frank.</p>\n<p>He sat across from Theo with his napkin folded beside his plate. Ada\u2019s father was a broad, white-haired man who still polished his shoes on Sundays. He had raised four children in a house with one bathroom and no discussion about whether carrots were acceptable in rounds but not sticks.</p>\n<p>\u201cThe peas haven\u2019t changed,\u201d Frank said. His voice was level, not loud. \u201cYou ate them before. Take one bite, then leave the rest if you don\u2019t care for them.\u201d</p>\n<p>Theo made a sound like a hinge tearing loose.</p>\n<p>Ada reached for his plate. Ren caught her eye. They had agreed not to remove rejected food. Dr. Levin\u2019s handout was held to the refrigerator by a magnet shaped like a lemon: parents decide what and when; children decide whether and how much.</p>\n<p>\u201cTheo,\u201d Ada said, \u201cyou may eat what\u2019s on your plate, or you may wait until breakfast.\u201d</p>\n<p>The screaming began.</p>\n<p>He kicked the table leg. Water jumped from the glasses. Frank lifted his own glass before it tipped.</p>\n<p>\u201cWe don\u2019t kick furniture,\u201d Ren said. \u201cIf you kick again, you\u2019ll lose your story.\u201d</p>\n<p>Theo kicked again, harder.</p>\n<p>\u201cAll right. No story tonight.\u201d</p>\n<p>Theo swept his plate to the floor.</p>\n<p>The blue bowl broke under it. One white fracture ran through the painted rabbit at the bottom.</p>\n<p>For several seconds, the only sound was Theo dragging air into himself. His face had gone dark red except around his mouth.</p>\n<p>Ada stood. \u201cDad, could you\u2014\u201d</p>\n<p>\u201cI\u2019ll sweep,\u201d Frank said.</p>\n<p>\u201cNo.\u201d She had not meant it sharply, but it came out sharp. \u201cPlease just leave it.\u201d</p>\n<p>Frank put both palms on the table and rose. \u201cI\u2019ll call tomorrow.\u201d</p>\n<p>At the door, he crouched to Theo, who had folded himself beneath the coat hooks.</p>\n<p>\u201cGood night, Theodore.\u201d</p>\n<p>Theo did not look up.</p>\n<p>Frank waited.</p>\n<p>\u201cGood night, Grandpa,\u201d Theo whispered.</p>\n<p>After he left, Ren carried Theo upstairs sideways, one arm under his knees, the other around his ribs. Theo struck Ren\u2019s shoulder with the back of his head all the way up.</p>\n<p>Later, when the house was quiet, Ada set the two halves of the rabbit bowl on the counter.</p>\n<p>\u201cWe did exactly what we said we\u2019d do,\u201d Ren said.</p>\n<p>\u201cI know.\u201d</p>\n<p>\u201cWe stayed calm.\u201d</p>\n<p>\u201cI know.\u201d</p>\n<p>\u201cWe gave one warning.\u201d</p>\n<p>\u201cI was there.\u201d</p>\n<p>Ren picked up a shard no bigger than a fingernail. \u201cWhat do you want me to say?\u201d</p>\n<p>Ada looked toward the ceiling. \u201cI want you to stop sounding like the evening went well.\u201d</p>\n<p>By the next Thursday, they had bought another chart. Theo chose silver stars. Three stars earned a cartoon after school; ten earned a trip to the train museum. He got two the first night. On the second, he tore the chart from the refrigerator because Ada put toothpaste on his brush before he was ready.</p>\n<p>They tried earlier baths. Later baths. A sand timer. A digital timer with a red wedge that vanished minute by minute. They gave choices: bath or shower, pajamas before teeth or teeth before pajamas, two books or three short ones. Theo answered every choice with another question until Ren\u2019s voice acquired an edge he could hear and could not file off.</p>\n<p>One Saturday, the three of them went to buy winter boots.</p>\n<p>The store was hot and smelled of rubber. A radio played over the ceiling speakers. Ren knelt with a boot in each hand.</p>\n<p>\u201cBlue or gray?\u201d</p>\n<p>Theo stared.</p>\n<p>\u201cThe blue ones light up,\u201d Ada said.</p>\n<p>\u201cBut the gray ones feel softer,\u201d Ren said.</p>\n<p>A clerk rolled a ladder past them. Metal rattled against metal.</p>\n<p>\u201cBlue or gray, bud?\u201d</p>\n<p>Theo backed into a display of slippers.</p>\n<p>\u201cWe need an answer.\u201d</p>\n<p>\u201cI don\u2019t know.\u201d</p>\n<p>\u201cYou can try both.\u201d</p>\n<p>\u201cNo.\u201d</p>\n<p>\u201cTheo, your old boots leak.\u201d</p>\n<p>\u201cI DON\u2019T KNOW.\u201d</p>\n<p>People turned. Theo yanked off one shoe and threw it. It struck a cardboard snowman, which rocked on its base and fell flat in the aisle.</p>\n<p>Ada carried him to the car in one sock. He bit through the shoulder of her sweater.</p>\n<p>They sat in the parking lot while rain grayed the windshield. Theo sobbed against the back seat, exhausted now, his bare foot tucked under him.</p>\n<p>Ren held up the blue boot they had somehow paid for. \u201cAt least we got them.\u201d</p>\n<p>Ada turned so fast the seat belt locked across her chest.</p>\n<p>\u201cThat is not funny.\u201d</p>\n<p>\u201cI didn\u2019t say it was.\u201d</p>\n<p>\u201cYou always do this. You turn everything into something we survived.\u201d</p>\n<p>\u201cWhat would you like me to turn it into?\u201d</p>\n<p>She pulled the collar of her sweater aside. The skin beneath showed two wet crescents and a purple center.</p>\n<p>\u201cThis,\u201d she said. \u201cI\u2019d like you to look at this.\u201d</p>\n<p>Ren did.</p>\n<p>From the back seat came Theo\u2019s small, hoarse voice. \u201cToo many boots.\u201d</p>\n<p>That night, they did not ask him whether he wanted a bath. Ada filled it halfway and left the bathroom light off. The hall light made a pale road acros
